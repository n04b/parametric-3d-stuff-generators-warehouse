<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ornament — генератор рельефной плитки</title>
<style>
  :root {
    --bg: #d9d6cf;
    --panel: #f7f6f3;
    --panel-2: #efede8;
    --line: #dddad4;
    --text: #23221f;
    --muted: #7b776f;
    --accent: #8a4b2f;
    --accent-2: #6f3a23;
    --warn: #b5532f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; width: 100vw; height: 100vh; }

  #view { position: relative; flex: 1 1 auto; min-width: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #hud { position: absolute; left: 14px; top: 12px; font-size: 12px; color: #5d5a54; line-height: 1.6; pointer-events: none; }
  #hud b { color: var(--text); }
  #stats {
    position: absolute; left: 14px; bottom: 12px; font-size: 12px; color: #4a4843; line-height: 1.55;
    background: rgba(247,246,243,.85); padding: 8px 11px; border-radius: 8px; pointer-events: none;
    font-variant-numeric: tabular-nums; max-width: calc(100% - 28px);
  }
  #stats .warn { color: var(--warn); }
  #views { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  #views button { flex: 0 0 auto; padding: 6px 10px; background: rgba(247,246,243,.92); }
  #views button.on { background: var(--accent); color: #fff; border-color: transparent; }
  #busy {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(35,34,31,.85); color: #fff;
    padding: 10px 16px; border-radius: 8px; font-size: 13px; display: none;
  }

  #panel {
    flex: 0 0 370px; width: 370px; height: 100%; overflow-y: auto;
    background: var(--panel); border-left: 1px solid var(--line); padding-bottom: 40px;
  }
  .head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 5; }
  .head h1 { font-size: 15px; margin: 0; }
  .head p { margin: 4px 0 0; font-size: 11px; color: var(--muted); }

  .group { border-bottom: 1px solid var(--line); }
  .group > .title {
    display: flex; justify-content: space-between; align-items: center; padding: 11px 18px; cursor: pointer;
    user-select: none; font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--muted);
  }
  .group > .title:hover { color: var(--text); }
  .chev { transition: transform .15s; font-size: 10px; }
  .group.collapsed > .title .chev { transform: rotate(-90deg); }
  .group.collapsed > .body { display: none; }
  .group > .body { padding: 2px 18px 14px; }
  .sub { font-size: 11px; font-weight: 600; color: var(--muted); margin: 14px 0 2px; text-transform: uppercase; letter-spacing: .4px; }

  .row { margin: 9px 0; }
  .row.hidden { display: none; }
  .row > label { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 4px; }
  .row > label .unit { color: var(--muted); font-size: 11px; margin-left: 3px; }
  .row input.num {
    width: 74px; text-align: right; padding: 3px 6px; font-size: 12px; border: 1px solid var(--line);
    border-radius: 5px; background: #fff; color: var(--text); font-variant-numeric: tabular-nums;
  }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); }
  select {
    width: 100%; background: #fff; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; font-size: 12px;
  }
  .row > label.check { display: flex; justify-content: flex-start; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; margin: 0; }
  .check input { width: 15px; height: 15px; accent-color: var(--accent); margin: 0; }
  .color { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
  .color input { width: 44px; height: 24px; border: 1px solid var(--line); border-radius: 5px; padding: 0 2px; background: #fff; }

  button {
    flex: 1 1 auto; background: #fff; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; font-size: 12px; cursor: pointer; font-weight: 500;
  }
  button:hover { border-color: #b9b5ad; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
  button.primary:hover { background: var(--accent-2); }
  .btnrow { display: flex; gap: 7px; flex-wrap: wrap; margin: 8px 0; }
  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .presets button { text-align: left; padding: 7px 9px; }
  .hint { font-size: 11px; color: var(--muted); line-height: 1.5; margin: 6px 0 0; }

  /* Слои */
  .layer { border: 1px solid var(--line); border-radius: 8px; background: #fff; margin: 8px 0; }
  .layer.off { opacity: .55; }
  .layer > .lhead { display: flex; align-items: center; gap: 6px; padding: 6px 8px; cursor: pointer; user-select: none; }
  .layer > .lhead .sw { width: 12px; height: 12px; border-radius: 3px; flex: 0 0 auto; border: 1px solid rgba(0,0,0,.15); }
  .layer > .lhead .name { flex: 1 1 auto; font-size: 12px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .layer > .lhead .name small { font-weight: 400; color: var(--muted); }
  .layer > .lhead input { width: 15px; height: 15px; accent-color: var(--accent); margin: 0; }
  .layer > .lhead button { flex: 0 0 auto; padding: 2px 6px; font-size: 11px; line-height: 1.3; }
  .layer > .lbody { padding: 0 10px 8px; border-top: 1px solid var(--line); }
  .layer.collapsed > .lbody { display: none; }
  .addrow { display: flex; gap: 6px; margin-top: 10px; }
  .addrow select { flex: 1 1 auto; }
  .addrow button { flex: 0 0 auto; }

  @media (max-width: 760px) {
    body { overflow: auto; }
    #app { flex-direction: column; height: auto; }
    #view { flex: 0 0 58vh; height: 58vh; }
    #panel { flex: none; width: 100%; height: auto; border-left: 0; border-top: 1px solid var(--line); }
    .head { position: static; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="hud"><b>Ornament</b> · вращение — ЛКМ · зум — колесо · сдвиг — ПКМ</div>
    <div id="views">
      <button data-mode="tile">Плитка</button>
      <button data-mode="array">Массив</button>
      <span style="width:8px"></span>
      <button data-view="front">Анфас</button>
      <button data-view="angle">3/4</button>
      <button data-view="graze">Скользящий свет</button>
    </div>
    <div id="stats"></div>
    <div id="busy">Считаю…</div>
  </div>

  <div id="panel">
    <div class="head">
      <h1>Генератор рельефной плитки</h1>
      <p>Квадрат, соты, восьмиугольник, круг. Орнамент из слоёв-мотивов. Все размеры — в миллиметрах. Экспорт в STL.</p>
    </div>

    <div class="group" id="g-presets">
      <div class="title">Пресеты <span class="chev">▾</span></div>
      <div class="body">
        <div class="presets" id="presets"></div>
        <div class="btnrow">
          <button id="rnd-sq">Случайная: квадрат</button>
          <button id="rnd-hex">Случайная: соты</button>
        </div>
      </div>
    </div>
    <div id="sections"></div>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="core.js"></script>
<script src="presets.js"></script>
<script>
'use strict';
const OC = OrnamentCore, { PRESETS, randomDesign } = OrnamentPresets;
const STORE_KEY = 'ornament-design-v1';

/* =========================================================================
   СХЕМЫ ПАРАМЕТРОВ
   ========================================================================= */
const is = (k, ...vals) => (p) => vals.includes(p[k]);
const not = (k, ...vals) => (p) => !vals.includes(p[k]);
const R_ = (k, l, min, max, step, u, show) => ({ k, t: 'range', l, min, max, step, u, show });
const I_ = (k, l, min, max, show) => ({ k, t: 'range', l, min, max, step: 1, int: true, show });
const S_ = (k, l, opts, show) => ({ k, t: 'select', l, opts, show });
const C_ = (k, l, show) => ({ k, t: 'check', l, show });

const SHAPES = [['square', 'Квадрат'], ['hexFlat', 'Шестиугольник, гранью вверх'], ['hexPointy', 'Шестиугольник, углом вверх'], ['octagon', 'Восьмиугольник'], ['circle', 'Круг']];
const isHex = (p) => p.shape === 'hexFlat' || p.shape === 'hexPointy';

const SECTIONS = [
  { title: 'Плитка', items: [
    S_('shape', 'Форма', SHAPES),
    R_('size', 'Размер (между гранями / диаметр)', 30, 400, 1, 'мм'),
    C_('scaleLink', 'Масштабировать узор вместе с плиткой'),
    R_('T', 'Толщина основания', 1, 40, 0.1, 'мм'),
    R_('reliefScale', 'Масштаб высоты рельефа', 0, 4, 0.01),
    R_('edgeR', 'Скругление верхней кромки', 0, 10, 0.1, 'мм'),
    { k: 'bg', t: 'color', l: 'Цвет фона (превью)' },
  ] },
  { title: 'Слои орнамента', id: 'g-layers', layers: true },
  { title: 'Поверхность и глазурь', items: [
    R_('blur', 'Заплыв глазури (сглаживание)', 0, 3, 0.05, 'мм'),
    { sub: 'Кракелюр (сетка трещин)' },
    R_('crackSize', 'Размер ячеек (0 — выкл.)', 0, 40, 0.5, 'мм'),
    R_('crackDepth', 'Глубина трещин', 0, 1, 0.01, 'мм', (p) => p.crackSize > 0),
    R_('crackW', 'Ширина трещин', 0.05, 2, 0.01, 'мм', (p) => p.crackSize > 0),
    { sub: 'Шагрень (фактура)' },
    R_('grain', 'Амплитуда (0 — выкл.)', 0, 2, 0.01, 'мм'),
    R_('grainSize', 'Размер зерна', 0.2, 10, 0.1, 'мм', (p) => p.grain > 0),
    I_('seed', 'Seed', 1, 9999),
  ] },
  { title: 'Массив плиток', items: [
    I_('cols', 'Колонок', 1, 30),
    I_('rows', 'Рядов', 1, 30),
    R_('gap', 'Шов между плитками', 0, 20, 0.1, 'мм'),
    S_('rotMode', 'Поворот плиток', [['none', 'Нет'], ['checker', 'Шахматы'], ['pinwheel', 'Вертушка 2×2'], ['rows', 'По рядам'], ['cols', 'По колонкам'], ['random', 'Случайно']]),
    { sub: 'Затухание рельефа к краям массива' },
    S_('fade', 'Затухание', [['none', 'Нет'], ['edges', 'К краям (прямоугольник)'], ['radial', 'От центра (эллипс)'], ['side', 'С одной стороны (градиент)']]),
    R_('fadeW', 'Ширина зоны затухания', 5, 2000, 1, 'мм', not('fade', 'none')),
    R_('fadeMin', 'Остаток рельефа на краю', 0, 1, 0.01, '', not('fade', 'none')),
    R_('fadeCurve', 'Кривая (гамма)', 0.2, 4, 0.05, '', not('fade', 'none')),
    R_('fadeAng', 'Направление нарастания', -180, 180, 1, '°', is('fade', 'side')),
    R_('fadeNoise', 'Рваная граница', 0, 1, 0.01, '', not('fade', 'none')),
  ] },
  { title: 'Предпросмотр', collapsed: true, items: [
    R_('stepPreview', 'Шаг сетки превью', 0.2, 3, 0.05, 'мм'),
    R_('gloss', 'Блеск глазури', 0, 1, 0.01),
    R_('lightAz', 'Направление света', -180, 180, 1, '°'),
    R_('lightEl', 'Высота света', 5, 90, 1, '°'),
  ] },
  { title: 'Экспорт', id: 'g-export', items: [
    R_('stepExport', 'Шаг сетки STL (меньше — точнее и тяжелее)', 0.1, 2, 0.05, 'мм'),
    { html: `
      <div class="btnrow"><button class="primary" id="ex-tile">STL — одна плитка</button></div>
      <div class="btnrow">
        <button id="ex-array">STL — весь массив</button>
        <button id="ex-zip">ZIP — каждая плитка</button>
      </div>
      <div class="btnrow">
        <button id="ex-json">Сохранить параметры</button>
        <button id="im-json">Загрузить…</button>
        <input type="file" id="im-file" accept=".json,application/json" hidden />
      </div>
      <p class="hint">Каждая плитка — замкнутое тело, дно на z = 0, рельеф вверх. «Одна плитка» — без затухания.
      При затухании все плитки массива разные, поэтому ZIP содержит отдельный файл на каждую (R — ряд, C — колонка).
      Без затухания плитки одинаковые: в ZIP одна плитка и схема раскладки.</p>
      <p class="hint" id="ex-est"></p>` },
  ] },
];

const MODE_OPTS = [['raise', 'Наплыв (объединение)'], ['add', 'Наложение (поверх)'], ['cut', 'Вырезать (углубление)']];
const PROF_OPTS = [['round', 'Скруглённый'], ['chamfer', 'Фаска (грани)'], ['smooth', 'Плавный'], ['cove', 'Вогнутый']];
const MOTIF_ITEMS = {
  petal: [
    R_('len', 'Длина', 0.5, 250, 0.1, 'мм'), R_('wid', 'Ширина', 0.2, 150, 0.1, 'мм'),
    R_('bend', 'Изгиб', -360, 360, 1, '°'),
    S_('shape', 'Контур', [['curve', 'Плавный'], ['straight', 'Прямой (ромб / воздушный змей)']]),
    R_('tipS', 'Острота кончика', 0, 1, 0.01, '', is('shape', 'curve')),
    R_('baseS', 'Острота основания', 0, 1, 0.01, '', is('shape', 'curve')),
    R_('bulge', 'Положение самого широкого места', 0.05, 0.95, 0.01),
    R_('notch', 'Вырез на кончике (сердечко)', 0, 1, 0.01),
    R_('vein', 'Глубина прожилки', 0, 5, 0.05, 'мм'),
    R_('veinW', 'Ширина прожилки', 0.2, 6, 0.05, 'мм', (p) => p.vein > 0),
  ],
  disc: [R_('rad', 'Радиус', 0.3, 200, 0.1, 'мм'), R_('ring', 'Ширина кольца (0 — сплошной)', 0, 100, 0.1, 'мм'), R_('sector', 'Сектор', 1, 360, 1, '°')],
  rect: [R_('rw', 'Длина (вдоль оси)', 0.5, 400, 0.1, 'мм'), R_('rh', 'Ширина', 0.5, 400, 0.1, 'мм'), R_('rr', 'Скругление углов', 0, 100, 0.1, 'мм')],
  scroll: [
    R_('r1', 'Внешний радиус спирали', 0.5, 80, 0.1, 'мм'), R_('r0', 'Внутренний радиус', 0, 40, 0.1, 'мм'),
    R_('turns', 'Витков', 0.1, 5, 0.01), R_('w0', 'Толщина у начала спирали', 0.2, 20, 0.1, 'мм'),
    R_('w1', 'Толщина в центре', 0.2, 20, 0.1, 'мм'), R_('tail', 'Длина хвоста', 0, 200, 0.5, 'мм'),
    R_('wt', 'Толщина конца хвоста', 0.2, 20, 0.1, 'мм', (p) => p.tail > 0),
    R_('tailBend', 'Изгиб хвоста', -360, 360, 1, '°', (p) => p.tail > 0),
    R_('knob', 'Шарик в центре', 0, 15, 0.1, 'мм'),
  ],
  curve: [
    R_('x0', 'Начало X', -200, 200, 0.5, 'мм'), R_('y0', 'Начало Y', -200, 200, 0.5, 'мм'),
    R_('x1', 'Опора 1 X', -200, 200, 0.5, 'мм'), R_('y1', 'Опора 1 Y', -200, 200, 0.5, 'мм'),
    R_('x2', 'Опора 2 X', -200, 200, 0.5, 'мм'), R_('y2', 'Опора 2 Y', -200, 200, 0.5, 'мм'),
    R_('x3', 'Конец X', -200, 200, 0.5, 'мм'), R_('y3', 'Конец Y', -200, 200, 0.5, 'мм'),
    R_('w0', 'Толщина в начале', 0.2, 30, 0.1, 'мм'), R_('w1', 'Толщина в конце', 0.2, 30, 0.1, 'мм'),
    R_('knob0', 'Шарик в начале', 0, 15, 0.1, 'мм'), R_('knob1', 'Шарик в конце', 0, 15, 0.1, 'мм'),
  ],
  arc: [R_('rad', 'Радиус', 0.5, 250, 0.1, 'мм'), R_('a0', 'Начальный угол', -180, 180, 1, '°'), R_('sweep', 'Длина дуги', 1, 360, 1, '°'), R_('aw', 'Толщина', 0.2, 40, 0.1, 'мм')],
  line: [R_('len', 'Длина', 0.5, 500, 0.5, 'мм'), R_('lwid', 'Толщина', 0.2, 60, 0.1, 'мм')],
  star: [I_('pts', 'Лучей', 2, 40), R_('rad', 'Радиус', 0.5, 250, 0.1, 'мм'), R_('inner', 'Внутренний радиус (доля)', 0.02, 1, 0.005)],
  polygram: [I_('pts', 'Вершин n', 3, 48), I_('skip', 'Шаг k', 1, 23), R_('rad', 'Радиус', 0.5, 250, 0.1, 'мм'), R_('gw', 'Толщина линий', 0.2, 12, 0.1, 'мм')],
  lobed: [R_('rad', 'Радиус', 0.5, 250, 0.1, 'мм'), I_('lobes', 'Лопастей', 1, 32), R_('amp', 'Глубина выемок', 0, 1, 0.01), R_('sharp', 'Форма лопасти', 0.05, 3, 0.01)],
  frame: [R_('inset', 'Отступ от края', 0, 100, 0.1, 'мм'), R_('fw', 'Ширина рамки', 0.3, 200, 0.1, 'мм')],
};
const notFrame = (p) => p.type !== 'frame';
const grid = (p) => notFrame(p) && p.rep === 'grid';
const COMMON_ITEMS = [
  { sub: 'Рельеф' },
  S_('mode', 'Режим', MODE_OPTS),
  R_('H', 'Высота / глубина', 0, 40, 0.05, 'мм'),
  S_('prof', 'Профиль склона', PROF_OPTS),
  R_('bevel', 'Ширина склона', 0.05, 60, 0.05, 'мм'),
  S_('style', 'Заливка', [['fill', 'Сплошная'], ['outline', 'Только контур']]),
  R_('lw', 'Толщина контура', 0.2, 20, 0.1, 'мм', is('style', 'outline')),
  R_('tiltX', 'Наклон вдоль оси мотива', -60, 60, 0.5, '°'),
  R_('tiltY', 'Наклон поперёк оси', -60, 60, 0.5, '°'),
  S_('stripe', 'Рифление', [['none', 'Нет'], ['linear', 'Параллельные полосы'], ['rings', 'Кольца'], ['rays', 'Лучи'], ['contour', 'По контуру (вложенные)']]),
  R_('sPer', 'Шаг рифления', 0.3, 40, 0.05, 'мм', (p) => ['linear', 'rings', 'contour'].includes(p.stripe)),
  R_('sAng', 'Угол полос', -180, 180, 1, '°', is('stripe', 'linear')),
  I_('sRays', 'Лучей на круг', 2, 360, is('stripe', 'rays')),
  R_('sDepth', 'Глубина рифления', 0, 20, 0.05, 'мм', not('stripe', 'none')),
  S_('sWave', 'Форма рифления', [['tri', 'Треугольная (гребни)'], ['sine', 'Синусоида'], ['step', 'Ступени']], not('stripe', 'none')),
  { k: 'color', t: 'color', l: 'Цвет (превью)' },
  { sub: 'Размещение', show: notFrame },
  S_('rep', 'Размножение', [['radial', 'Вокруг центра плитки'], ['grid', 'По решётке']], notFrame),
  S_('lat', 'Решётка', [['square', 'Квадратная'], ['hex', 'Шестиугольная']], grid),
  R_('P', 'Шаг решётки', 2, 300, 0.1, 'мм', grid),
  R_('latRot', 'Поворот решётки', -180, 180, 1, '°', grid),
  C_('latOff', 'Сдвинуть решётку на полшага', grid),
  I_('n', 'Копий по кругу', 1, 72, notFrame),
  C_('mirror', 'Зеркальные пары', notFrame),
  R_('ang', 'Угол первой копии', -180, 180, 0.5, '°', notFrame),
  R_('R', 'Расстояние от центра', 0, 300, 0.1, 'мм', notFrame),
  I_('ln', 'Веер: копий', 1, 72, notFrame),
  R_('span', 'Веер: раскрытие', 1, 360, 1, '°', (p) => notFrame(p) && p.ln > 1),
  R_('lrot', 'Поворот веера / смещение от оси', -180, 180, 0.5, '°', notFrame),
  R_('lr', 'Вынос мотива от центра веера', 0, 300, 0.1, 'мм', notFrame),
  R_('rot', 'Поворот мотива', -180, 180, 0.5, '°', notFrame),
  C_('flip', 'Отразить мотив', notFrame),
  R_('scale', 'Масштаб мотива', 0.05, 5, 0.01, '', notFrame),
];

/* =========================================================================
   СОСТОЯНИЕ
   ========================================================================= */
const VIEW_DEFAULTS = { scaleLink: true, lightAz: -135, lightEl: 38, viewMode: 'tile' };
let D = loadStored() || fresh(PRESETS[0].d, 'tile');
function fresh(d, mode) {
  const out = { ...VIEW_DEFAULTS, ...OC.normalizeDesign(JSON.parse(JSON.stringify(d))) };
  out.viewMode = mode || (typeof D !== 'undefined' && D ? D.viewMode : out.viewMode);
  return out;
}

/* =========================================================================
   ПАНЕЛЬ
   ========================================================================= */
const controls = [];
function makeControl(it, getObj, onSet) {
  const row = document.createElement('div');
  row.className = 'row';
  if (it.html) { row.innerHTML = it.html; return { row }; }
  if (it.sub) { row.className = 'sub'; row.textContent = it.sub; return { row, show: it.show, sync() {} }; }
  const set = (v) => { if (it.int) v = Math.round(v); onSet(it.k, v); };
  let sync;
  if (it.t === 'range') {
    row.innerHTML = `<label><span>${it.l}</span><span><input class="num" type="number" step="${it.step}"/>${it.u ? `<span class="unit">${it.u}</span>` : ''}</span></label>
      <input type="range" min="${it.min}" max="${it.max}" step="${it.step}"/>`;
    const num = row.querySelector('.num'), rng = row.querySelector('input[type=range]');
    rng.addEventListener('input', () => { num.value = rng.value; set(parseFloat(rng.value)); });
    num.addEventListener('change', () => {
      const v = parseFloat(num.value);
      if (Number.isFinite(v)) { rng.value = v; set(v); } else sync();
    });
    sync = () => { const v = getObj()[it.k]; num.value = +(+v).toFixed(3); rng.value = v; };
  } else if (it.t === 'select') {
    row.innerHTML = `<label><span>${it.l}</span></label><select>${it.opts.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>`;
    const sel = row.querySelector('select');
    sel.addEventListener('change', () => set(sel.value));
    sync = () => { sel.value = getObj()[it.k]; };
  } else if (it.t === 'check') {
    row.innerHTML = `<label class="check"><input type="checkbox"/> ${it.l}</label>`;
    const cb = row.querySelector('input');
    cb.addEventListener('change', () => set(cb.checked));
    sync = () => { cb.checked = !!getObj()[it.k]; };
  } else if (it.t === 'color') {
    row.innerHTML = `<label class="color"><span>${it.l}</span><input type="color"/></label>`;
    const ci = row.querySelector('input');
    ci.addEventListener('input', () => set(ci.value));
    sync = () => { ci.value = getObj()[it.k]; };
  }
  return { row, sync, show: it.show };
}

function buildPanel() {
  const presetBox = document.getElementById('presets');
  PRESETS.forEach((pr) => {
    const b = document.createElement('button');
    b.textContent = pr.name;
    b.onclick = () => { D = fresh(pr.d); afterLoad(true); };
    presetBox.appendChild(b);
  });
  document.getElementById('rnd-sq').onclick = () => randomTile(['square', 'square', 'octagon', 'circle']);
  document.getElementById('rnd-hex').onclick = () => randomTile(['hexFlat', 'hexPointy']);

  const host = document.getElementById('sections');
  for (const sec of SECTIONS) {
    const g = document.createElement('div');
    g.className = 'group' + (sec.collapsed ? ' collapsed' : '');
    if (sec.id) g.id = sec.id;
    g.innerHTML = `<div class="title">${sec.title} <span class="chev">▾</span></div><div class="body"></div>`;
    const body = g.querySelector('.body');
    if (sec.layers) {
      body.innerHTML = `<div id="layers"></div>
        <div class="addrow"><select id="add-type">${Object.entries(OC.MOTIF_NAMES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
        <button id="add-layer" class="primary">+ Слой</button></div>
        <p class="hint">Слои применяются сверху вниз. «Наплыв» берёт максимум высот, «Наложение» ставит мотив поверх того, что уже есть, «Вырезать» делает углубление.
        Мотив лежит вдоль своей оси (0° — вправо). Копии: сначала по кругу вокруг центра плитки (или по решётке), затем веером вокруг точки на расстоянии от центра.</p>`;
      body.querySelector('#add-layer').onclick = () => {
        const t = body.querySelector('#add-type').value;
        const L = OC.makeLayer(t, { color: D.layers.length ? D.layers[D.layers.length - 1].color : '#c8b89a', H: 2.5 });
        D.layers.push(L);
        renderLayers(D.layers.length - 1);
        changed();
      };
    } else {
      for (const it of sec.items) {
        const c = makeControl(it, () => D, setTileParam);
        body.appendChild(c.row);
        if (c.sync) controls.push(c);
      }
    }
    host.appendChild(g);
  }
  host.querySelectorAll('.group > .title').forEach((t) => t.addEventListener('click', () => t.parentElement.classList.toggle('collapsed')));
  document.querySelector('#g-presets > .title').addEventListener('click', (e) => e.currentTarget.parentElement.classList.toggle('collapsed'));
}

function setTileParam(k, v) {
  if (k === 'size' && D.scaleLink && D.size > 0 && v > 0) {
    OC.scaleDesign(D, v / D.size);
    D.size = v;
    syncLayers();
  } else D[k] = v;
  if (k === 'shape') syncLayers();
  const light = k === 'gloss' || k === 'lightAz' || k === 'lightEl' || k === 'bg';
  refreshVisibility();
  if (light) { applyLook(); store(); if (k === 'bg') changed(); return; }
  changed();
}

/* ---------- слои ---------- */
let openLayers = new Set();
let layerCtrls = [];
function renderLayers(openIdx) {
  if (openIdx !== undefined) openLayers.add(openIdx);
  const box = document.getElementById('layers');
  box.innerHTML = '';
  layerCtrls = [];
  D.layers.forEach((L, idx) => {
    const card = document.createElement('div');
    card.className = 'layer' + (openLayers.has(idx) ? '' : ' collapsed') + (L.on ? '' : ' off');
    card.innerHTML = `<div class="lhead">
        <input type="checkbox" title="Включить / выключить" ${L.on ? 'checked' : ''}/>
        <span class="sw" style="background:${L.color}"></span>
        <span class="name">${idx + 1}. ${OC.MOTIF_NAMES[L.type]} <small>${L.type !== 'frame' ? '×' + copiesOf(L) : ''}</small></span>
        <button data-a="up" title="Выше">↑</button><button data-a="down" title="Ниже">↓</button>
        <button data-a="dup" title="Копия">⧉</button><button data-a="del" title="Удалить">✕</button>
      </div><div class="lbody"></div>`;
    const head = card.querySelector('.lhead'), body = card.querySelector('.lbody');
    head.addEventListener('click', (e) => {
      if (e.target.closest('button') || e.target.tagName === 'INPUT') return;
      card.classList.toggle('collapsed');
      if (card.classList.contains('collapsed')) openLayers.delete(idx); else openLayers.add(idx);
    });
    head.querySelector('input').addEventListener('change', (e) => { L.on = e.target.checked; card.classList.toggle('off', !L.on); changed(); });
    head.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => layerAction(idx, b.dataset.a)));
    const ctrls = [];
    const setL = (k, v) => {
      L[k] = v;
      if (k === 'color') head.querySelector('.sw').style.background = v;
      if (['n', 'ln', 'mirror', 'rep'].includes(k)) head.querySelector('small').textContent = '×' + copiesOf(L);
      for (const c of ctrls) c.row.classList.toggle('hidden', !!c.show && !c.show(L));
      changed();
    };
    for (const it of [...MOTIF_ITEMS[L.type], ...COMMON_ITEMS]) {
      const c = makeControl(it, () => L, setL);
      body.appendChild(c.row);
      ctrls.push(c);
    }
    for (const c of ctrls) { if (c.sync) c.sync(); c.row.classList.toggle('hidden', !!c.show && !c.show(L)); }
    layerCtrls.push(ctrls);
    box.appendChild(card);
  });
}
function copiesOf(L) {
  const k = L.n * L.ln * (L.mirror ? 2 : 1);
  return L.rep === 'grid' ? k + ' на узел' : k;
}
function syncLayers() { layerCtrls.forEach((cs) => cs.forEach((c) => c.sync && c.sync())); }
function layerAction(i, a) {
  const Ls = D.layers;
  const remap = (f) => { openLayers = new Set([...openLayers].map(f).filter((x) => x >= 0)); };
  if (a === 'up' && i > 0) { [Ls[i - 1], Ls[i]] = [Ls[i], Ls[i - 1]]; remap((x) => (x === i ? i - 1 : x === i - 1 ? i : x)); }
  else if (a === 'down' && i < Ls.length - 1) { [Ls[i + 1], Ls[i]] = [Ls[i], Ls[i + 1]]; remap((x) => (x === i ? i + 1 : x === i + 1 ? i : x)); }
  else if (a === 'dup') { Ls.splice(i + 1, 0, JSON.parse(JSON.stringify(Ls[i]))); remap((x) => (x > i ? x + 1 : x)); openLayers.add(i + 1); }
  else if (a === 'del') { Ls.splice(i, 1); remap((x) => (x === i ? -1 : x > i ? x - 1 : x)); }
  else return;
  renderLayers();
  changed();
}

function syncPanel() {
  for (const c of controls) c.sync();
  refreshVisibility();
  renderLayers();
}
function refreshVisibility() {
  for (const c of controls) if (c.row) c.row.classList.toggle('hidden', !!c.show && !c.show(D));
}

function randomTile(shapes) {
  const shape = shapes[Math.floor(Math.random() * shapes.length)];
  const seed = 1 + Math.floor(Math.random() * 9998);
  D = fresh(randomDesign(seed, shape));
  afterLoad(true);
}

function afterLoad(fit) {
  openLayers = new Set();
  syncPanel();
  applyLook();
  rebuild(fit);
  store();
}

function store() { try { localStorage.setItem(STORE_KEY, JSON.stringify(D)); } catch (e) { /* хранилище недоступно */ } }
function loadStored() {
  try {
    const s = localStorage.getItem(STORE_KEY);
    return s ? { ...VIEW_DEFAULTS, ...OC.normalizeDesign(JSON.parse(s)) } : null;
  } catch (e) { return null; }
}

let pending = false;
function changed() {
  store();
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; rebuild(false); });
}

/* =========================================================================
   ПРОСМОТР
   ========================================================================= */
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#d9d6cf');
const camera = new THREE.PerspectiveCamera(30, 1, 1, 200000);
camera.up.set(0, 0, 1);
const orbit = new THREE.OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
orbit.dampingFactor = 0.12;

scene.add(new THREE.HemisphereLight(0xffffff, 0x9d978c, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 0.95);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.4;
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xffffff, 0.2);
scene.add(fill);

const matTop = new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.4, metalness: 0, clearcoat: 0.6, clearcoatRoughness: 0.2 });
const matSide = new THREE.MeshStandardMaterial({ color: 0xb9ab95, roughness: 0.9, metalness: 0 });
let group = new THREE.Group();
scene.add(group);
let lastInfo = null;

function applyLook() {
  matTop.roughness = 0.75 - 0.5 * D.gloss;
  matTop.clearcoat = D.gloss;
  matTop.needsUpdate = true;
  placeLight();
}

// Цвет превью в точке плитки: билинейно по сетке цветов, sRGB → линейный.
function colorSampler(R) {
  const { n, s, half } = R.G, c = R.rgb;
  const lin = (x) => (x <= 0.04045 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4));
  return (x, y, out) => {
    const fi = x / s + half, fj = y / s + half;
    const i = Math.min(n - 2, Math.max(0, Math.floor(fi))), j = Math.min(n - 2, Math.max(0, Math.floor(fj)));
    const tx = fi - i, ty = fj - j, k = (j * n + i) * 3, kn = 3 * n;
    for (let q = 0; q < 3; q++) {
      out[q] = lin(c[k + q] * (1 - tx) * (1 - ty) + c[k + 3 + q] * tx * (1 - ty) + c[k + kn + q] * (1 - tx) * ty + c[k + kn + 3 + q] * tx * ty);
    }
  };
}

function meshToObject(M, design, R, tile, fade) {
  const top = new THREE.BufferGeometry();
  top.setAttribute('position', new THREE.BufferAttribute(M.pos, 3));
  top.setIndex(new THREE.BufferAttribute(M.tri.subarray(0, M.nTop * 3), 1));
  const sample = colorSampler(R), c = [0, 0, 0];
  const bgc = new THREE.Color(design.bg).convertSRGBToLinear();
  const cr = tile ? Math.cos(tile.rot * Math.PI / 180) : 1, sr = tile ? Math.sin(tile.rot * Math.PI / 180) : 0;
  const col = new Float32Array(M.pos.length);
  let zmax = design.T + 0.01;
  for (let i = 2; i < M.pos.length; i += 3) zmax = Math.max(zmax, M.pos[i]);
  for (let v = 0, o = 0; o < M.pos.length; v++, o += 3) {
    sample(M.pos[o], M.pos[o + 1], c);
    if (fade) {
      // цвет узора затухает вместе с рельефом
      const x = M.pos[o], y = M.pos[o + 1], a = fade(tile.x + cr * x - sr * y, tile.y + sr * x + cr * y);
      c[0] = bgc.r + (c[0] - bgc.r) * a; c[1] = bgc.g + (c[1] - bgc.g) * a; c[2] = bgc.b + (c[2] - bgc.b) * a;
    }
    const k = Math.min(1, Math.max(0, (M.pos[o + 2] - design.T + 1) / (zmax - design.T + 1)));
    const f = 0.78 + 0.22 * k;
    col[o] = c[0] * f; col[o + 1] = c[1] * f; col[o + 2] = c[2] * f;
  }
  top.setAttribute('color', new THREE.BufferAttribute(col, 3));
  top.computeVertexNormals();
  const nS = M.tri.length / 3 - M.nTop;
  const sp = new Float32Array(nS * 9);
  for (let t = M.nTop * 3, o = 0; t < M.tri.length; t++, o += 3) {
    const v = M.tri[t] * 3;
    sp[o] = M.pos[v]; sp[o + 1] = M.pos[v + 1]; sp[o + 2] = M.pos[v + 2];
  }
  const side = new THREE.BufferGeometry();
  side.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  side.computeVertexNormals();
  return { top, side, tris: M.tri.length / 3 };
}

function addTile(obj, place) {
  const g = new THREE.Group();
  const a = new THREE.Mesh(obj.top, matTop), b = new THREE.Mesh(obj.side, matSide);
  a.castShadow = a.receiveShadow = true; b.castShadow = b.receiveShadow = true;
  g.add(a, b);
  if (place) { g.position.set(place.x, place.y, 0); g.rotation.z = place.rot * Math.PI / 180; }
  group.add(g);
}

function disposeGroup() {
  const seen = new Set();
  group.traverse((o) => { if (o.geometry && !seen.has(o.geometry)) { seen.add(o.geometry); o.geometry.dispose(); } });
  scene.remove(group);
  group = new THREE.Group();
  scene.add(group);
}

function rebuild(fit) {
  const t0 = performance.now();
  const design = OC.normalizeDesign(D);
  disposeGroup();
  let tris = 0, tileCount = 1, step = D.stepPreview;
  let lay = null;
  if (D.viewMode === 'array') {
    lay = OC.arrayLayout(design);
    tileCount = lay.tiles.length;
    const fade = OC.fadeFn(design, lay.box);
    // Бюджет узлов превью, чтобы массив с затуханием оставался отзывчивым.
    if (fade) step = Math.max(step, design.size / Math.sqrt(500000 / tileCount));
    const R = OC.computeRelief(design, step, { colors: true });
    if (fade) {
      for (const t of lay.tiles) {
        const obj = meshToObject(OC.buildTileMesh(R, t, fade), design, R, t, fade);
        addTile(obj, t);
        tris += obj.tris;
      }
    } else {
      const obj = meshToObject(OC.buildTileMesh(R, null, null), design, R);
      for (const t of lay.tiles) addTile(obj, t);
      tris = obj.tris * tileCount;
    }
    lastInfo = { R, lay };
  } else {
    const R = OC.computeRelief(design, step, { colors: true });
    const obj = meshToObject(OC.buildTileMesh(R, null, null), design, R);
    addTile(obj, null);
    tris = obj.tris;
    lastInfo = { R, lay: null };
  }
  scene.background = new THREE.Color(D.viewMode === 'array' ? '#8f887c' : '#d9d6cf').convertSRGBToLinear();
  if (fit) setView(currentView);
  placeLight();
  showStats(tris, tileCount, performance.now() - t0, step);
  document.querySelectorAll('#views [data-mode]').forEach((b) => b.classList.toggle('on', b.dataset.mode === D.viewMode));
}

function extent() {
  const box = new THREE.Box3().setFromObject(group);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  return { size, center, r: Math.max(size.x, size.y) * 0.5 + 1 };
}
function placeLight(ext = extent()) {
  const az = D.lightAz * Math.PI / 180, el = D.lightEl * Math.PI / 180, d = ext.r * 3;
  sun.position.set(ext.center.x + Math.cos(az) * Math.cos(el) * d, ext.center.y + Math.sin(az) * Math.cos(el) * d, Math.sin(el) * d);
  sun.target.position.copy(ext.center);
  const cam = sun.shadow.camera;
  cam.left = -ext.r * 1.3; cam.right = ext.r * 1.3; cam.top = ext.r * 1.3; cam.bottom = -ext.r * 1.3;
  cam.near = d * 0.2; cam.far = d * 2.2;
  cam.updateProjectionMatrix();
  fill.position.set(ext.center.x - Math.cos(az) * d, ext.center.y - Math.sin(az) * d, d * 0.6);
}
let currentView = 'angle';
function setView(kind) {
  currentView = kind;
  const ext = extent(), r = ext.r, c = ext.center;
  const dist = r / Math.tan((camera.fov * Math.PI) / 360) * 1.15;
  if (kind === 'front') camera.position.set(c.x, c.y - dist * 0.001, c.z + dist);
  else if (kind === 'graze') camera.position.set(c.x, c.y - dist * 0.95, c.z + dist * 0.32);
  else camera.position.set(c.x + dist * 0.35, c.y - dist * 0.62, c.z + dist * 0.7);
  orbit.target.copy(c);
  camera.near = dist / 200; camera.far = dist * 20;
  camera.updateProjectionMatrix();
  orbit.update();
}
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
(function loop() {
  orbit.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})();

document.querySelectorAll('#views [data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
document.querySelectorAll('#views [data-mode]').forEach((b) => b.addEventListener('click', () => {
  D.viewMode = b.dataset.mode; store(); rebuild(true);
}));

/* =========================================================================
   СТАТИСТИКА И ЭКСПОРТ
   ========================================================================= */
function estTris(design, step) {
  const out = OC.tileOutline(design.shape, design.size);
  const area = out.circle ? Math.PI * out.a * out.a : out.n * out.a * out.a * Math.tan(Math.PI / out.n);
  return Math.round(2 * area / (step * step) + 3 * out.n * design.size / step);
}
const fmtMB = (tris) => (tris * 50 / 1048576).toFixed(tris * 50 > 1e8 ? 0 : 1) + ' МБ';

function showStats(tris, tileCount, ms, step) {
  const design = OC.normalizeDesign(D);
  const R = lastInfo.R;
  let hMax = 0, hMin = 0;
  for (const v of R.h) { if (v > hMax) hMax = v; if (v < hMin) hMin = v; }
  const out = R.outline;
  const w = out.circle ? out.a * 2 : Math.max(...out.vx) - Math.min(...out.vx), h = out.circle ? out.a * 2 : Math.max(...out.vy) - Math.min(...out.vy);
  const lines = [
    `Плитка: <b>${w.toFixed(1)} × ${h.toFixed(1)} мм</b>, основание ${design.T} мм, рельеф ${hMax > 0 ? '+' + hMax.toFixed(2) : '0'}${hMin < 0 ? ' / ' + hMin.toFixed(2) : ''} мм`,
  ];
  if (lastInfo.lay) {
    const b = lastInfo.lay.box;
    lines.push(`Массив: ${tileCount} шт., ${(b[2] - b[0]).toFixed(0)} × ${(b[3] - b[1]).toFixed(0)} мм${design.fade !== 'none' ? ', с затуханием' : ''}`);
  }
  lines.push(`Превью: шаг ${step.toFixed(2)} мм, ${tris.toLocaleString('ru')} треуг., ${ms.toFixed(0)} мс`);
  if (hMin < -(design.T - 0.7)) lines.push('<span class="warn">Углубления доходят почти до дна — увеличьте толщину основания.</span>');
  document.getElementById('stats').innerHTML = lines.join('<br>');
  const et = estTris(design, design.stepExport), n = lastInfo.lay ? lastInfo.lay.tiles.length : design.cols * design.rows;
  document.getElementById('ex-est').innerHTML = `Оценка при шаге ${design.stepExport} мм: плитка ≈ ${et.toLocaleString('ru')} треуг. (${fmtMB(et)}), весь массив из ${n} шт. ≈ ${fmtMB(et * n)}.`;
}

function baseName() {
  return `ornament_${D.shape}_${Math.round(D.size)}mm`;
}
function download(data, name, type) {
  const blob = data instanceof Blob ? data : new Blob(Array.isArray(data) ? data : [data], { type: type || 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
function busy(on) { document.getElementById('busy').style.display = on ? 'block' : 'none'; }
function later(fn) { busy(true); setTimeout(() => { try { fn(); } catch (e) { alert('Ошибка экспорта: ' + e.message); console.error(e); } finally { busy(false); } }, 30); }

function layoutText(design, lay, perTile) {
  const lines = [
    'Ornament — раскладка массива',
    `Форма: ${design.shape}, размер ${design.size} мм, шов ${design.gap} мм, ${lay.tiles.length} шт.`,
    'Координаты центров плиток в мм (X вправо, Y вверх), поворот против часовой стрелки.',
    perTile ? 'Каждая плитка — свой файл (затухание делает их разными).' : 'Все плитки одинаковые: tile.stl.',
    '',
  ];
  for (const t of lay.tiles) lines.push(`${t.name}\tX=${t.x.toFixed(2)}\tY=${t.y.toFixed(2)}\tповорот=${t.rot}°`);
  return lines.join('\n');
}

// Подтверждение перед очень тяжёлым экспортом.
function heavy(tiles) {
  const design = OC.normalizeDesign(D);
  const bytes = estTris(design, design.stepExport) * tiles * 50;
  return bytes > 500 * 1048576 && !confirm(`Файл получится примерно ${fmtMB(bytes / 50)}. Увеличьте шаг сетки STL, чтобы уменьшить его. Продолжить?`);
}

function wireExports() {
  document.getElementById('ex-tile').onclick = () => later(() => {
    const design = OC.normalizeDesign(D);
    const R = OC.computeRelief(design, design.stepExport);
    const M = OC.buildTileMesh(R, null, null);
    download(OC.stlParts([OC.stlChunk(M, null)], baseName()), baseName() + '.stl', 'model/stl');
  });
  document.getElementById('ex-array').onclick = () => !heavy(D.cols * D.rows) && later(() => {
    const design = OC.normalizeDesign(D);
    const lay = OC.arrayLayout(design), fade = OC.fadeFn(design, lay.box);
    const R = OC.computeRelief(design, design.stepExport);
    const chunks = [];
    const shared = fade ? null : OC.buildTileMesh(R, null, null);
    for (const t of lay.tiles) chunks.push(OC.stlChunk(shared || OC.buildTileMesh(R, t, fade), t));
    download(OC.stlParts(chunks, baseName() + ' array'), baseName() + `_array_${design.cols}x${design.rows}.stl`, 'model/stl');
  });
  document.getElementById('ex-zip').onclick = () => !heavy(D.fade === 'none' ? 1 : D.cols * D.rows) && later(() => {
    const design = OC.normalizeDesign(D);
    const lay = OC.arrayLayout(design), fade = OC.fadeFn(design, lay.box);
    const R = OC.computeRelief(design, design.stepExport);
    const files = [];
    if (fade) {
      for (const t of lay.tiles) files.push({ name: t.name + '.stl', data: OC.concat(OC.stlParts([OC.stlChunk(OC.buildTileMesh(R, t, fade), null)], t.name)) });
    } else files.push({ name: 'tile.stl', data: OC.concat(OC.stlParts([OC.stlChunk(OC.buildTileMesh(R, null, null), null)], 'tile')) });
    files.push({ name: 'layout.txt', data: layoutText(design, lay, !!fade) });
    files.push({ name: 'params.json', data: JSON.stringify(D, null, 2) });
    download(new Blob([OC.makeZip(files)], { type: 'application/zip' }), baseName() + '_tiles.zip');
  });
  document.getElementById('ex-json').onclick = () => download(JSON.stringify(D, null, 2), baseName() + '.json', 'application/json');
  document.getElementById('im-json').onclick = () => document.getElementById('im-file').click();
  document.getElementById('im-file').onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    f.text().then((txt) => {
      try { D = fresh(JSON.parse(txt)); afterLoad(true); } catch (err) { alert('Не удалось прочитать файл: ' + err.message); }
    });
    e.target.value = '';
  };
}

buildPanel();
wireExports();
resize();
syncPanel();
applyLook();
rebuild(true);
</script>
</body>
