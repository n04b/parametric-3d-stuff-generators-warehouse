<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Генератор 3D-текстур</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <aside id="panel">
    <header>
      <h1>Генератор 3D-текстур</h1>
      <p class="hint">Параметрический рельеф, размеры в миллиметрах, экспорт в STL.</p>
    </header>

    <label class="field">
      <span>Пресет</span>
      <select id="preset"></select>
    </label>

    <section>
      <h2>Поверхность</h2>
      <div id="shape-params"></div>
    </section>

    <section>
      <h2>Текстура</h2>
      <div id="field-params"></div>
      <button id="reseed" type="button">Случайный сид</button>
    </section>

    <section id="stats"></section>

    <div class="actions">
      <button id="export" type="button" class="primary">Скачать STL</button>
      <button id="share" type="button">Скопировать ссылку</button>
    </div>
    <p id="message" class="hint" role="status"></p>
  </aside>

  <main id="viewport">
    <div id="busy" hidden>Генерация…</div>
    <div class="view-tools">
      <label><input type="checkbox" id="wire"> Сетка</label>
      <button id="reset-view" type="button">Сбросить вид</button>
    </div>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
