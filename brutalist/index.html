<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brutalist Surface — генератор бетонного рельефа</title>
<style>
  :root {
    --bg: #121315;
    --panel: #18191c;
    --panel-2: #202226;
    --line: #2a2c31;
    --text: #e8e6e1;
    --muted: #8f8e8a;
    --accent: #d9d3c7;
    --accent-ink: #17171a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; width: 100vw; height: 100vh; }

  /* ---- viewport ---- */
  #view {
    position: relative; flex: 1 1 auto; min-width: 0;
    background: radial-gradient(120% 90% at 50% 35%, #3b3c40 0%, #232427 55%, #161719 100%);
  }
  #view canvas { display: block; width: 100%; height: 100%; outline: none; }
  #hud {
    position: absolute; left: 16px; top: 14px; pointer-events: none;
    font-size: 12px; color: var(--muted); line-height: 1.6; max-width: 60%;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  #hud b { color: var(--text); font-weight: 600; letter-spacing: .3px; }
  #stats {
    position: absolute; right: 16px; bottom: 12px; pointer-events: none;
    font-size: 11px; color: var(--muted); text-align: right; line-height: 1.5;
    text-shadow: 0 1px 2px rgba(0,0,0,.6); font-variant-numeric: tabular-nums;
  }
  #cams { position: absolute; left: 16px; bottom: 12px; display: flex; gap: 6px; }
  #cams button {
    background: rgba(24,25,28,.78); color: var(--muted); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 10px; font-size: 11px; cursor: pointer;
    backdrop-filter: blur(4px);
  }
  #cams button:hover { color: var(--text); }
  #busy {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(10,10,12,.5); color: var(--text); font-size: 13px; letter-spacing: .3px;
  }
  #busy[hidden] { display: none; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: 8px;
    font-size: 12px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; }

  /* ---- panel ---- */
  #panel {
    flex: 0 0 360px; width: 360px; height: 100%; overflow-y: auto;
    background: var(--panel); border-left: 1px solid var(--line); padding-bottom: 40px;
  }
  #panel::-webkit-scrollbar { width: 10px; }
  #panel::-webkit-scrollbar-thumb { background: #2c2e34; border-radius: 6px; }
  .head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .head h1 { font-size: 14px; margin: 0; letter-spacing: .6px; text-transform: uppercase; }
  .head p { margin: 5px 0 0; font-size: 11.5px; color: var(--muted); }
  .group { border-bottom: 1px solid var(--line); padding: 12px 18px 14px; }
  .gtitle {
    font-size: 10.5px; letter-spacing: .9px; text-transform: uppercase; color: var(--muted);
    margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;
  }
  .gtitle button {
    background: none; border: 0; color: var(--muted); font-size: 11px; cursor: pointer;
    text-transform: none; letter-spacing: 0; padding: 0;
  }
  .gtitle button:hover { color: var(--text); }
  .hint { font-size: 11.5px; color: var(--muted); margin: 8px 0 0; }

  .patterns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .pat {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px;
    color: var(--muted); padding: 9px 2px 7px; cursor: pointer; font-size: 10.5px;
  }
  .pat svg { width: 24px; height: 24px; }
  .pat:hover { color: var(--text); }
  .pat.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }

  .row { margin: 11px 0; }
  .row[hidden] { display: none !important; }
  .lab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 8px; }
  .num { display: flex; align-items: baseline; gap: 3px; }
  .num input {
    width: 62px; background: transparent; border: 1px solid transparent; border-radius: 5px;
    color: var(--accent); font: inherit; font-size: 12px; text-align: right; padding: 1px 3px;
    font-variant-numeric: tabular-nums; -moz-appearance: textfield;
  }
  .num input:hover, .num input:focus { border-color: var(--line); outline: none; background: var(--panel-2); }
  .num input::-webkit-inner-spin-button, .num input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .num em { font-style: normal; color: var(--muted); font-size: 11px; min-width: 14px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 3px; margin: 0; outline: none;
    border-radius: 3px; cursor: pointer;
    background: linear-gradient(90deg, var(--accent) var(--p, 50%), #34363c var(--p, 50%));
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: 2px solid #111214; box-shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid #111214;
  }
  select {
    width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 9px; font: inherit; font-size: 12px; outline: none; cursor: pointer;
  }
  .toggle { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .toggle input { display: none; }
  .sw { width: 30px; height: 17px; border-radius: 9px; background: #34363c; position: relative; transition: .15s; flex: none; }
  .sw::after {
    content: ""; position: absolute; left: 2px; top: 2px; width: 13px; height: 13px;
    border-radius: 50%; background: #8f8e8a; transition: .15s;
  }
  .toggle input:checked + .sw { background: var(--accent); }
  .toggle input:checked + .sw::after { left: 15px; background: var(--accent-ink); }
  .seedrow { display: flex; gap: 6px; }
  .seedrow input {
    flex: 1; min-width: 0; background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 9px; font: inherit; font-size: 12px; outline: none;
  }
  .seedrow button, .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font: inherit; font-size: 12px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .seedrow button svg { width: 16px; height: 16px; }
  .seedrow button:hover, .btn:hover { background: #292b30; border-color: #3a3c43; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
  .btn.wide { grid-column: 1 / -1; }

  @media (max-width: 820px) {
    body { overflow: auto; }
    #app { flex-direction: column; height: auto; width: 100%; }
    #view { flex: none; height: 62vh; }
    #panel { flex: none; width: 100%; height: auto; border-left: 0; border-top: 1px solid var(--line); }
    #hud { max-width: 80%; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="hud"><b id="hudName"></b><br><span id="hudHint"></span></div>
    <div id="cams">
      <button data-cam="top" title="Вид в лоб, как на фото фасада (F)">Фасад</button>
      <button data-cam="34">3/4</button>
      <button data-cam="low">Скользящий</button>
    </div>
    <div id="stats"></div>
    <div id="busy" hidden>Считаю…</div>
  </div>

  <aside id="panel">
    <header class="head">
      <h1>Brutalist Surface</h1>
      <p>Параметрический генератор бетонного рельефа. Размеры в миллиметрах, экспорт в STL и карту высот.</p>
    </header>

    <section class="group">
      <div class="gtitle">Паттерн</div>
      <div class="patterns" id="patterns"></div>
      <p class="hint" id="patternHint"></p>
    </section>

    <section class="group">
      <div class="gtitle">Параметры паттерна <button id="btnReset" title="Вернуть значения по умолчанию">сбросить</button></div>
      <div id="grp-pattern"></div>
    </section>

    <section class="group">
      <div class="gtitle">Плита</div>
      <div id="grp-common"></div>
    </section>

    <section class="group">
      <div class="gtitle">Свет и материал</div>
      <div id="grp-view"></div>
    </section>

    <section class="group">
      <div class="gtitle">Экспорт</div>
      <div id="grp-export"></div>
      <div class="btns">
        <button class="btn primary" id="btnSolid" title="Единая замкнутая сетка по карте высот — годится для любого слайсера и CNC">STL — монолит</button>
        <button class="btn" id="btnExact" title="Точные грани: набор замкнутых тел, слайсер объединит их сам">STL — точные тела</button>
        <button class="btn" id="btnPNG" title="16-битная карта высот для displacement / CNC">PNG 16 бит</button>
        <button class="btn" id="btnLink">Скопировать ссылку</button>
      </div>
      <p class="hint" id="exportInfo"></p>
    </section>
  </aside>
</div>
<div id="toast"></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
// ===== CORE:BEGIN =====
// Pure geometry: no DOM, no THREE. Extracted and unit-tested by test/core.test.js.
// Model space: millimetres, Z up, plate spans [0,W]×[0,D], bed at z = 0.
var BrutalCore = (function () {
  'use strict';

  /* ---------- deterministic randomness ---------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function rngFor(seed, salt) {
    return mulberry32((Math.imul(seed | 0, 2654435761) ^ Math.imul(salt | 0, 1597334677)) >>> 0);
  }
  function hash3(a, b, c) {
    let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 2147483647);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h = Math.imul(h ^ (h >>> 16), 2246822519);
    return ((h ^ (h >>> 15)) >>> 0) / 4294967296;
  }
  // Value noise; with integer periods px/py it tiles seamlessly.
  function vnoise(x, y, seed, px, py) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const fx = x - xi, fy = y - yi;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const at = (i, j) => {
      if (px) i = ((i % px) + px) % px;
      if (py) j = ((j % py) + py) % py;
      return hash3(i, j, seed);
    };
    const a = at(xi, yi), b = at(xi + 1, yi), c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  }
  function fbm(x, y, seed, px, py, oct) {
    let s = 0, amp = 0.5, f = 1, norm = 0;
    for (let o = 0; o < oct; o++) {
      s += amp * vnoise(x * f, y * f, seed + o * 101, px * f, py * f);
      norm += amp; amp *= 0.5; f *= 2;
    }
    return s / norm;
  }
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  // value in [0,1) -> one of `levels` evenly spaced steps in [0,1]
  function quantize(v, levels) {
    levels = Math.max(2, levels | 0);
    return Math.min(levels - 1, Math.floor(v * levels)) / (levels - 1);
  }
  // fbm output clusters around 0.5; stretch it to use the whole range
  const stretch = (v) => clamp((v - 0.5) * 2.2 + 0.5, 0, 0.9999);

  /* ---------- vectors ---------- */
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const len = (a) => Math.hypot(a[0], a[1], a[2]);
  const scale = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const normalize = (a) => scale(a, 1 / len(a));

  /* ---------- convex hull (brute force, for small point sets) ---------- */
  const EPS = 5e-5;     // mm: point-on-plane tolerance
  const MERGE = 1e-4;   // mm: points closer than this are the same point

  function dedupe(pts) {
    const out = [];
    outer: for (const p of pts) {
      for (const q of out) {
        if (Math.abs(p[0] - q[0]) < MERGE && Math.abs(p[1] - q[1]) < MERGE && Math.abs(p[2] - q[2]) < MERGE) continue outer;
      }
      out.push(p);
    }
    return out;
  }

  // Andrew's monotone chain; drops collinear points; CCW result.
  function hull2d(pts) {
    const s = pts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
    if (s.length < 3) return s;
    const bad = (o, a, b) =>
      (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x) <= EPS * Math.hypot(b.x - o.x, b.y - o.y);
    const lower = [], upper = [];
    for (const p of s) {
      while (lower.length >= 2 && bad(lower[lower.length - 2], lower[lower.length - 1], p)) lower.pop();
      lower.push(p);
    }
    for (let i = s.length - 1; i >= 0; i--) {
      const p = s[i];
      while (upper.length >= 2 && bad(upper[upper.length - 2], upper[upper.length - 1], p)) upper.pop();
      upper.push(p);
    }
    lower.pop(); upper.pop();
    return lower.concat(upper);
  }

  // Returns { planes:[{n,d}], faces:[{n,d,poly:[[x,y,z]..] CCW from outside]} } or null if flat.
  // Inside of the solid is n·p <= d for every plane.
  function convexHull(input) {
    const P = dedupe(input);
    const n = P.length;
    if (n < 4) return null;
    const planes = [];
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) for (let k = j + 1; k < n; k++) {
      const e1 = sub(P[j], P[i]), e2 = sub(P[k], P[i]);
      const c = cross(e1, e2), l = len(c);
      if (l <= 1e-10 * len(e1) * len(e2)) continue;          // collinear triple
      const nn = scale(c, 1 / l), d = dot(nn, P[i]);
      let pos = false, neg = false;
      for (let m = 0; m < n; m++) {
        const s = dot(nn, P[m]) - d;
        if (s > EPS) pos = true; else if (s < -EPS) neg = true;
        if (pos && neg) break;
      }
      if (pos && neg) continue;
      if (!pos && !neg) return null;                        // all points coplanar
      const N = pos ? scale(nn, -1) : nn, D = pos ? -d : d;
      let dup = false;
      for (const pl of planes) {
        if (Math.abs(pl.d - D) < EPS * 4 && dot(pl.n, N) > 1 - 1e-9) { dup = true; break; }
      }
      if (!dup) planes.push({ n: N, d: D });
    }
    if (planes.length < 4) return null;
    const faces = [];
    for (const pl of planes) {
      const nrm = pl.n;
      const u = normalize(cross(Math.abs(nrm[0]) < 0.9 ? [1, 0, 0] : [0, 1, 0], nrm));
      const v = cross(nrm, u);
      const on = [];
      for (const p of P) if (Math.abs(dot(nrm, p) - pl.d) <= EPS) on.push({ p, x: dot(p, u), y: dot(p, v) });
      const poly = hull2d(on);
      if (poly.length >= 3) faces.push({ n: nrm, d: pl.d, poly: poly.map((q) => q.p) });
    }
    return { planes, faces };
  }

  function hullVerts(h) {
    const set = new Set();
    for (const f of h.faces) for (const p of f.poly) set.add(p);
    return [...set];
  }

  // Keep the part of the hull with n·p <= d.
  function clipHull(h, n, d) {
    const verts = hullVerts(h);
    const side = new Map();
    let out = 0, inside = 0;
    for (const v of verts) {
      const s = dot(n, v) - d;
      side.set(v, s);
      if (s > EPS) out++; else inside++;
    }
    if (!out) return h;
    if (!inside) return null;
    const pts = verts.filter((v) => side.get(v) <= EPS);
    for (const f of h.faces) {
      const P = f.poly;
      for (let i = 0; i < P.length; i++) {
        const a = P[i], b = P[(i + 1) % P.length];
        const sa = side.get(a), sb = side.get(b);
        if ((sa > EPS && sb < -EPS) || (sa < -EPS && sb > EPS)) {
          const t = sa / (sa - sb);
          pts.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]);
        }
      }
    }
    return convexHull(pts);
  }

  /* ---------- solid builders ---------- */
  function boxPts(x0, y0, x1, y1, z0, z1) {
    return [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0],
            [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]];
  }
  // Column standing on the bed with a planar top topZ(x,y) and an optional top chamfer c.
  function columnPts(x0, y0, x1, y1, topZ, c) {
    const corners = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
    const pts = corners.map(([x, y]) => [x, y, 0]);
    const zmin = Math.min(...corners.map(([x, y]) => topZ(x, y)));
    c = Math.min(c, (x1 - x0) / 2 - 0.01, (y1 - y0) / 2 - 0.01, zmin - 0.01);
    if (c > 0.01) {
      for (const [x, y] of corners) pts.push([x, y, topZ(x, y) - c]);
      for (const [x, y] of [[x0 + c, y0 + c], [x1 - c, y0 + c], [x1 - c, y1 - c], [x0 + c, y1 - c]]) pts.push([x, y, topZ(x, y)]);
    } else {
      for (const [x, y] of corners) pts.push([x, y, topZ(x, y)]);
    }
    return pts;
  }

  /* ---------- parameter schemas (also drive the UI) ---------- */
  const COMMON = [
    { id: 'W', label: 'Ширина X', type: 'range', min: 40, max: 400, step: 1, value: 160, unit: 'мм' },
    { id: 'D', label: 'Длина Y', type: 'range', min: 40, max: 400, step: 1, value: 160, unit: 'мм' },
    { id: 'base', label: 'Основание', type: 'range', min: 1, max: 30, step: 0.5, value: 4, unit: 'мм' },
    { id: 'H', label: 'Глубина рельефа', type: 'range', min: 2, max: 80, step: 0.5, value: 24, unit: 'мм' },
    { id: 'seed', label: 'Сид', type: 'seed', min: 1, max: 99999, step: 1, value: 1937 },
  ];

  const PATTERNS = {
    pile: {
      label: 'Обломки',
      hint: 'Наклонённые бетонные блоки, наваленные друг на друга.',
      params: [
        { id: 'count', label: 'Количество', type: 'range', min: 5, max: 300, step: 1, value: 55 },
        { id: 'size', label: 'Размер блока', type: 'range', min: 6, max: 120, step: 1, value: 42, unit: 'мм' },
        { id: 'sizeVar', label: 'Разброс размера', type: 'range', min: 0, max: 1, step: 0.01, value: 0.5 },
        { id: 'aspect', label: 'Пропорция', type: 'range', min: 0.2, max: 1, step: 0.01, value: 0.72 },
        { id: 'tilt', label: 'Наклон', type: 'range', min: 0, max: 60, step: 1, value: 42, unit: '°' },
        { id: 'heightVar', label: 'Разброс высоты', type: 'range', min: 0, max: 1, step: 0.01, value: 0.6 },
      ],
    },
    blocks: {
      label: 'Блоки',
      hint: 'Стена из выступающих кубов: шахматка, диагонали, градиенты.',
      params: [
        { id: 'cols', label: 'Колонки', type: 'range', min: 2, max: 40, step: 1, value: 8 },
        { id: 'rows', label: 'Ряды', type: 'range', min: 2, max: 40, step: 1, value: 8 },
        { id: 'mode', label: 'Рисунок', type: 'select', value: 'checker', options: [
          ['checker', 'Шахматка'], ['diagonal', 'Диагональ'], ['random', 'Случайно'],
          ['gradient', 'Градиент'], ['wave', 'Волна'], ['noise', 'Шум']] },
        { id: 'levels', label: 'Уровни', type: 'range', min: 2, max: 8, step: 1, value: 3, showIf: (p) => p.mode !== 'checker' },
        { id: 'period', label: 'Период', type: 'range', min: 2, max: 24, step: 1, value: 6, unit: 'яч.', showIf: (p) => p.mode === 'wave' || p.mode === 'noise' },
        { id: 'minDepth', label: 'Мин. вынос', type: 'range', min: 0, max: 0.95, step: 0.01, value: 0.4 },
        { id: 'bond', label: 'Перевязка рядов', type: 'range', min: 0, max: 0.5, step: 0.05, value: 0 },
        { id: 'joint', label: 'Шов', type: 'range', min: 0, max: 6, step: 0.1, value: 1, unit: 'мм' },
        { id: 'chamfer', label: 'Фаска', type: 'range', min: 0, max: 5, step: 0.1, value: 0.4, unit: 'мм' },

        { id: 'gap', label: 'Зазор', type: 'range', min: 0, max: 8, step: 0.1, value: 1.6, unit: 'мм' },
        { id: 'segMin', label: 'Мин. сегмент', type: 'range', min: 4, max: 150, step: 1, value: 18, unit: 'мм' },
        { id: 'segMax', label: 'Макс. сегмент', type: 'range', min: 8, max: 300, step: 1, value: 75, unit: 'мм' },
        { id: 'levels', label: 'Уровни', type: 'range', min: 2, max: 8, step: 1, value: 4 },
        { id: 'minDepth', label: 'Мин. вынос', type: 'range', min: 0, max: 0.95, step: 0.01, value: 0.35 },
        { id: 'chamfer', label: 'Фаска', type: 'range', min: 0, max: 4, step: 0.1, value: 0.5, unit: 'мм' },
      ],
    },
    folds: {
      label: 'Складки',
      hint: 'Панели со сломанной гранью; сила излома меняется градиентом.',
      params: [
        { id: 'cols', label: 'Колонки', type: 'range', min: 2, max: 30, step: 1, value: 8 },
        { id: 'rows', label: 'Ряды', type: 'range', min: 2, max: 40, step: 1, value: 10 },
        { id: 'fold', label: 'Излом', type: 'range', min: 0, max: 1, step: 0.01, value: 0.55 },
        { id: 'crease', label: 'Линия излома', type: 'range', min: 0.15, max: 0.85, step: 0.01, value: 0.5 },
        { id: 'skew', label: 'Скос', type: 'range', min: -0.45, max: 0.45, step: 0.01, value: 0.25 },
        { id: 'kink', label: 'Точка перелома', type: 'range', min: 0.2, max: 1, step: 0.01, value: 0.72 },
        { id: 'topRatio', label: 'Верхний край', type: 'range', min: 0, max: 1, step: 0.01, value: 0.1 },
        { id: 'rest', label: 'Базовый вынос', type: 'range', min: 0, max: 0.9, step: 0.01, value: 0.1 },
        { id: 'grad', label: 'Градиент', type: 'select', value: 'left', options: [
          ['none', 'Нет'], ['left', 'Сильнее слева'], ['right', 'Сильнее справа'], ['top', 'Сильнее сверху'],
          ['bottom', 'Сильнее снизу'], ['center', 'Сильнее в центре'], ['noise', 'Шум']] },
        { id: 'gradMin', label: 'Мин. излом', type: 'range', min: 0, max: 1, step: 0.01, value: 0.05, showIf: (p) => p.grad !== 'none' },
        { id: 'joint', label: 'Шов', type: 'range', min: 0, max: 5, step: 0.1, value: 0.6, unit: 'мм' },
      ],
    },
  };

  function defaults(schema) {
    const o = {};
    for (const d of schema) o[d.id] = d.value;
    return o;
  }

  /* ---------- generators: params -> [{pts, key}] (convex point sets) ---------- */

  // Tumbled cuboids. Each is a leaning column whose top face is the visible block face;
  // the column reaches below the bed so every block is anchored (clipped at z=0 later).
  function genPile(p, ctx) {
    const { W, D, base, H, seed } = ctx;
    const rnd = rngFor(seed, 11);
    const n = p.count | 0;
    const centers = [];
    for (let i = 0; i < n; i++) {                       // best-candidate sampling, toroidal
      let best = null, bestD = -1;
      const k = centers.length ? 12 : 1;
      for (let c = 0; c < k; c++) {
        const x = rnd() * W, y = rnd() * D;
        let dmin = Infinity;
        for (const q of centers) {
          let dx = Math.abs(x - q[0]), dy = Math.abs(y - q[1]);
          dx = Math.min(dx, W - dx); dy = Math.min(dy, D - dy);
          const dd = dx * dx + dy * dy;
          if (dd < dmin) dmin = dd;
        }
        if (dmin > bestD) { bestD = dmin; best = [x, y]; }
      }
      centers.push(best);
    }
    const parts = [];
    const tiltMax = (p.tilt * Math.PI) / 180;
    for (let i = 0; i < n; i++) {
      const [cx, cy] = centers[i];
      const a = Math.max(2, p.size * (1 + p.sizeVar * (rnd() * 2 - 1) * 0.7));
      const b = Math.max(2, a * p.aspect * (0.85 + 0.3 * rnd()));
      const th = tiltMax * Math.sqrt(rnd()), ph = rnd() * Math.PI * 2;
      const w = [Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph), Math.cos(th)];
      const u0 = normalize(cross(Math.abs(w[2]) < 0.99 ? [0, 0, 1] : [1, 0, 0], w));
      const v0 = cross(w, u0);
      const ps = rnd() * Math.PI * 2;
      const u = add(scale(u0, Math.cos(ps)), scale(v0, Math.sin(ps)));
      const v = cross(w, u);
      const reach = (Math.abs(u[2]) * a) / 2 + (Math.abs(v[2]) * b) / 2;
      const topZ = base + H * (1 - p.heightVar * rnd());
      const cz = topZ - reach;                            // highest top corner lands on topZ
      const depth = (cz + reach + 1) / w[2];              // all bottom corners below the bed
      const pts = [];
      for (const sa of [-1, 1]) for (const sb of [-1, 1]) {
        const t = [cx + (u[0] * sa * a) / 2 + (v[0] * sb * b) / 2,
                   cy + (u[1] * sa * a) / 2 + (v[1] * sb * b) / 2,
                   cz + (u[2] * sa * a) / 2 + (v[2] * sb * b) / 2];
        pts.push(t, [t[0] - w[0] * depth, t[1] - w[1] * depth, t[2] - w[2] * depth]);
      }
      parts.push({ pts, key: i + 1 });
    }
    return parts;
  }

  function blockLevel(p, i, j, nx, ny, seed) {
    const L = Math.max(2, p.levels | 0);
    switch (p.mode) {
      case 'checker': return (i + j) & 1 ? 1 : 0;
      case 'diagonal': return ((i + j) % L) / (L - 1);
      case 'gradient': return quantize((i + 0.5) / nx, L);
      case 'wave': {
        const r = Math.hypot(i + 0.5 - nx / 2, j + 0.5 - ny / 2);
        return quantize(0.4999 + 0.4999 * Math.cos((2 * Math.PI * r) / p.period), L);
      }
      case 'noise': {
        const fx = Math.max(1, Math.round(nx / p.period)), fy = Math.max(1, Math.round(ny / p.period));
        return quantize(stretch(fbm(((i + 0.5) / nx) * fx, ((j + 0.5) / ny) * fy, seed, fx, fy, 3)), L);
      }
      default: return quantize(hash3(i, j, seed), L);
    }
  }

  function genBlocks(p, ctx) {
    const { W, D, base, H, seed } = ctx;
    const nx = p.cols | 0, ny = p.rows | 0, cw = W / nx, ch = D / ny;
    const g = Math.min(p.joint / 2, cw * 0.45, ch * 0.45);
    const slope = Math.tan((p.tilt * Math.PI) / 180);
    const parts = [];
    for (let j = 0; j < ny; j++) {
      const shift = j & 1 ? p.bond * cw : 0;
      for (let i = -1; i <= nx; i++) {
        const x0 = i * cw + shift, x1 = x0 + cw;
        if (x1 <= 1e-9 || x0 >= W - 1e-9) continue;
        const ii = ((i % nx) + nx) % nx;
        const q = blockLevel(p, ii, j, nx, ny, seed);
        const zt = base + H * (p.minDepth + (1 - p.minDepth) * q);
        let sx = 0, sy = 0;
        if (slope > 0) {
          let dir = 0;
          if (p.tiltMode === 'alt') dir = (ii + j) & 1 ? Math.PI : 0;
          else if (p.tiltMode === 'random') dir = Math.floor(hash3(ii, j, seed + 77) * 4) * (Math.PI / 2);
          sx = Math.cos(dir) * slope; sy = Math.sin(dir) * slope;
        }
        const bx0 = x0 + g, bx1 = x1 - g, by0 = j * ch + g, by1 = (j + 1) * ch - g;
        const mx = (bx0 + bx1) / 2, my = (by0 + by1) / 2;
        const half = (Math.abs(sx) * (bx1 - bx0)) / 2 + (Math.abs(sy) * (by1 - by0)) / 2;
        const zc = Math.max(zt - half, base + 0.3 + half);  // lowest top corner stays above the base
        const topZ = (x, y) => zc + sx * (x - mx) + sy * (y - my);
        parts.push({ pts: columnPts(bx0, by0, bx1, by1, topZ, p.chamfer), key: 100000 + ii + j * 1000 });
      }
    }
    return parts;
  }

  function pyramidCells(p, W, D) {
    const n = p.cells | 0, cells = [];
    if (p.layout === 'diamond') {
      const px = W / n, ny = Math.max(1, Math.round(D / px)), py = D / ny;
      const dia = (cx, cy) => [[cx, cy - py / 2], [cx + px / 2, cy], [cx, cy + py / 2], [cx - px / 2, cy]];
      for (let j = 0; j <= ny; j++) for (let i = 0; i <= n; i++) {
        cells.push({ poly: dia(i * px, j * py), id: [i % n, j % ny, 0], par: 0 });
      }
      for (let j = 0; j < ny; j++) for (let i = 0; i < n; i++) {
        cells.push({ poly: dia((i + 0.5) * px, (j + 0.5) * py), id: [i, j, 1], par: 1 });
      }
    } else if (p.layout === 'triangle') {
      const s = W / n;
      const rows = Math.max(2, 2 * Math.round(D / ((s * Math.sqrt(3)) / 2) / 2));
      const h = D / rows;
      for (let r = 0; r < rows; r++) {
        const y0 = r * h, y1 = y0 + h, ob = (r & 1) * 0.5, ot = ((r + 1) & 1) * 0.5;
        for (let k = -1; k <= n; k++) {
          const kk = ((k % n) + n) % n;
          const xb = (k + ob) * s, xt = (k + ot) * s;
          cells.push({ poly: [[xb, y0], [xb + s, y0], [xb + s / 2, y1]], id: [kk, r, 0], par: 0 });
          cells.push({ poly: [[xt, y1], [xt + s / 2, y0], [xt + s, y1]], id: [kk, r, 1], par: 1 });
        }
      }
    } else {
      const nx = n, ny = Math.max(1, Math.round((n * D) / W)), cw = W / nx, ch = D / ny;
      for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
        cells.push({ poly: [[i * cw, j * ch], [(i + 1) * cw, j * ch], [(i + 1) * cw, (j + 1) * ch], [i * cw, (j + 1) * ch]],
                     id: [i, j, 0], par: (i + j) & 1 });
      }
    }
    return cells;
  }

  function genPyramids(p, ctx) {
    const { W, D, base, H, seed } = ctx;
    const parts = [];
    for (const cell of pyramidCells(p, W, D)) {
      const poly = cell.poly, m = poly.length;
      let cx = 0, cy = 0, area = 0, perim = 0;
      for (let k = 0; k < m; k++) {
        const [x0, y0] = poly[k], [x1, y1] = poly[(k + 1) % m];
        cx += x0 / m; cy += y0 / m;
        area += x0 * y1 - x1 * y0;
        perim += Math.hypot(x1 - x0, y1 - y0);
      }
      const rin = Math.abs(area) / perim;                  // 2A/P
      const [a, b, fam] = cell.id;
      const hs = (salt) => hash3(a * 2 + fam, b, seed + salt);
      const g = Math.min(p.joint / 2, rin * 0.5);
      const k = 1 - g / rin;
      const q = poly.map(([x, y]) => [cx + (x - cx) * k, cy + (y - cy) * k]);
      const base0 = (p.angle * Math.PI) / 180;
      let ang;
      switch (p.dirMode) {
        case 'aligned': ang = base0 + (hs(3) - 0.5) * 0.5; break;
        case 'alternate': ang = base0 + (cell.par ? Math.PI : 0); break;
        case 'radial': ang = Math.atan2(cy - D / 2, cx - W / 2); break;
        case 'flow': {
          const wx = (((cx % W) + W) % W) / W, wy = (((cy % D) + D) % D) / D;
          ang = base0 + fbm(wx * 3, wy * 3, seed + 5, 3, 3, 2) * Math.PI * 4;
          break;
        }
        default: ang = hs(3) * Math.PI * 2;
      }
      const off = p.offset * 0.92 * (rin - g);
      const apex = [cx + Math.cos(ang) * off, cy + Math.sin(ang) * off, base + H * (1 - p.heightVar * hs(5))];
      const pts = [apex];
      for (const [x, y] of q) pts.push([x, y, 0], [x, y, base]);
      parts.push({ pts, key: 200000 + fam * 60000 + a * 211 + b });
    }
    return parts;
  }

  function genFins(p, ctx) {
    const { W, D, base, H, seed } = ctx;
    const vert = p.orient !== 'h';
    const A = vert ? W : D, B = vert ? D : W;
    const rnd = rngFor(seed, 41);
    const n = p.count | 0, L = Math.max(2, p.levels | 0), g = p.gap / 2;
    const segMin = Math.min(p.segMin, p.segMax), segMax = Math.max(p.segMin, p.segMax);
    const widths = [];
    let sum = 0;
    for (let f = 0; f < n; f++) {
      const w = Math.max(0.15, 1 + p.widthVar * (rnd() * 2 - 1) * 0.85);
      widths.push(w); sum += w;
    }
    const parts = [];
    let a0 = 0;
    for (let f = 0; f < n; f++) {
      const a1 = a0 + (widths[f] / sum) * A;
      const fa0 = a0 + g, fa1 = a1 - g;
      a0 = a1;
      // segment lengths, normalised so the fin repeats exactly every B (seamless)
      const lens = [];
      let tot = 0;
      while (tot < B) { const l = segMin + (segMax - segMin) * rnd(); lens.push(l); tot += l; }
      for (let k = 0; k < lens.length; k++) lens[k] *= B / tot;
      let prev = -1;
      const lv = lens.map(() => {
        let q, tries = 0;
        do { q = Math.min(L - 1, Math.floor(rnd() * L)); } while (q === prev && ++tries < 6);
        prev = q;
        return q / (L - 1);
      });
      let s = -rnd() * B;                                  // random phase per fin -> staggered joints
      if (fa1 - fa0 < 0.2) continue;
      for (let k = 0; k < lens.length; k++) {
        const e = s + lens[k];
        const zt = base + H * (p.minDepth + (1 - p.minDepth) * lv[k]);
        const emit = (b0, b1) => {
          const r = vert ? [fa0, b0, fa1, b1] : [b0, fa0, b1, fa1];
          parts.push({ pts: columnPts(r[0], r[1], r[2], r[3], () => zt, p.chamfer), key: 300000 + f * 997 + k });
        };
        if (e > 0) emit(s, e);
        if (s < 0) emit(s + B, e + B);                     // wrap-around copy
        s = e;
      }
    }
    return parts;
  }

  function foldGradient(p, i, j, nx, ny, seed) {
    const u = (i + 0.5) / nx, v = (j + 0.5) / ny;
    switch (p.grad) {
      case 'left': return 1 - u;
      case 'right': return u;
      case 'top': return v;
      case 'bottom': return 1 - v;
      case 'center': return clamp(1 - Math.hypot(u - 0.5, v - 0.5) / Math.SQRT1_2, 0, 1);
      case 'noise': return stretch(fbm(u * 2, v * 2, seed, 2, 2, 3));
      default: return 1;
    }
  }

  // Each panel: ridge along a kinked crease. The hull of these points is exactly the folded plate.
  function genFolds(p, ctx) {
    const { W, D, base, H, seed } = ctx;
    const nx = p.cols | 0, ny = p.rows | 0, cw = W / nx, ch = D / ny;
    const g = Math.min(p.joint / 2, cw * 0.4, ch * 0.4);
    const parts = [];
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      const x0 = i * cw + g, x1 = (i + 1) * cw - g, y0 = j * ch + g, y1 = (j + 1) * ch - g;
      const pw = x1 - x0, ph = y1 - y0;
      const gf = p.grad === 'none' ? 1 : p.gradMin + (1 - p.gradMin) * foldGradient(p, i, j, nx, ny, seed);
      const zB = base + Math.max(0.3, H * p.rest);
      const lift = base + H - zB;
      const zC = zB + lift * p.fold * gf;
      const zT = zB + lift * p.fold * gf * p.topRatio;
      const yc = y0 + ph * p.crease;
      const yk = clamp(yc + ph * p.skew, y0 + ph * 0.05, y1 - ph * 0.05);
      const xk = x0 + pw * p.kink;
      const pts = [[x0, y0, 0], [x1, y0, 0], [x1, y1, 0], [x0, y1, 0],
                   [x0, y0, zB], [x1, y0, zB], [x1, y1, zT], [x0, y1, zT],
                   [x0, yc, zC], [xk, yc, zC], [x1, yk, zC]];
      parts.push({ pts, key: 400000 + i + j * 1000 });
    }
    return parts;
  }

  const GENERATORS = { pile: genPile, blocks: genBlocks, pyramids: genPyramids, fins: genFins, folds: genFolds };
  const WRAPS = { pile: true };   // patterns whose parts get periodic copies across the plate edges

  function bboxOf(pts) {
    const b = [Infinity, Infinity, Infinity, -Infinity, -Infinity, -Infinity];
    for (const p of pts) {
      for (let k = 0; k < 3; k++) { if (p[k] < b[k]) b[k] = p[k]; if (p[k] > b[k + 3]) b[k + 3] = p[k]; }
    }
    return b;
  }

  function finish(h, key) {
    return {
      faces: h.faces, planes: h.planes, key,
      bbox: bboxOf(hullVerts(h)),
      tone: key === 0 ? 0.5 : hash3(key, 17, 991),
      uo: key === 0 ? 0 : hash3(key, 23, 5) * 500,
      vo: key === 0 ? 0 : hash3(key, 29, 7) * 500,
    };
  }

  // All solids, clipped to the plate box [0,W]×[0,D]×[0,base+H]. solids[0] is the base slab.
  function build(pattern, params, common) {
    const W = +common.W, D = +common.D, base = +common.base, H = +common.H, seed = common.seed | 0;
    const top = base + H;
    const parts = GENERATORS[pattern](params, { W, D, base, H, seed });
    const solids = [finish(convexHull(boxPts(0, 0, W, D, 0, base)), 0)];
    for (const part of parts) {
      const bb = bboxOf(part.pts);
      const xs = [0], ys = [0];
      if (WRAPS[pattern]) {
        if (bb[0] < 0) xs.push(W);
        if (bb[3] > W) xs.push(-W);
        if (bb[1] < 0) ys.push(D);
        if (bb[4] > D) ys.push(-D);
      }
      for (const dx of xs) for (const dy of ys) {
        const minx = bb[0] + dx, maxx = bb[3] + dx, miny = bb[1] + dy, maxy = bb[4] + dy;
        if (maxx <= 0 || minx >= W || maxy <= 0 || miny >= D) continue;
        const pts = dx || dy ? part.pts.map((q) => [q[0] + dx, q[1] + dy, q[2]]) : part.pts;
        let h = convexHull(pts);
        if (h && minx < 0) h = clipHull(h, [-1, 0, 0], 0);
        if (h && maxx > W) h = clipHull(h, [1, 0, 0], W);
        if (h && miny < 0) h = clipHull(h, [0, -1, 0], 0);
        if (h && maxy > D) h = clipHull(h, [0, 1, 0], D);
        if (h && bb[2] < 0) h = clipHull(h, [0, 0, -1], 0);
        if (h && bb[5] > top) h = clipHull(h, [0, 0, 1], top);
        if (h) solids.push(finish(h, part.key));
      }
    }
    return solids;
  }

  const material = new THREE.MeshStandardMaterial({ vertexColors: true, metalness: 0 });
  const mesh = new THREE.Mesh(new THREE.BufferGeometry(), material);
  mesh.castShadow = mesh.receiveShadow = true;
  holder.add(mesh);

  let solids = [], tones = null, triCount = 0;

  function applyMaterial() {
    const m = MATS[state.view.material] || MATS.concrete;
    const tex = !m.plain && state.view.texture ? concrete : null;
    material.color.setHex(m.color);
    material.roughness = m.rough;
    material.map = tex;
    material.bumpMap = tex;
    material.bumpScale = 0.45;
    material.needsUpdate = true;
  }
  function applyTones() {
    const attr = mesh.geometry.getAttribute('color');
    if (!attr || !tones) return;
    const k = state.view.toneVar * 0.45, a = attr.array;
    for (let v = 0; v < tones.length; v++) a[v * 3] = a[v * 3 + 1] = a[v * 3 + 2] = 1 - k * tones[v];
    attr.needsUpdate = true;
  }

  function plate() {
    const { W, D, base, H } = state.common;
    return { W, D, base, H, top: base + H };
  }

  function updateLight() {
    const { W, D, top } = plate();
    const a = (state.view.az * Math.PI) / 180, e = (state.view.el * Math.PI) / 180;
    // light direction in model space -> world (x, z, -y)
    const L = [Math.cos(e) * Math.cos(a), Math.cos(e) * Math.sin(a), Math.sin(e)];
    const R = Math.hypot(W, D) / 2 + top, dist = R * 3;
    sun.position.set(L[0] * dist, L[2] * dist, -L[1] * dist);
    sun.target.position.set(0, top / 2, 0);
    const cam = sun.shadow.camera;
    cam.left = cam.bottom = -R; cam.right = cam.top = R;
    cam.near = Math.max(1, dist - 2 * R); cam.far = dist + 2 * R;
    cam.updateProjectionMatrix();
    fill.position.set(-L[0] * dist, dist * 0.6, L[1] * dist);
  }

  function setCamera(kind) {
    const { W, D, top } = plate();
    const span = Math.max(W, D);
    const dist = (span / 2 / Math.tan((camera.fov * Math.PI) / 360)) * 1.3;
    const [el, az] = kind === 'top' ? [89.9, 0] : kind === 'low' ? [20, -28] : [55, -30];
    const e = (el * Math.PI) / 180, a = (az * Math.PI) / 180;
    controls.target.set(0, top * 0.4, 0);
    camera.position.set(Math.sin(a) * Math.cos(e) * dist, top * 0.4 + Math.sin(e) * dist, Math.cos(a) * Math.cos(e) * dist);
    controls.update();
  }

  const fmtInt = (n) => Math.round(n).toLocaleString('ru-RU');
  const fmtMB = (b) => (b >= 1e6 ? (b / 1e6).toFixed(1) + ' МБ' : Math.max(1, Math.round(b / 1e3)) + ' КБ');

  function monolithSize() {
    const { W, D } = plate(), s = state.exp.step;
    const nx = Math.max(2, Math.round(W / s)), ny = Math.max(2, Math.round(D / s));
    return { nx, ny, tris: 2 * nx * ny + 6 * (nx + ny) };
  }
  function updateExportInfo() {
    const m = monolithSize();
    $('#exportInfo').innerHTML =
      `Монолит: ${fmtInt(m.tris)} треуг., ≈ ${fmtMB(84 + 50 * m.tris)}. ` +
      `Точные тела: ${fmtInt(triCount)} треуг., ≈ ${fmtMB(84 + 50 * triCount)}. ` +
      `PNG: ${m.nx + 1}×${m.ny + 1} px.<br>Все паттерны бесшовны (кроме градиентов и режима «от центра»).`;
  }

  function regenerate() {
    const t0 = performance.now();
    solids = C.build(state.pattern, state.params[state.pattern], state.common);
    const t = C.triangulate(solids);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(t.pos, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(t.nrm, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(t.uv, 2));
    g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(t.count * 9), 3));
    mesh.geometry.dispose();
    mesh.geometry = g;
    tones = t.tone;
    triCount = t.count;
    applyTones();
    const { W, D, top } = plate();
    holder.position.set(-W / 2, 0, D / 2);
    updateLight();
    const ms = Math.round(performance.now() - t0);
    $('#stats').innerHTML =
      `${fmtInt(solids.length - 1)} элементов · ${fmtInt(t.count)} треуг.<br>` +
      `${W} × ${D} × ${+top.toFixed(1)} мм · ${ms} мс`;
    updateExportInfo();
  }

  let dirty = true;
  function invalidate() { dirty = true; }

  /* ---------- export ---------- */
  function download(data, name, type) {
    const url = URL.createObjectURL(new Blob([data], { type }));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  const stem = () => `brutalist-${state.pattern}-${state.common.seed}`;
  async function busy(label, fn) {
    const el = $('#busy');
    el.textContent = label; el.hidden = false;
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    try { await fn(); } catch (e) { console.error(e); alert('Ошибка: ' + e.message); } finally { el.hidden = true; }
  }
  function checkMonolith() {
    const m = monolithSize();
    if (m.tris > 8e6) { alert('Слишком мелкий шаг сетки для такой плиты: увеличьте «Шаг сетки».'); return false; }
    if (m.tris > 2.5e6) return confirm(`Получится ${fmtInt(m.tris)} треугольников (≈ ${fmtMB(84 + 50 * m.tris)}). Продолжить?`);
    return true;
  }
  const header = (kind) => `Brutalist Surface ${state.pattern} ${kind} seed=${state.common.seed} units=mm`;

  $('#btnExact').addEventListener('click', () => busy('Собираю STL…', () => {
    const t = C.triangulate(solids);
    download(C.toSTL(t.pos, header('exact')), stem() + '-exact.stl', 'model/stl');
  }));
  $('#btnSolid').addEventListener('click', () => {
    if (!checkMonolith()) return;
    busy('Считаю монолит…', () => {
      const { W, D } = plate();
      const hf = C.rasterize(solids, W, D, state.exp.step);
      download(C.toSTL(C.heightfieldMesh(hf), header('solid')), stem() + '-solid.stl', 'model/stl');
    });
  });
  $('#btnPNG').addEventListener('click', () => {
    const m = monolithSize();
    if ((m.nx + 1) * (m.ny + 1) > 40e6) { alert('Слишком большое изображение: увеличьте «Шаг сетки».'); return; }
    busy('Считаю карту высот…', async () => {
      const { W, D, base, top } = plate();
      const hf = C.rasterize(solids, W, D, state.exp.step);
      download(await C.heightmapPNG(hf, base, top), stem() + '-height16.png', 'image/png');
    });
  });
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 1600);
  }
  $('#btnLink').addEventListener('click', async () => {
    clearTimeout(hashTimer);
    scheduleHash();
    await new Promise((r) => setTimeout(r, 300));
    try { await navigator.clipboard.writeText(location.href); toast('Ссылка скопирована'); }
    catch (e) { prompt('Ссылка на текущие параметры:', location.href); }
  });
  $('#btnReset').addEventListener('click', () => {
    state.params[state.pattern] = C.defaults(C.PATTERNS[state.pattern].params);
    renderPatternParams(); invalidate(); scheduleHash();
  });
  document.querySelectorAll('#cams button').forEach((b) => b.addEventListener('click', () => setCamera(b.dataset.cam)));

  function randomSeed() {
    state.common.seed = 1 + Math.floor(Math.random() * 99999);
    $('#grp-common').rows.forEach((r) => r.sync());
    invalidate(); scheduleHash();
  }
  window.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input, select, textarea')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'r' || k === 'к') randomSeed();
    if (k === 'f' || k === 'а') setCamera('top');
  });

  /* ---------- wire up ---------- */
  renderPatterns();
  renderPatternParams();
  renderGroup($('#grp-common'), C.COMMON, state.common, (d) => { invalidate(); if (d.id !== 'seed') updateExportInfo(); });
  renderGroup($('#grp-view'), VIEW, state.view, (d) => {
    if (d.id === 'az' || d.id === 'el') updateLight();
    else if (d.id === 'toneVar') applyTones();
    else applyMaterial();
  });
  renderGroup($('#grp-export'), EXPORT, state.exp, updateExportInfo);
  applyMaterial();

  function resize() {
    const w = view.clientWidth, h = view.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(view);
  resize();

  regenerate();
  dirty = false;
  setCamera('34');

  (function frame() {
    requestAnimationFrame(frame);
    if (dirty) { dirty = false; regenerate(); }
    controls.update();
    renderer.render(scene, camera);
  })();
})();
</script>
</body>
</html>
