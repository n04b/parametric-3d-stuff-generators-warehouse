  wrap.append(title);

  if (p.type === 'bool') {
    wrap.classList.add('bool');
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.addEventListener('change', () => update(p.key, box.checked));
    wrap.append(box);
    controlsByKey.set(p.key, { wrap, set: (v) => (box.checked = v) });
  } else if (p.type === 'select') {
    wrap.classList.add('choice');
    const sel = document.createElement('select');
    for (const [v, t] of p.options) sel.add(new Option(t, v));
    sel.addEventListener('change', () => update(p.key, sel.value));
    wrap.append(sel);
    controlsByKey.set(p.key, { wrap, set: (v) => (sel.value = v) });
  } else {
    const num = document.createElement('input');
    num.type = 'number';
    num.min = p.min; num.max = p.max; num.step = p.step;
    const range = document.createElement('input');
    range.type = 'range';
    range.min = p.min; range.max = p.max; range.step = p.step;
    const parse = (v) => {
      let x = Number(v);
      if (!Number.isFinite(x)) return null;
      if (p.type === 'int') x = Math.round(x);
      return Math.min(p.max, Math.max(p.min, x));
    };
    num.addEventListener('change', () => {
      const x = parse(num.value);
      if (x === null) { num.value = state[p.key]; return; }
      num.value = x; range.value = x;
      update(p.key, x);
    });
    range.addEventListener('input', () => {
      const x = parse(range.value);
      num.value = x;
      update(p.key, x);
    });
    wrap.append(num, range);
    controlsByKey.set(p.key, { wrap, set: (v) => { num.value = v; range.value = v; } });
  }
  return wrap;
}

const groupBodies = {};
for (const [id, title] of Object.entries(GROUPS)) {
  const det = document.createElement('details');
  det.open = id !== 'output' && id !== 'print';
  const sum = document.createElement('summary');
  sum.textContent = title;
  det.append(sum);
  groupBodies[id] = det;
  $('groups').append(det);
}

// STL loader sits at the top of its group.
{
  const row = document.createElement('div');
  row.className = 'group-actions';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = 'Load STL…';
  btn.addEventListener('click', () => $('stl-file').click());
  const note = document.createElement('p');
  note.className = 'hint';
  note.id = 'stl-name';
  note.textContent = 'Any STL: it is centred, scaled to the tile and stood on its top face. Or pick a built-in model.';
  row.append(btn, note);
  groupBodies.decor.append(row);
}
for (const p of PARAMS) groupBodies[p.group].append(makeControl(p));

$('stl-file').addEventListener('change', async () => {
  const file = $('stl-file').files[0];
  if (!file) return;
  try {
    const raw = parseSTL(await file.arrayBuffer());
    loadedSTL = { name: file.name, raw };
    $('stl-name').textContent = `${file.name}: ${(raw.length / 9).toLocaleString('en-US')} triangles`;
    state.decor = 'stl';
    $('preset').value = 'custom';
    syncForm();
    schedule();
  } catch (e) {
    $('stl-name').textContent = `Could not read ${file.name}: ${e.message}`;
  }
  $('stl-file').value = '';
});

PRESETS.forEach((pr, i) => $('preset').add(new Option(pr.name, i)));
$('preset').add(new Option('— custom settings —', 'custom'));
$('preset').value = fromHash ? 'custom' : 0;
$('preset').addEventListener('change', () => {
  const pr = PRESETS[Number($('preset').value)];
  if (!pr) return;
  Object.assign(state, DEFAULTS, pr.params);
  syncForm();
  schedule();
});

function syncVisibility() {
  for (const p of PARAMS) controlsByKey.get(p.key).wrap.hidden = p.when ? !p.when(state) : false;
}

function syncForm() {
  for (const p of PARAMS) controlsByKey.get(p.key).set(state[p.key]);
  syncVisibility();
}

function update(key, value) {
  state[key] = value;
  if (key !== 'segments' && key !== 'exportWhat') $('preset').value = 'custom';
  syncVisibility();
  schedule();
}

// ---------- scene ----------

const viewport = $('viewport');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
viewport.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 20000);
camera.up.set(0, 0, 1);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;

const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8a8a, 1.1);
scene.add(hemi);
const keyLight = new THREE.DirectionalLight(0xffffff, 2.4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(4096, 4096);
scene.add(keyLight, keyLight.target);
const rim = new THREE.DirectionalLight(0xffffff, 0.6);
scene.add(rim);

const clipPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const material = new THREE.MeshStandardMaterial({ roughness: 0.6, metalness: 0.15, flatShading: true, vertexColors: true, side: THREE.FrontSide });
const decorMaterial = new THREE.MeshStandardMaterial({ roughness: 0.5, metalness: 0.1, color: 0xd98b3a, flatShading: true });

function applyView() {
  const colours = $('colors').checked;
  material.vertexColors = colours;
  material.color.set(colours ? 0xffffff : 0xcfcfcb);
  material.needsUpdate = true;
  material.wireframe = decorMaterial.wireframe = $('wire').checked;
  const size = Math.max(state.width, state.shape === 'hexagon' ? state.width : state.height);
  keyLight.position.set(-0.6 * size, 0.7 * size, 1.4 * size);
  rim.position.set(size, -size, -0.6 * size);
  keyLight.castShadow = $('shadows').checked;
  const cam = keyLight.shadow.camera;
  cam.left = cam.bottom = -size * 0.8;
  cam.right = cam.top = size * 0.8;
  cam.near = size * 0.2;
  cam.far = size * 5;
  cam.updateProjectionMatrix();
  keyLight.shadow.bias = -0.0003;
  keyLight.shadow.normalBias = (2 * size) / keyLight.shadow.mapSize.x;
  const cut = $('cut').checked;
  $('cutpos').hidden = !cut;
  clipPlane.constant = -Number($('cutpos').value) * (size / 2);
  material.clippingPlanes = decorMaterial.clippingPlanes = cut ? [clipPlane] : [];
}
applyView();
for (const id of ['colors', 'wire', 'shadows', 'cut']) $(id).addEventListener('change', applyView);
$('cutpos').addEventListener('input', applyView);

let fabricMesh = null;
let decorMesh = null;

function resize() {
  const { clientWidth: w, clientHeight: h } = viewport;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(viewport);

function frameObject(fromBelow = false) {
  const size = Math.max(state.width, state.shape === 'hexagon' ? state.width : state.height);
  const d = size * 1.7;
  const tilt = fromBelow ? -1.05 : 0.95;
  camera.position.set(0, -d * Math.cos(tilt), d * Math.sin(tilt));
  orbit.target.set(0, 0, 0);
  camera.near = size / 400;
  camera.far = size * 20;
  camera.updateProjectionMatrix();
  orbit.update();
}
$('reset-view').addEventListener('click', () => frameObject(false));
$('bottom-view').addEventListener('click', () => frameObject(true));

(function loop() {
  orbit.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})();

// ---------- generation ----------

let timer = 0;
let lastFrameKey = '';
let current = null;
function schedule() {
  clearTimeout(timer);
  $('busy').hidden = false;
  timer = setTimeout(regenerate, 60);
}

function regenerate() {
  let fabric;
  try {
    fabric = buildFabric(state);
  } catch (e) {
    $('message').textContent = `Error: ${e.message}`;
    $('busy').hidden = true;
    return;
  }
  const soup = currentDecor(state);
  const places = decorPlacements(state, fabric, soup);
  current = { fabric, soup, places };

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(fabric.positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(fabric.colors, 3));
  geo.computeVertexNormals();
  if (fabricMesh) { scene.remove(fabricMesh); fabricMesh.geometry.dispose(); }
  fabricMesh = new THREE.Mesh(geo, material);
  fabricMesh.castShadow = fabricMesh.receiveShadow = true;
  scene.add(fabricMesh);

  if (decorMesh) { scene.remove(decorMesh); decorMesh.dispose(); decorMesh = null; }
  if (soup && places.length) {
    const dg = new THREE.BufferGeometry();
    dg.setAttribute('position', new THREE.BufferAttribute(soup.tris, 3));
    dg.computeVertexNormals();
    decorMesh = new THREE.InstancedMesh(dg, decorMaterial, places.length);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), z = new THREE.Vector3(0, 0, 1);
    places.forEach(([cx, cy, cz, a, sxy, sz], i) => {
      m.compose(new THREE.Vector3(cx, cy, cz), q.setFromAxisAngle(z, a), new THREE.Vector3(sxy, sxy, sz));
      decorMesh.setMatrixAt(i, m);
    });
    decorMesh.castShadow = decorMesh.receiveShadow = true;
    scene.add(decorMesh);
  }

  const frameKey = [state.width, state.height, state.shape].join();
  if (frameKey !== lastFrameKey) { applyView(); frameObject(); lastFrameKey = frameKey; }

  renderStats();
  scheduleFold();
  writeHash();
  $('busy').hidden = true;
}

function exportParts() {
  const { fabric, soup, places } = current;
  const parts = [];
  if (state.exportWhat !== 'decor') parts.push(fabric.positions);
  if (state.exportWhat !== 'fabric' && soup && places.length) parts.push(decorTriangles(soup, places));
  return parts;
}

function triangleCount() {
  const { fabric, soup, places } = current;
  let n = 0;
  if (state.exportWhat !== 'decor') n += fabric.positions.length / 9;
  if (state.exportWhat !== 'fabric' && soup) n += (soup.tris.length / 9) * places.length;
  return n;
}

function renderStats() {
  const { fabric, soup, places, fold } = current;
  const { info, S } = fabric;
  const P = fabric.positions;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, z1 = 0;
  for (let k = 0; k < P.length; k += 3) {
    if (P[k] < x0) x0 = P[k]; if (P[k] > x1) x1 = P[k];
    if (P[k + 1] < y0) y0 = P[k + 1]; if (P[k + 1] > y1) y1 = P[k + 1];
    if (P[k + 2] > z1) z1 = P[k + 2];
  }
  if (soup) for (const pl of places) z1 = Math.max(z1, pl[2] + soup.zsize * pl[5]);
  const tris = triangleCount();
  const mb = (84 + tris * 50) / 1048576;
  const rows = [];
  rows.push(['Tiles', `${info.tiles}`]);
  rows.push(['Joints', `${info.joints}${info.links ? `, ${info.links} free links` : ''}`]);
  if (info.tiles) rows.push(['Dimensions, mm', `${(x1 - x0).toFixed(1)} × ${(y1 - y0).toFixed(1)} × ${z1.toFixed(1)}`]);
  rows.push(['Heights, mm', S.levels.map(([n, z]) => `${n} ${z.toFixed(2)}`).join(', ')]);
  rows.push(['Bends: tiles out / in', fold ? `${fold.mountain}° / ${fold.valley}°` : '…']);
  if (fold && (fold.escV || fold.escM)) rows.push(['Can come apart', `bent over ${fold.escM ? fold.mountain : fold.valley}°: lower the clearance under bridges or use a taller bar`, true]);
  if (fold && S.under) rows.push(['Play pulled / pushed, mm', `${fold.play.pull.toFixed(2)} / ${fold.play.push.toFixed(2)}`]);
  if (S.bridges.length) {
    const [name, span] = S.bridges.reduce((a, b) => (b[1] > a[1] ? b : a));
    rows.push(['Longest bridge in a joint', `${span.toFixed(1)} mm (${name})`, span > 10]);
  }
  const thin = S.thin.filter(([, v]) => v < 2 * state.lineW - 1e-6).map(([n]) => n);
  if (thin.length) rows.push(['Thinner than 2 lines', thin.join(', '), true]);
  for (const [k, v] of S.notes) rows.push([k, v]);
  if (S.type === 'hinge' && (state.tiling === 'hex' || state.tiling === 'octagon')) rows.push(['Hinges lock', 'three tiles meet at a corner: use squares, rhombi, triangles or kagome', true]);
  if (S.type === 'flex') rows.push(['Strips bend', 'print in TPU or PETG, PLA strips crack']);
  rows.push(['Triangles in STL', tris.toLocaleString('en-US'), tris > EXPORT_WARN_TRIANGLES]);
  rows.push(['File size', `${mb.toFixed(1)} MB`]);
  if (info.tooShort) rows.push(['Joints do not fit', `edge ≥ ${info.minEdge.toFixed(1)} mm`, true]);
  if (info.pillarSkipped && state.pillar && isSolid(state) && S.under) rows.push(['Pillar too wide', `${info.pillarSkipped} tiles without`, true]);
  if (info.frames) rows.push(['Support frames', `${info.frames} tiles${info.spokes ? ', with spokes' : ''}`]);
  if (state.decor === 'stl' && !loadedSTL) rows.push(['Model', 'load an STL file', true]);
  $('stats').innerHTML = '<dl style="display:contents">' + rows
    .map(([k, v, w]) => `<dt>${k}</dt><dd${w ? ' class="warn"' : ''}>${v}</dd>`)
    .join('') + '</dl>';
}

// Bending limits take a moment: computed after the preview, cached per joint settings.
let foldTimer = 0;
function scheduleFold() {
  clearTimeout(foldTimer);
  const cur = current;
  foldTimer = setTimeout(() => {
    if (cur !== current) return;
    try { cur.fold = foldLimits(state, cur.fabric.S, cur.fabric.info.Rfold); } catch (e) { cur.fold = null; }
    if (cur === current) renderStats();
  }, 80);
}

// ---------- export & sharing ----------

$('export').addEventListener('click', () => {
  if (!current) return;
  const tris = triangleCount();
  if (!tris) { $('message').textContent = 'Nothing to export.'; return; }
  if (tris > EXPORT_WARN_TRIANGLES &&
    !confirm(`This will produce ${tris.toLocaleString('en-US')} triangles (~${Math.round((tris * 50) / 1048576)} MB). Continue?`)) return;
  const btn = $('export');
  btn.disabled = true;
  $('message').textContent = 'Building STL…';
  setTimeout(() => {
    try {
      const blob = new Blob([trianglesToSTL(exportParts())], { type: 'model/stl' });
      const suffix = state.exportWhat === 'all' ? '' : `-${state.exportWhat}`;
      const name = `space-fabric-${state.tiling}-${state.linkType}-${current.fabric.info.tiles}${suffix}.stl`;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10_000);
      $('message').textContent = `Saved: ${name}`;
    } catch (e) {
      $('message').textContent = `Error: ${e.message}`;
    } finally {
      btn.disabled = false;
    }
  }, 30);
});

function writeHash() {
  const q = new URLSearchParams();
  for (const p of PARAMS) if (state[p.key] !== p.value) q.set(p.key, state[p.key]);
  history.replaceState(null, '', `#${q}`);
}

function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  if (![...q.keys()].length) return false;
  Object.assign(state, DEFAULTS);
  for (const p of PARAMS) {
    if (!q.has(p.key)) continue;
    const raw = q.get(p.key);
    if (p.type === 'bool') state[p.key] = raw === 'true';
    else if (p.type === 'select') { if (p.options.some(([v]) => v === raw)) state[p.key] = raw; }
    else if (Number.isFinite(Number(raw))) state[p.key] = Math.min(p.max, Math.max(p.min, Number(raw)));
  }
  return true;
}

$('share').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(location.href);
    $('message').textContent = 'Link with parameters copied.';
  } catch {
    $('message').textContent = 'Copy the page URL: the parameters are saved in it.';
  }
});

// Test hook: lets headless checks call the generator directly.
window.__fabric = { camera, orbit, buildFabric, state, DEFAULTS, PRESETS, linkSpec, foldLimits, parseSTL, trianglesToSTL, decorPlacements, currentDecor, decorTriangles };

syncForm();
resize();
regenerate();
  </script>
</body>
</html>
