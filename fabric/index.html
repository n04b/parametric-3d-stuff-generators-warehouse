<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Fabric</title>
  <style>
:root {
  --bg: #f4f4f2;
  --panel: #ffffff;
  --text: #1d1d1b;
  --muted: #6b6b66;
  --line: #e2e1dc;
  --accent: #2f6fd6;
  --accent-text: #ffffff;
  --view: #d9d9d6;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615;
    --panel: #1f1f1d;
    --text: #ecebe6;
    --muted: #9b9a94;
    --line: #34332f;
    --accent: #5b92ec;
    --view: #2a2a28;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #161615;
  --panel: #1f1f1d;
  --text: #ecebe6;
  --muted: #9b9a94;
  --line: #34332f;
  --accent: #5b92ec;
  --view: #2a2a28;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

body {
  display: grid;
  grid-template-columns: 340px 1fr;
  height: 100vh;
}

#panel {
  overflow-y: auto;
  padding: 16px;
  background: var(--panel);
  border-right: 1px solid var(--line);
}

h1 { font-size: 18px; margin: 0 0 4px; }

details { border-top: 1px solid var(--line); padding: 4px 0 8px; }
summary {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  padding: 10px 0 8px;
  cursor: pointer;
  user-select: none;
}

.hint { color: var(--muted); margin: 0; font-size: 13px; }

.field {
  display: grid;
  grid-template-columns: 1fr 96px;
  align-items: center;
  gap: 4px 8px;
  margin-bottom: 8px;
}
.field > span { font-size: 13px; }
.field input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); }
.field.bool { grid-template-columns: 1fr auto; }
.field.choice { grid-template-columns: 1fr 170px; }
#panel > .field { grid-template-columns: 1fr 180px; margin: 16px 0; }

input[type="number"], select {
  width: 100%;
  padding: 4px 6px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
}

button {
  padding: 7px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
button:disabled { opacity: 0.5; cursor: progress; }
.group-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.group-actions .hint { flex: 1 1 100%; overflow-wrap: anywhere; }

#stats {
  margin-top: 16px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 13px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px 12px;
}
#stats dt { color: var(--muted); }
#stats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
#stats .warn { color: #c9582b; }

.actions { display: flex; gap: 8px; margin: 16px 0 8px; flex-wrap: wrap; }
.actions .primary { flex: 1; }

#viewport { position: relative; background: var(--view); min-height: 0; overflow: hidden; }
#viewport canvas { display: block; width: 100%; height: 100%; }

#busy {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  padding: 6px 14px;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid var(--line);
}

.view-tools {
  position: absolute;
  right: 12px;
  bottom: 12px;
  left: 12px;
  margin-left: auto;
  width: fit-content;
  max-width: calc(100% - 24px);
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
  padding: 6px 10px;
  border-radius: 8px;
  background: var(--panel);
  border: 1px solid var(--line);
}
.view-tools input[type="range"] { width: 120px; accent-color: var(--accent); vertical-align: middle; }

@media (max-width: 760px) {
  body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
  #viewport { grid-row: 1; height: 55vh; }
  #panel { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); }
}
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

      }

<body>
  <aside id="panel">
    <header>
      <h1>Space Fabric</h1>
      <p class="hint">Print-in-place chainmail of tiles, like NASA's 4D-printed space fabric. Printed face up without supports: rings, free links, hooks, rod hinges or flexible strips join the tiles. Dimensions in millimetres, export to STL.</p>
    </header>

    <label class="field">
      <span>Preset</span>
      <select id="preset"></select>
    </label>

    <div id="groups"></div>

    <section id="stats"></section>

    <div class="actions">
      <button id="export" type="button" class="primary">Download STL</button>
      <button id="share" type="button">Copy link</button>
    </div>
    <p id="message" class="hint" role="status"></p>
  </aside>

  <main id="viewport">
    <div id="busy" hidden>Generating…</div>
    <div class="view-tools">
      <label><input type="checkbox" id="colors" checked> Colours</label>
      <label><input type="checkbox" id="shadows" checked> Shadows</label>
      <label><input type="checkbox" id="wire"> Wireframe</label>
      <label><input type="checkbox" id="cut"> Cutaway</label>
      <input type="range" id="cutpos" min="-1" max="1" step="0.005" value="0" aria-label="Cutaway position" hidden>
      <button id="bottom-view" type="button">From below</button>
      <button id="reset-view" type="button">Reset view</button>
    </div>
  </main>

  <input type="file" id="stl-file" accept=".stl,model/stl,application/sla" hidden>

  <script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ===== util =====

function hashInt(a, b, c) {
  let h = a ^ Math.imul(b, 0x8da6b343) ^ Math.imul(c, 0xd8163841);
  h = Math.imul(h ^ (h >>> 16), 0x7feb352d);
  h = Math.imul(h ^ (h >>> 15), 0x846ca68b);
  return (h ^ (h >>> 16)) >>> 0;
}
const rand01 = (seed, i, k = 0) => hashInt(seed | 0, i | 0, k | 0) / 4294967296;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const TAU = Math.PI * 2;

// ===== params =====

const GROUPS = {
  fabric: 'Fabric',
  tiles: 'Tiles',
  top: 'Top face',
  links: 'Joints between tiles',
  print: 'Printing: layers and clearances',
  decor: 'Model on the top face',
  output: 'Output',
};

const TILINGS = [
  ['square', 'Squares'],
  ['hex', 'Hexagons'],
  ['triangle', 'Triangles'],
  ['octagon', 'Octagons + squares'],
  ['kagome', 'Hexagons + triangles'],
  ['rhombus', 'Rhombi (sheared squares)'],
];

// Joint types. "Under" joints hang below raised tiles, the others join tiles lying on the bed.
const LINK_TYPES = [
  ['ring', 'Ring around a bar'],
  ['free', 'Free link between two bars'],
  ['hook', 'Hook over a bar'],
  ['hinge', 'Hinge on a rod (tiles on the bed)'],
  ['flex', 'Flexible strips (one piece)'],
];

const isSolid = (s) => s.plateStyle === 'solid';
const hasDecor = (s) => s.decor !== 'none';
const isType = (...types) => (s) => types.includes(s.linkType);
const isUnder = isType('ring', 'free', 'hook');

const PARAMS = [
  { key: 'tiling', group: 'fabric', label: 'Tiling', type: 'select', options: TILINGS, value: 'square' },
  { key: 'edge', group: 'fabric', label: 'Tile edge, mm', type: 'number', min: 3, max: 200, step: 0.5, value: 16 },
  { key: 'shear', group: 'fabric', label: 'Rhombus angle, °', type: 'number', min: 45, max: 90, step: 1, value: 70, when: (s) => s.tiling === 'rhombus' },
  { key: 'shape', group: 'fabric', label: 'Fabric outline', type: 'select', options: [['rect', 'Rectangle'], ['ellipse', 'Ellipse / circle'], ['hexagon', 'Hexagon'], ['diamond', 'Diamond']], value: 'rect' },
  { key: 'width', group: 'fabric', label: 'Width, mm', type: 'number', min: 10, max: 2000, step: 1, value: 150 },
  { key: 'height', group: 'fabric', label: 'Height, mm', type: 'number', min: 10, max: 2000, step: 1, value: 150, when: (s) => s.shape !== 'hexagon' },
  { key: 'rotation', group: 'fabric', label: 'Tiling rotation, °', type: 'number', min: 0, max: 180, step: 0.5, value: 0 },

  { key: 'plateStyle', group: 'tiles', label: 'Tile style', type: 'select', options: [['solid', 'Solid tile'], ['ring', 'Ring (chainmail link)']], value: 'solid' },
  { key: 'outline', group: 'tiles', label: 'Tile outline', type: 'select', options: [['polygon', 'Cell polygon'], ['rounded', 'Rounded polygon'], ['circle', 'Circle'], ['star', 'Star'], ['flower', 'Flower']], value: 'polygon' },
  { key: 'cornerRadius', group: 'tiles', label: 'Corner radius, mm', type: 'number', min: 0, max: 50, step: 0.1, value: 2, when: (s) => s.outline === 'rounded' },
  { key: 'points', group: 'tiles', label: 'Points / petals', type: 'int', min: 3, max: 24, step: 1, value: 6, when: (s) => s.outline === 'star' || s.outline === 'flower' },
  { key: 'pointDepth', group: 'tiles', label: 'Point depth', type: 'number', min: 0.05, max: 0.9, step: 0.01, value: 0.4, when: (s) => s.outline === 'star' || s.outline === 'flower' },
  { key: 'plateScale', group: 'tiles', label: 'Tile size (share of cell)', type: 'number', min: 0.3, max: 1, step: 0.01, value: 1 },
  { key: 'ringWidth', group: 'tiles', label: 'Ring width, mm', type: 'number', min: 0.5, max: 50, step: 0.1, value: 3.5, when: (s) => s.plateStyle === 'ring' },
  { key: 'gap', group: 'tiles', label: 'Gap between tiles, mm', type: 'number', min: 0.2, max: 20, step: 0.05, value: 0.8 },
  { key: 'plateH', group: 'tiles', label: 'Tile thickness, mm', type: 'number', min: 0.4, max: 20, step: 0.1, value: 1.4 },
  { key: 'bevel', group: 'tiles', label: 'Bevel under the tile edges, mm', type: 'number', min: 0, max: 5, step: 0.05, value: 0.6 },
  { key: 'pillar', group: 'tiles', label: 'Centre pillar (shorter bridges)', type: 'bool', value: true, when: (s) => isSolid(s) && isUnder(s) },
  { key: 'pillarD', group: 'tiles', label: 'Pillar diameter, mm', type: 'number', min: 0.8, max: 60, step: 0.1, value: 3, when: (s) => isSolid(s) && isUnder(s) && s.pillar },
  { key: 'pillarFlare', group: 'tiles', label: 'Pillar flare under the tile, mm', type: 'number', min: 0, max: 20, step: 0.1, value: 1, when: (s) => isSolid(s) && isUnder(s) && s.pillar },

  { key: 'relief', group: 'top', label: 'Top relief', type: 'select', options: [['flat', 'Flat'], ['chamfer', 'Chamfered edge'], ['dome', 'Dome / rounded'], ['pyramid', 'Pyramid / ridge'], ['dish', 'Dish (concave)'], ['steps', 'Stepped (ziggurat)']], value: 'chamfer' },
  { key: 'reliefH', group: 'top', label: 'Relief height, mm', type: 'number', min: 0.1, max: 40, step: 0.1, value: 1.5, when: (s) => !['flat', 'chamfer'].includes(s.relief) },
  { key: 'steps', group: 'top', label: 'Steps', type: 'int', min: 2, max: 8, step: 1, value: 3, when: (s) => s.relief === 'steps' },
  { key: 'chamfer', group: 'top', label: 'Chamfer, mm', type: 'number', min: 0.1, max: 10, step: 0.05, value: 0.5, when: (s) => s.relief === 'chamfer' },

  { key: 'linkType', group: 'links', label: 'Joint type', type: 'select', options: LINK_TYPES, value: 'ring' },
  { key: 'direction', group: 'links', label: 'Direction on each edge', type: 'select', options: [['edge', 'One way, all tiles alike'], ['class', 'One way, by tile colour'], ['alternate', 'Alternating (stiff)']], value: 'edge', when: isType('ring', 'hook', 'hinge') },
  { key: 'links', group: 'links', label: 'Joints per edge', type: 'int', min: 1, max: 6, step: 1, value: 1, when: isType('ring', 'free', 'hook', 'flex') },
  { key: 'knuckles', group: 'links', label: 'Knuckles per edge', type: 'int', min: 3, max: 11, step: 2, value: 3, when: isType('hinge') },
  { key: 'spread', group: 'links', label: 'Spread along the edge', type: 'number', min: 0, max: 1, step: 0.01, value: 0.5, when: isType('ring', 'free', 'hook', 'flex') },
  { key: 'slack', group: 'links', label: 'Extra play when pulled, mm', type: 'number', min: 0, max: 5, step: 0.05, value: 1.2, when: isUnder },
  { key: 'linkW', group: 'links', label: 'Ring / hook width, mm', type: 'number', min: 0.6, max: 10, step: 0.05, value: 1.4, when: isUnder },
  { key: 'wire', group: 'links', label: 'Ring wire, mm', type: 'number', min: 0.5, max: 5, step: 0.05, value: 0.9, when: isType('ring', 'free') },
  { key: 'barW', group: 'links', label: 'Bar width, mm', type: 'number', min: 0.5, max: 8, step: 0.05, value: 1.2, when: isUnder },
  { key: 'barH', group: 'links', label: 'Bar thickness, mm', type: 'number', min: 0.3, max: 8, step: 0.05, value: 0.8, when: isUnder },
  { key: 'postW', group: 'links', label: 'Post width, mm', type: 'number', min: 0.6, max: 10, step: 0.05, value: 1.4, when: isUnder },
  { key: 'postInset', group: 'links', label: 'Post inset from tile edge, mm', type: 'number', min: 0, max: 20, step: 0.05, value: 0.2, when: isUnder },
  { key: 'legW', group: 'links', label: 'Hook leg width, mm', type: 'number', min: 0.5, max: 8, step: 0.05, value: 1.2, when: isType('hook') },
  { key: 'beamH', group: 'links', label: 'Hook thickness, mm', type: 'number', min: 0.3, max: 8, step: 0.05, value: 1, when: isType('hook') },
  { key: 'rodD', group: 'links', label: 'Rod diameter, mm', type: 'number', min: 0.6, max: 6, step: 0.05, value: 1.2, when: isType('hinge') },
  { key: 'stripH', group: 'links', label: 'Strip thickness, mm', type: 'number', min: 0.1, max: 3, step: 0.05, value: 0.4, when: isType('flex') },
  { key: 'stripW', group: 'links', label: 'Strip width, mm', type: 'number', min: 0.4, max: 40, step: 0.1, value: 3, when: isType('flex') },
  { key: 'borderBars', group: 'links', label: 'Loops on the outer edges', type: 'bool', value: false, when: isUnder },

  { key: 'layerH', group: 'print', label: 'Layer height, mm', type: 'number', min: 0.04, max: 0.6, step: 0.01, value: 0.2 },
  { key: 'firstLayer', group: 'print', label: 'First layer height, mm', type: 'number', min: 0.04, max: 0.8, step: 0.01, value: 0.2 },
  { key: 'snap', group: 'print', label: 'Snap heights to whole layers', type: 'bool', value: true },
  { key: 'clearXY', group: 'print', label: 'Clearance sideways, mm', type: 'number', min: 0.1, max: 2, step: 0.01, value: 0.4 },
  { key: 'clearZ', group: 'print', label: 'Clearance under bridges, mm', type: 'number', min: 0.1, max: 2, step: 0.01, value: 0.6 },
  { key: 'footChamfer', group: 'print', label: 'First layer chamfer, mm', type: 'number', min: 0, max: 1, step: 0.01, value: 0.2 },
  { key: 'lineW', group: 'print', label: 'Line width (for checks), mm', type: 'number', min: 0.2, max: 1.2, step: 0.01, value: 0.42 },

  { key: 'decor', group: 'decor', label: 'Model', type: 'select', options: [['none', 'None'], ['stl', 'Loaded STL'], ['dome', 'Hemisphere'], ['cone', 'Cone'], ['pyramid', 'Pyramid'], ['stud', 'Cylinder stud'], ['star', 'Star'], ['heart', 'Heart'], ['torus', 'Ring']], value: 'none' },
  { key: 'decorUp', group: 'decor', label: 'STL up axis', type: 'select', options: [['z', 'Z up'], ['y', 'Y up'], ['x', 'X up']], value: 'z', when: (s) => s.decor === 'stl' },
  { key: 'decorSize', group: 'decor', label: 'Size (share of tile)', type: 'number', min: 0.05, max: 2, step: 0.01, value: 0.7, when: hasDecor },
  { key: 'decorHeight', group: 'decor', label: 'Height, mm (0 = proportional)', type: 'number', min: 0, max: 200, step: 0.1, value: 0, when: hasDecor },
  { key: 'decorJitter', group: 'decor', label: 'Size spread', type: 'number', min: 0, max: 0.9, step: 0.01, value: 0, when: hasDecor },
  { key: 'decorRot', group: 'decor', label: 'Rotation, °', type: 'number', min: 0, max: 360, step: 1, value: 0, when: hasDecor },
  { key: 'decorRotMode', group: 'decor', label: 'Turn per tile', type: 'select', options: [['fixed', 'Same for all'], ['tile', 'Follow the tile'], ['alternate', 'Alternate 180°'], ['random', 'Random']], value: 'tile', when: hasDecor },
  { key: 'decorWhere', group: 'decor', label: 'On which tiles', type: 'select', options: [['all', 'All'], ['class0', 'Checkerboard'], ['notclass0', 'Inverse checkerboard'], ['main', 'Largest tiles only'], ['random', 'Random share']], value: 'all', when: hasDecor },
  { key: 'decorShare', group: 'decor', label: 'Share of tiles, %', type: 'number', min: 0, max: 100, step: 1, value: 50, when: (s) => hasDecor(s) && s.decorWhere === 'random' },
  { key: 'decorEmbed', group: 'decor', label: 'Sink into the tile, mm', type: 'number', min: 0, max: 20, step: 0.05, value: 0.2, when: hasDecor },
  { key: 'decorSeed', group: 'decor', label: 'Seed', type: 'int', min: 0, max: 99999, step: 1, value: 1, when: (s) => hasDecor(s) && (s.decorWhere === 'random' || s.decorRotMode === 'random' || s.decorJitter > 0) },

  { key: 'segments', group: 'output', label: 'Segments per circle', type: 'int', min: 8, max: 128, step: 1, value: 32 },
  { key: 'exportWhat', group: 'output', label: 'Export', type: 'select', options: [['all', 'Fabric + models'], ['fabric', 'Fabric only'], ['decor', 'Models only (for a 2nd colour)']], value: 'all' },
];

const DEFAULTS = Object.fromEntries(PARAMS.map((p) => [p.key, p.value]));

// Starting points; unlisted keys keep defaults.
const PRESETS = [
  { name: 'Space fabric: rings around bars', params: {} },
  {
    name: 'Chain: free links, hexagons',
    params: { tiling: 'hex', edge: 15, linkType: 'free', outline: 'rounded', cornerRadius: 1.5, relief: 'dome', reliefH: 1.2, width: 220, height: 200 },
  },
  {
    name: 'Hinged plates (squares, no bridges)',
    params: { tiling: 'square', edge: 16, linkType: 'hinge', plateH: 3.6, gap: 0.8, bevel: 0.3, relief: 'chamfer', chamfer: 0.8, knuckles: 3 },
  },
  {
    name: 'Hinged triangles',
    params: { tiling: 'triangle', edge: 26, linkType: 'hinge', plateH: 3.6, bevel: 0.3, relief: 'pyramid', reliefH: 1.2, knuckles: 3, width: 170, height: 150 },
  },
  {
    name: 'Chainmail rings',
    params: { tiling: 'hex', edge: 15, linkType: 'free', plateStyle: 'ring', outline: 'circle', ringWidth: 4, relief: 'dome', reliefH: 1.4, plateH: 1.2, width: 220, height: 200 },
  },
  {
    name: 'Octagons and squares',
    params: { tiling: 'octagon', edge: 17, relief: 'steps', reliefH: 1.4, steps: 3, shape: 'ellipse', width: 180, height: 180 },
  },
  {
    name: 'Kagome stars',
    params: { tiling: 'kagome', edge: 22, outline: 'rounded', cornerRadius: 2, relief: 'chamfer', chamfer: 0.7, decor: 'star', decorWhere: 'main', decorSize: 0.75, decorHeight: 1.6, width: 180, height: 160 },
  },
  {
    name: 'Compact hooks (thinner)',
    params: { tiling: 'square', edge: 14, linkType: 'hook', barH: 1, slack: 0.6, linkW: 1.3, postW: 1.2, clearZ: 0.4 },
  },
  {
    name: 'Flexible sheet (TPU / PETG)',
    params: { tiling: 'hex', edge: 12, linkType: 'flex', gap: 1.6, plateH: 1.6, bevel: 0, relief: 'chamfer', chamfer: 0.6, links: 1, stripW: 3, stripH: 0.4, width: 160, height: 160 },
  },
  {
    name: 'Round buttons',
    params: { tiling: 'square', edge: 16, outline: 'circle', relief: 'dome', reliefH: 2, linkType: 'free' },
  },
  {
    name: 'Flower tiles',
    params: { tiling: 'hex', edge: 16, outline: 'flower', points: 6, pointDepth: 0.2, relief: 'chamfer', chamfer: 0.6, decor: 'dome', decorSize: 0.35, decorHeight: 1.2, width: 220, height: 200 },
  },
];

// ===== tilings =====

// A tiling is a lattice (a1, a2) and a few CCW polygons in the unit cell.
// cls: colour class (no two neighbours of the same polygon kind share it), kind 0 = the largest polygon.
function tilingCell(p) {
  const s = p.edge;
  const r3 = Math.sqrt(3);
  const regular = (n, R, a0, cx = 0, cy = 0) =>
    Array.from({ length: n }, (_, k) => [cx + R * Math.cos(a0 + (k * TAU) / n), cy + R * Math.sin(a0 + (k * TAU) / n)]);
  const mod = (a, n) => ((a % n) + n) % n;
  switch (p.tiling) {
    case 'hex':
      return { a1: [1.5 * s, (r3 / 2) * s], a2: [0, r3 * s], polys: [{ pts: regular(6, s, 0), kind: 0, cls: (i, j) => mod(i + 2 * j, 3) }] };
    case 'triangle': {
      const h = (r3 / 2) * s;
      return {
        a1: [s, 0], a2: [s / 2, h],
        polys: [
          { pts: [[0, 0], [s, 0], [s / 2, h]], kind: 0, cls: () => 0 },
          { pts: [[s, 0], [1.5 * s, h], [s / 2, h]], kind: 0, cls: () => 1 },
        ],
      };
    }
    case 'octagon': {
      const w = s * (1 + Math.SQRT2);
      const R = s / (2 * Math.sin(Math.PI / 8));
      const hd = s / Math.SQRT2;
      return {
        a1: [w, 0], a2: [0, w],
        polys: [
          { pts: regular(8, R, Math.PI / 8), kind: 0, cls: (i, j) => (i + j) & 1 },
          { pts: [[w / 2 + hd, w / 2], [w / 2, w / 2 + hd], [w / 2 - hd, w / 2], [w / 2, w / 2 - hd]], kind: 1, cls: () => 2 },
        ],
      };
    }
    case 'kagome':
      return {
        a1: [2 * s, 0], a2: [s, r3 * s],
        polys: [
          { pts: regular(6, s, 0), kind: 0, cls: () => 0 },
          { pts: [[s, 0], [1.5 * s, (r3 / 2) * s], [s / 2, (r3 / 2) * s]], kind: 1, cls: () => 1 },
          { pts: [[-s / 2, (r3 / 2) * s], [s / 2, (r3 / 2) * s], [0, r3 * s]], kind: 1, cls: () => 2 },
        ],
      };
    case 'rhombus': {
      const a = (p.shear * Math.PI) / 180;
      const v = [s * Math.cos(a), s * Math.sin(a)];
      return {
        a1: [s, 0], a2: v,
        polys: [{ pts: [[0, 0], [s, 0], [s + v[0], v[1]], [v[0], v[1]]], kind: 0, cls: (i, j) => (i + j) & 1 }],
      };
    }
    default:
      return { a1: [s, 0], a2: [0, s], polys: [{ pts: [[-s / 2, -s / 2], [s / 2, -s / 2], [s / 2, s / 2], [-s / 2, s / 2]], kind: 0, cls: (i, j) => (i + j) & 1 }] };
  }
}

function insideOutline(p, x, y) {
  const W = p.width / 2 + 1e-6;
  const H = (p.shape === 'hexagon' ? p.width : p.height) / 2 + 1e-6;
  switch (p.shape) {
    case 'ellipse': return (x / W) ** 2 + (y / H) ** 2 <= 1 + 1e-9;
    case 'diamond': return Math.abs(x) / W + Math.abs(y) / H <= 1 + 1e-9;
    case 'hexagon': {
      // flat-top hexagon, width = across corners
      const r = W;
      return Math.abs(y) <= (Math.sqrt(3) / 2) * r && Math.sqrt(3) * Math.abs(x) + Math.abs(y) <= Math.sqrt(3) * r;
    }
    default: return Math.abs(x) <= W && Math.abs(y) <= H;
  }
}

function centroid(pts) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < pts.length; i++) {
    const [x0, y0] = pts[i];
    const [x1, y1] = pts[(i + 1) % pts.length];
    const c = x0 * y1 - x1 * y0;
    a += c; cx += (x0 + x1) * c; cy += (y0 + y1) * c;
  }
  return [cx / (3 * a), cy / (3 * a)];
}

// Distance from c to the nearest edge line of a convex CCW polygon.
function inradius(pts, c) {
  let r = Infinity;
  for (let i = 0; i < pts.length; i++) {
    const [x0, y0] = pts[i];
    const [x1, y1] = pts[(i + 1) % pts.length];
    const L = Math.hypot(x1 - x0, y1 - y0);
    if (L < 1e-9) continue;
    const nx = (y1 - y0) / L, ny = -(x1 - x0) / L;
    r = Math.min(r, nx * (x0 - c[0]) + ny * (y0 - c[1]));
  }
  return r;
}

function buildTiles(p) {
  const cell = tilingCell(p);
  const rot = (p.rotation * Math.PI) / 180;
  const cr = Math.cos(rot), sr = Math.sin(rot);
  const H = p.shape === 'hexagon' ? p.width : p.height;
  const R = 0.5 * Math.hypot(p.width, H) + 4 * p.edge;
  const [a1x, a1y] = cell.a1, [a2x, a2y] = cell.a2;
  const area = Math.abs(a1x * a2y - a1y * a2x);
  const n1 = Math.ceil(R / (area / Math.hypot(a2x, a2y))) + 2;
  const n2 = Math.ceil(R / (area / Math.hypot(a1x, a1y))) + 2;
  // Centre a cell of the first polygon at the origin.
  const c0 = centroid(cell.polys[0].pts);

  const tiles = [];
  for (let i = -n1; i <= n1; i++) {
    for (let j = -n2; j <= n2; j++) {
      const ox = i * a1x + j * a2x - c0[0], oy = i * a1y + j * a2y - c0[1];
      if (ox * ox + oy * oy > (R + 3 * p.edge) ** 2) continue;
      for (const poly of cell.polys) {
        const pts = poly.pts.map(([x, y]) => {
          const X = x + ox, Y = y + oy;
          return [X * cr - Y * sr, X * sr + Y * cr];
        });
        if (!pts.every(([x, y]) => insideOutline(p, x, y))) continue;
        tiles.push({ pts, kind: poly.kind, cls: poly.cls(i, j) });
      }
    }
  }

  // Shared edges: key by midpoint.
  const key = (x, y) => `${Math.round(x * 100)},${Math.round(y * 100)}`;
  const edgeMap = new Map();
  tiles.forEach((t, ti) => {
    const n = t.pts.length;
    t.c = centroid(t.pts);
    t.inr = inradius(t.pts, t.c);
    t.nb = new Array(n).fill(-1);
    t.nbEdge = new Array(n).fill(-1);
    t.ang = t.pts.map((v, k) => {
      const a = t.pts[(k + n - 1) % n], b = t.pts[(k + 1) % n];
      const ux = a[0] - v[0], uy = a[1] - v[1], wx = b[0] - v[0], wy = b[1] - v[1];
      return Math.acos(clamp((ux * wx + uy * wy) / (Math.hypot(ux, uy) * Math.hypot(wx, wy)), -1, 1));
    });
    for (let k = 0; k < n; k++) {
      const [x0, y0] = t.pts[k], [x1, y1] = t.pts[(k + 1) % n];
      const kk = key((x0 + x1) / 2, (y0 + y1) / 2);
      const other = edgeMap.get(kk);
      if (other) {
        t.nb[k] = other[0]; t.nbEdge[k] = other[1];
        tiles[other[0]].nb[other[1]] = ti; tiles[other[0]].nbEdge[other[1]] = k;
      } else edgeMap.set(kk, [ti, k]);
    }
  });

  // Drop loose tiles (no neighbours), they would fall out of the fabric.
  const keep = tiles.filter((t) => t.nb.some((x) => x >= 0) || tiles.length === 1);
  if (keep.length !== tiles.length) {
    const remap = new Map();
    tiles.forEach((t, i) => { if (keep.includes(t)) remap.set(i, remap.size); });
    for (const t of keep) {
      t.nb = t.nb.map((x) => (x >= 0 && remap.has(x) ? remap.get(x) : -1));
      t.nbEdge = t.nbEdge.map((e, k) => (t.nb[k] >= 0 ? e : -1));
    }
  }
  return keep;
}

// ===== outlines =====

// Inset a convex CCW polygon by d, a number or one value per edge (intersection of the shifted edge lines).
function insetPoly(pts, d) {
  const n = pts.length;
  const lines = pts.map((a, i) => {
    const b = pts[(i + 1) % n];
    const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const nx = (b[1] - a[1]) / L, ny = -(b[0] - a[0]) / L;
    return [nx, ny, nx * a[0] + ny * a[1] - (Array.isArray(d) ? d[i] : d)];
  });
  return pts.map((_, i) => {
    const [ax, ay, ac] = lines[(i + n - 1) % n];
    const [bx, by, bc] = lines[i];
    const det = ax * by - ay * bx;
    return [(ac * by - ay * bc) / det, (ax * bc - ac * bx) / det];
  });
}

function scalePts(pts, c, k) {
  return pts.map(([x, y]) => [c[0] + (x - c[0]) * k, c[1] + (y - c[1]) * k]);
}

function pointInPoly(pts, x, y) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

// Min distance from the centre to the outline (for star-shaped outlines, sampled on edges).
function outlineInradius(pts, c) {
  let r = Infinity;
  for (let i = 0; i < pts.length; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[(i + 1) % pts.length];
    const dx = x1 - x0, dy = y1 - y0;
    const L2 = dx * dx + dy * dy || 1e-12;
    const t = clamp(((c[0] - x0) * dx + (c[1] - y0) * dy) / L2, 0, 1);
    r = Math.min(r, Math.hypot(x0 + t * dx - c[0], y0 + t * dy - c[1]));
  }
  return r;
}

// Tile outline inside its cell; inset: distance of each cell edge to the tile edge.
function plateOutline(tile, p, inset = p.gap / 2) {
  const c = tile.c;
  const base = insetPoly(tile.pts, inset);
  const rin = inradius(base, c);
  const seg = p.segments;
  // Angle of the first edge normal: keeps circles and stars aligned with the tile.
  const [x0, y0] = base[0], [x1, y1] = base[1];
  const a0 = Math.atan2(-(x1 - x0), y1 - y0);
  let out;
  switch (p.outline) {
    case 'rounded': {
      const r = Math.min(p.cornerRadius, rin * 0.98);
      if (r < 0.01) { out = base; break; }
      const inner = insetPoly(base, r);
      const n = inner.length;
      out = [];
      for (let i = 0; i < n; i++) {
        const prev = base[(i + n - 1) % n], cur = base[i], next = base[(i + 1) % n];
        let s0 = Math.atan2(-(cur[0] - prev[0]), cur[1] - prev[1]);
        let s1 = Math.atan2(-(next[0] - cur[0]), next[1] - cur[1]);
        while (s1 < s0) s1 += TAU;
        const m = Math.max(2, Math.ceil((seg * (s1 - s0)) / TAU));
        for (let k = 0; k <= m; k++) {
          const a = s0 + ((s1 - s0) * k) / m;
          out.push([inner[i][0] + r * Math.cos(a), inner[i][1] + r * Math.sin(a)]);
        }
      }
      break;
    }
    case 'circle':
      out = Array.from({ length: seg }, (_, k) => {
        const a = a0 + (k * TAU) / seg;
        return [c[0] + rin * Math.cos(a), c[1] + rin * Math.sin(a)];
      });
      break;
    case 'star': {
      const n = p.points;
      out = [];
      for (let k = 0; k < 2 * n; k++) {
        const a = a0 + (k * Math.PI) / n;
        const r = k % 2 ? rin * (1 - p.pointDepth) : rin;
        out.push([c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)]);
      }
      break;
    }
    case 'flower': {
      const n = p.points;
      const m = Math.max(n * 6, seg * 2);
      out = Array.from({ length: m }, (_, k) => {
        const a = a0 + (k * TAU) / m;
        const r = rin * (1 - p.pointDepth * (1 - Math.abs(Math.cos((n * (a - a0)) / 2))));
        return [c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)];
      });
      break;
    }
    default:
      out = base;
  }
  return p.plateScale < 1 ? scalePts(out, c, p.plateScale) : out;
}

// ===== links =====

// Heights on whole layers: level(z) is the nearest layer top, up(z, t) is the level about t above z, at least one layer up.
function layerGrid(p) {
  const l = p.layerH, l0 = p.firstLayer, on = p.snap;
  const r6 = (x) => Math.round(x * 1e6) / 1e6;
  const level = (z) => {
    if (!on) return r6(z);
    if (z <= 1e-9) return 0;
    if (z < l0) return z < l0 / 2 ? 0 : l0;
    return r6(l0 + Math.round((z - l0) / l) * l);
  };
  const up = (z, t) => (on ? Math.max(level(z + t), level(z < l0 - 1e-9 ? l0 : z + l)) : r6(z + t));
  return { level, up };
}

const rectDZ = (d0, d1, z0, z1) => [[d0, z0], [d1, z0], [d1, z1], [d0, z1]];
const mirrorDZ = (P) => P.map(([d, z]) => [-d, z]).reverse();

// Rectangle with 45° chamfered corners (an octagonal bar section).
function chamRect(d0, d1, z0, z1, k) {
  k = Math.min(k, (d1 - d0) / 2 - 1e-4, (z1 - z0) / 2 - 1e-4);
  if (k <= 1e-4) return rectDZ(d0, d1, z0, z1);
  return [[d0 + k, z0], [d1 - k, z0], [d1, z0 + k], [d1, z1 - k], [d1 - k, z1], [d0 + k, z1], [d0, z1 - k], [d0, z0 + k]];
}

// Regular octagon with flats facing the axes: inradius r, centre (cx, cz), CCW from the bottom flat.
function octagon(cx, cz, r) {
  const R = r / Math.cos(Math.PI / 8);
  return Array.from({ length: 8 }, (_, k) => {
    const a = -Math.PI / 2 - Math.PI / 8 + (k * Math.PI) / 4;
    return [cx + R * Math.cos(a), cz + R * Math.sin(a)];
  });
}

// Keep the part of a convex polygon where a*x + b*y <= c.
function clipHalf(P, a, b, c) {
  const out = [];
  const push = (q) => { const l = out[out.length - 1]; if (!l || Math.hypot(l[0] - q[0], l[1] - q[1]) > 1e-9) out.push(q); };
  for (let i = 0; i < P.length; i++) {
    const A = P[i], B = P[(i + 1) % P.length];
    const fa = a * A[0] + b * A[1] - c, fb = a * B[0] + b * B[1] - c;
    if (fa <= 1e-12) push(A);
    if ((fa < -1e-12 && fb > 1e-12) || (fa > 1e-12 && fb < -1e-12)) {
      const t = fa / (fa - fb);
      push([A[0] + t * (B[0] - A[0]), A[1] + t * (B[1] - A[1])]);
    }
  }
  if (out.length > 1 && Math.hypot(out[0][0] - out[out.length - 1][0], out[0][1] - out[out.length - 1][1]) < 1e-9) out.pop();
  return out;
}

// A closed loop (convex outline minus a rectangular window) as four convex pieces.
function loopPieces(outer, dw0, dw1, zw0, zw1) {
  const mid = clipHalf(clipHalf(outer, 0, -1, -zw0), 0, 1, zw1);
  return [
    clipHalf(outer, 0, 1, zw0),
    clipHalf(outer, 0, -1, -zw1),
    clipHalf(mid, 1, 0, dw0),
    clipHalf(mid, -1, 0, -dw1),
  ].filter((q) => q.length >= 3);
}

function polyArea(P) {
  let a = 0;
  for (let i = 0; i < P.length; i++) { const [x0, y0] = P[i], [x1, y1] = P[(i + 1) % P.length]; a += x0 * y1 - x1 * y0; }
  return a / 2;
}

// A joint part in the frame of an edge: u along the edge, d across it (d < 0 under tile F, d > 0 under tile M), z up.
// kind 'box': prism of the rectangle sec along u (prints like a post, bottom chamfered on the bed);
// 'prism': convex section sec along u; 'tube': section sec with the hole q.hole.
// owner: 'F' / 'M' (the two tiles), 'L' (a free link), 'J' (a strip that joins both tiles).
const part = (owner, kind, u0, u1, sec, extra = {}) => ({ owner, kind, u0, u1, sec, ...extra });

// Geometry of the chosen joint: layer stack, the parts of one joint (a slot), checks.
function linkSpec(p) {
  const { up } = layerGrid(p);
  const c = p.clearXY, g2 = p.gap / 2, cz = p.clearZ;
  const S = { type: p.linkType, under: isUnder(p), c, g2, notes: [], thin: [], bridges: [], levels: [] };
  const ov = Math.min(0.2, p.plateH / 2);
  // A post that is e inside the tile edge reaches into the bevel under that edge.
  const postTop = (zp, e) => zp + Math.max(ov, Math.min(p.bevel, p.plateH * 0.6) - e);
  const pw = p.postW, bw = p.barW, wl = p.linkW, w = p.wire;
  const pb = Math.max(pw, bw);
  const Db = g2 + p.postInset + pb / 2; // bar and its posts, under their own tile
  const hb = wl / 2 + c + pw / 2; // posts of a bar either side of the ring / hook passing between them
  const staple = (who, sgn, zb0, zb1, top, raised) => {
    const bars = raised
      ? [part(who, 'prism', -hb, hb, chamRect(-Db - bw / 2, -Db + bw / 2, zb0, zb1, 0.3 * Math.min(bw, zb1 - zb0)))]
      : [part(who, 'box', -hb, hb, rectDZ(-Db - bw / 2, -Db + bw / 2, 0, zb1))];
    const posts = [-1, 1].map((k) => part(who, 'box', k * hb - pw / 2, k * hb + pw / 2, rectDZ(-Db - pb / 2, -Db + pb / 2, 0, top), { post: true }));
    const all = [...bars, ...posts];
    if (sgn > 0) for (const q of all) q.sec = mirrorDZ(q.sec);
    return all;
  };
  S.plateH = p.plateH;

  switch (p.linkType) {
    case 'hook': {
      const lw = p.legW;
      const Dp = g2 + p.postInset + pw / 2;
      const Df = Db + bw / 2 + c + p.slack + lw / 2;
      const zb1 = up(0, p.barH), zk0 = up(zb1, cz), zk1 = up(zk0, p.beamH), zp = up(zk1, cz);
      const kc = 0.6 * Math.min(lw, zk1 - zk0);
      const dFar = -(Df + lw / 2);
      const top = postTop(zp, p.postInset);
      S.zp = zp;
      S.levels = [['bar', zb1], ['hook', zk1], ['tile underside', zp]];
      S.pivot = [-Db, zb1 / 2];
      S.slot = [
        ...staple('F', -1, 0, zb1, top, false),
        part('M', 'box', -wl / 2, wl / 2, rectDZ(Dp - pw / 2, Dp + pw / 2, 0, top), { post: true }),
        part('M', 'prism', -wl / 2, wl / 2, [[dFar, zk0], [Dp + pw / 2, zk0], [Dp + pw / 2, zk1], [dFar + kc, zk1], [dFar, zk1 - kc]]),
        part('M', 'box', -wl / 2, wl / 2, rectDZ(dFar, dFar + lw, 0, zk1 - kc)),
      ];
      S.border = staple('F', -1, 0, zb1, top, false);
      S.thin = [['post', pw], ['bar', bw], ['hook', wl], ['hook leg', lw]]; // widths in plan, heights are whole layers
      S.bridges = [['hook over the bar', Dp - pw / 2 + Df - lw / 2], ['tile over the hook', 2 * hb - pw]];
      break;
    }
    case 'ring':
    case 'free': {
      const zw0 = up(0, w), zb0 = up(zw0, cz), zb1 = up(zb0, p.barH), zw1 = up(zb1, cz), zr1 = up(zw1, w), zp = up(zr1, cz);
      const top = postTop(zp, p.postInset);
      S.zp = zp;
      S.levels = [['ring bottom', zw0], ['bars', zb1], ['ring top', zr1], ['tile underside', zp]];
      const kOut = (1 - Math.SQRT1_2) * 2 * w; // corner chamfer that keeps the wire thickness at the corners
      if (p.linkType === 'ring') {
        const dw0 = -Db - bw / 2 - c - p.slack, dw1 = -Db + bw / 2 + c;
        const mp0 = g2 + p.postInset, mp1 = mp0 + pw;
        const d0 = dw0 - w, d1 = Math.max(dw1 + w, mp0 + Math.min(0.3, pw / 2));
        const k = Math.min(kOut, w, (zr1 - zw1) * 1.5);
        const kf = Math.min(kOut, d1 - dw1 - 0.05);
        const outer = [[d0 + k, 0], [d1, 0], [d1, zr1 - kf], [d1 - kf, zr1], [d0 + k, zr1], [d0, zr1 - k], [d0, k]];
        S.pivot = [-Db, (zb0 + zb1) / 2];
        S.slot = [
          ...staple('F', -1, zb0, zb1, top, true),
          part('M', 'box', -wl / 2, wl / 2, rectDZ(mp0, mp1, 0, top), { post: true }),
          ...loopPieces(outer, dw0, dw1, zw0, zw1).map((q) => part('M', 'prism', -wl / 2, wl / 2, q)),
        ];
        S.bridges = [['bar over the ring', 2 * hb - pw], ['ring over the bar', dw1 - dw0], ['tile over the ring', 2 * hb - pw]];
      } else {
        const Lh = Db + bw / 2 + c + p.slack / 2, W = Lh + w;
        const k = Math.min(kOut, w);
        const outer = [[-W + k, 0], [W - k, 0], [W, k], [W, zr1 - k], [W - k, zr1], [-W + k, zr1], [-W, zr1 - k], [-W, k]];
        S.pivot = [0, zr1 / 2];
        S.slot = [
          ...staple('F', -1, zb0, zb1, top, true),
          ...staple('M', 1, zb0, zb1, top, true),
          ...loopPieces(outer, -Lh, Lh, zw0, zw1).map((q) => part('L', 'prism', -wl / 2, wl / 2, q)),
        ];
        S.bridges = [['bars over the link', 2 * hb - pw], ['link over the bars', 2 * Lh], ['tile over the link', 2 * hb - pw]];
      }
      S.border = staple('F', -1, zb0, zb1, top, true);
      S.thin = [['post', pw], ['bar', bw], ['ring wire', Math.min(w, wl)]];
      break;
    }
    case 'hinge': {
      const rr = p.rodD / 2, Rr = rr / Math.cos(Math.PI / 8);
      const rh = Rr + c; // the rod turns freely in the hole
      const eb = Math.max(0, cz - c); // the rod is a bridge: more room below it
      const wall = Math.max(0.6, 1.5 * p.lineW);
      const need = 2 * (rh + eb + wall);
      const t = up(0, Math.max(p.plateH, need));
      if (t > p.plateH + 1e-6) S.notes.push(['Tile thickness', `${t.toFixed(2)} mm for the hinge`]);
      S.zp = 0;
      S.plateH = t;
      S.rho = t / 2; S.zh = t / 2; S.rr = rr; S.rh = rh; S.eb = eb;
      S.inset = S.rho + c; // tile edge away from the hinge axis
      S.pivot = [0, S.zh];
      S.levels = [['hinge axis', S.zh], ['tile top', t]];
      S.thin = [['rod', p.rodD], ['knuckle wall', S.rho - rh - eb]];
      S.ov = ov;
      break;
    }
    case 'flex': {
      const st = up(0, p.stripH);
      const t = up(0, Math.max(p.plateH, st + 2 * p.layerH));
      S.zp = 0;
      S.plateH = t;
      S.inset = g2;
      S.st = st;
      const anchor = Math.max(1.2, Math.min(p.bevel, t * 0.6) + 0.8);
      S.slot = [part('J', 'box', -p.stripW / 2, p.stripW / 2, rectDZ(-(g2 + anchor), g2 + anchor, 0, st))];
      S.pivot = [0, st / 2];
      S.levels = [['strip', st], ['tile top', t]];
      S.thin = [['strip', p.stripW]];
      break;
    }
  }
  return S;
}

// Hinge parts between u = ua and ub: K knuckles (rod owner M at both ends) and the rod through them.
function hingeParts(S, ua, ub, K) {
  const c = S.c, L = (ub - ua - (K - 1) * c) / K;
  const knuck = octagon(0, S.zh, S.rho);
  const hole = octagon(0, S.zh, S.rh).map(([d, z]) => [d, z < S.zh - 1e-9 ? z - S.eb : z]);
  const out = [];
  for (let i = 0; i < K; i++) {
    const u0 = ua + i * (L + c), u1 = u0 + L;
    if (i % 2 === 0) {
      out.push(part('M', 'prism', u0, u1, knuck));
      out.push(part('M', 'box', u0, u1, rectDZ(S.rho - 0.25, S.inset + S.ov, 0, S.plateH)));
    } else {
      out.push(part('F', 'tube', u0, u1, knuck, { hole }));
      out.push(part('F', 'box', u0, u1, rectDZ(-(S.inset + S.ov), -(S.rho - 0.25), 0, S.plateH)));
    }
  }
  out.push(part('M', 'prism', ua, ub, octagon(0, S.zh, S.rr), { rod: true }));
  return { parts: out, len: L };
}

// The same slot seen with the roles swapped (for alternating joints).
const swapSlot = (parts) => parts.map((q) => ({ ...q, owner: q.owner === 'F' ? 'M' : q.owner === 'M' ? 'F' : q.owner, sec: mirrorDZ(q.sec), u0: -q.u1, u1: -q.u0, hole: q.hole && mirrorDZ(q.hole) }));

// Plan rectangles of a slot seen from one tile: along the edge [a, b], depth into that tile [d0, d1], own part or not.
function slotPlan(parts, side) {
  return parts.map((q) => {
    let d0 = Infinity, d1 = -Infinity;
    for (const [d] of q.sec) { d0 = Math.min(d0, d); d1 = Math.max(d1, d); }
    if (side === 'F') [d0, d1] = [-d1, -d0];
    return { a: q.u0, b: q.u1, d0, d1, own: q.owner === side || q.owner === 'J' };
  });
}

// Convex polygons closer than c?
function tooClose(P, Q, c) {
  for (const S of [P, Q]) {
    for (let i = 0; i < S.length; i++) {
      const [x0, y0] = S[i], [x1, y1] = S[(i + 1) % S.length];
      let ax = -(y1 - y0), ay = x1 - x0;
      const L = Math.hypot(ax, ay);
      if (L < 1e-12) continue;
      ax /= L; ay /= L;
      let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;
      for (const [x, y] of P) { const v = x * ax + y * ay; if (v < a0) a0 = v; if (v > a1) a1 = v; }
      for (const [x, y] of Q) { const v = x * ax + y * ay; if (v < b0) b0 = v; if (v > b1) b1 = v; }
      if (b0 - a1 >= c - 1e-9 || a0 - b1 >= c - 1e-9) return false;
    }
  }
  return true;
}

// Smallest distance of the nearest joint centre from a tile corner (interior angle ang) so that the joints of
// the two edges meeting there keep the clearance; roles 'F' / 'M' / 'A' (alternating) / '-' (no joint).
function cornerReach(S, ang, roleA, roleB, plans) {
  const list = (r) => (r === '-' ? [] : r === 'A' ? [...plans.F, ...plans.M] : plans[r]);
  const A = list(roleA), B = list(roleB);
  if (!A.length && !B.length) return 0;
  const hw = Math.max(0, ...A.map((r) => Math.max(-r.a, r.b)), ...B.map((r) => Math.max(-r.a, r.b)));
  if (!A.length || !B.length) return hw;
  const t2 = [Math.cos(ang), Math.sin(ang)], n2 = [Math.sin(ang), -Math.cos(ang)];
  const quad = (r, x, t, n) => [[r.a, r.d0], [r.b, r.d0], [r.b, r.d1], [r.a, r.d1]].map(([s, d]) => [(x + s) * t[0] + d * n[0], (x + s) * t[1] + d * n[1]]);
  const clash = (x) => {
    for (const r of A) {
      const P = quad(r, x, [1, 0], [0, 1]);
      for (const q of B) if (!(r.own && q.own) && tooClose(P, quad(q, x, t2, n2), S.c)) return true;
    }
    return false;
  };
  let x = hw;
  while (x < 200 && clash(x)) x += 0.05;
  return x;
}

// Smallest distance between centres of neighbouring joints on one edge.
function slotPitch(S, a, b) {
  let need = 0;
  for (const q of a) {
    const [qd0, qd1] = q.sec.reduce(([m, M], [d]) => [Math.min(m, d), Math.max(M, d)], [Infinity, -Infinity]);
    for (const r of b) {
      if (q.owner === r.owner && q.owner !== 'L') continue;
      const [rd0, rd1] = r.sec.reduce(([m, M], [d]) => [Math.min(m, d), Math.max(M, d)], [Infinity, -Infinity]);
      if (qd1 + S.c <= rd0 || rd1 + S.c <= qd0) continue;
      need = Math.max(need, q.u1 - r.u0 + S.c);
    }
  }
  return need;
}

// Roles of each tile on each edge: 'F' (holds bars), 'M' (holds rings / hooks / the hinge rod),
// 'A' (alternating), 'B' (outer edge with bars only), '-' (nothing).
function assignRoles(tiles, p, S) {
  for (const t of tiles) t.role = t.pts.map(() => '-');
  tiles.forEach((t, ti) => {
    const n = t.pts.length;
    for (let e = 0; e < n; e++) {
      const nb = t.nb[e];
      if (nb < 0) { t.role[e] = S.under && p.borderBars ? 'B' : '-'; continue; }
      if (nb < ti) continue;
      const o = tiles[nb], oe = t.nbEdge[e];
      let mine;
      if (p.linkType === 'free' || p.linkType === 'flex') mine = 'F';
      else if (p.direction === 'alternate' && p.linkType !== 'hinge') mine = 'A';
      else {
        const [x0, y0] = t.pts[e], [x1, y1] = t.pts[(e + 1) % n];
        const nx = y1 - y0, ny = -(x1 - x0);
        let male = nx > 1e-7 * Math.hypot(nx, ny) || (Math.abs(nx) <= 1e-7 * Math.hypot(nx, ny) && ny > 0);
        if (p.direction === 'class' && t.cls !== o.cls) male = t.cls < o.cls;
        mine = male ? 'M' : 'F';
      }
      t.role[e] = mine;
      o.role[oe] = mine === 'A' ? 'A' : mine === 'M' ? 'F' : p.linkType === 'free' || p.linkType === 'flex' ? 'F' : 'M';
    }
  });
}

// ----- bending: 2D section across an edge, tile M turns about the edge -----

function convexHull(P) {
  P = P.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], hi = [];
  for (const q of P) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 1e-12) lo.pop(); lo.push(q); }
  for (let i = P.length - 1; i >= 0; i--) { const q = P[i]; while (hi.length >= 2 && cr(hi[hi.length - 2], hi[hi.length - 1], q) <= 1e-12) hi.pop(); hi.push(q); }
  return lo.slice(0, -1).concat(hi.slice(0, -1));
}

// Translations of B that overlap A: the Minkowski difference A - B, kept as half-planes.
function minkObstacle(A, B) {
  const pts = [];
  for (const a of A) for (const b of B) pts.push([a[0] - b[0], a[1] - b[1]]);
  const H = convexHull(pts);
  const lines = H.map((q, i) => {
    const r = H[(i + 1) % H.length];
    let nx = r[1] - q[1], ny = -(r[0] - q[0]);
    const L = Math.hypot(nx, ny) || 1;
    nx /= L; ny /= L;
    return [nx, ny, nx * q[0] + ny * q[1]];
  });
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of H) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  return { lines, bb: [x0, y0, x1, y1] };
}

const rotDZ = (P, th, piv) => {
  const c = Math.cos(th), s = Math.sin(th);
  return P.map(([x, y]) => { const X = x - piv[0], Y = y - piv[1]; return [piv[0] + c * X - s * Y, piv[1] + s * X + c * Y]; });
};

function blockedAt(obs, x, y) {
  for (const o of obs) {
    if (x <= o.bb[0] || x >= o.bb[2] || y <= o.bb[1] || y >= o.bb[3]) continue;
    let inside = true;
    for (const [nx, ny, c] of o.lines) if (nx * x + ny * y >= c - 1e-9) { inside = false; break; }
    if (inside) return true;
  }
  return false;
}

// Follows the free region of translations from the rest position while the angle grows; returns the last angle.
// okAt(th) builds a test (x, y) => free?. Stops when nothing is left or the region leaves the window (the joint came apart).
function trackTurn(okAt, dir, { step = 0.03, dth = 1, maxDeg = 180, win = 5 } = {}) {
  const key = (i, j) => i * 100003 + j;
  let ok = okAt(0);
  let comp = [];
  let escaped = false;
  const grow = (test, seeds) => {
    const seen = new Set(), out = [], st = [];
    for (const [i, j] of seeds) { const k = key(i, j); if (!seen.has(k)) { seen.add(k); if (test(i * step, j * step)) { st.push([i, j]); out.push([i, j]); } } }
    const lim = Math.round(win / step);
    while (st.length) {
      const [i, j] = st.pop();
      for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const I = i + a, J = j + b;
        if (Math.abs(I) > lim || Math.abs(J) > lim) { escaped = true; continue; }
        const k = key(I, J);
        if (seen.has(k)) continue;
        seen.add(k);
        if (test(I * step, J * step)) { st.push([I, J]); out.push([I, J]); }
      }
      if (out.length > 60000) { escaped = true; break; }
    }
    return out;
  };
  comp = grow(ok, [[0, 0]]);
  if (!comp.length) return { deg: 0, escaped: false, comp };
  if (escaped) return { deg: 0, escaped: true, comp };
  let deg = 0;
  while (deg < maxDeg) {
    const next = grow(okAt((dir * (deg + dth) * Math.PI) / 180), comp);
    if (!next.length) break;
    deg += dth;
    comp = next;
    if (escaped) break;
  }
  return { deg, escaped, comp };
}

function bandsOf(parts, tileF, tileM) {
  const cuts = [...new Set(parts.flatMap((q) => [q.u0, q.u1]))].sort((a, b) => a - b);
  const secs = (q) => (q.kind === 'tube' ? q.sec.map((v, i) => [v, q.sec[(i + 1) % q.sec.length], q.hole[(i + 1) % q.hole.length], q.hole[i]]) : [q.sec]);
  const T = (t) => (t ? [t] : []);
  const bands = [{ A: T(tileF), B: T(tileM) }];
  const seen = new Set();
  for (let i = 0; i + 1 < cuts.length; i++) {
    const um = (cuts[i] + cuts[i + 1]) / 2;
    const inside = parts.filter((q) => q.u0 < um && um < q.u1);
    const key = inside.map((q) => parts.indexOf(q)).join();
    if (!inside.length || seen.has(key)) continue;
    seen.add(key);
    bands.push({
      A: [...T(tileF), ...inside.filter((q) => q.owner === 'F').flatMap(secs)],
      B: [...T(tileM), ...inside.filter((q) => q.owner === 'M').flatMap(secs)],
    });
  }
  return bands;
}

// Section of tile F across its edge (d < 0), from its plate profile; R is the tile inradius.
function tileSection(p, S, R) {
  const inset = S.inset ?? S.g2;
  const { prof } = plateProfile(p, R, S.zp, S.zp + S.plateH, null);
  return convexHull(prof.map(([s, z]) => [-(inset + (1 - s) * R), z]));
}

const foldCache = new Map();

// Bending limits of one joint: tiles out (convex, "mountain") and tiles in (concave, "valley"), in degrees,
// whether the joint can come apart, and the play when pulled / pushed.
function foldLimits(p, S, R) {
  const keys = ['linkType', 'direction', 'gap', 'plateH', 'bevel', 'relief', 'reliefH', 'steps', 'chamfer', 'slack', 'linkW', 'wire', 'barW', 'barH', 'postW', 'postInset', 'legW', 'beamH', 'rodD', 'stripH', 'stripW', 'layerH', 'firstLayer', 'snap', 'clearXY', 'clearZ', 'edge', 'tiling'];
  const key = keys.map((k) => p[k]).join('|') + '|' + R.toFixed(2);
  if (foldCache.has(key)) return foldCache.get(key);
  const res = computeFold(p, S, R);
  if (foldCache.size > 50) foldCache.clear();
  foldCache.set(key, res);
  return res;
}

function computeFold(p, S, R) {
  const tileF = tileSection(p, S, R), tileM = mirrorDZ(tileF);
  const piv = S.pivot;
  const turn = (bands, dir) => trackTurn((th) => {
    const obs = [];
    for (const b of bands) { const Bs = b.B.map((q) => rotDZ(q, th, piv)); for (const a of b.A) for (const q of Bs) obs.push(minkObstacle(a, q)); }
    return (x, y) => !blockedAt(obs, x, y);
  }, dir);
  const playOf = (bands) => {
    const obs = [];
    for (const b of bands) for (const a of b.A) for (const q of b.B) obs.push(minkObstacle(a, q));
    const go = (ax, az) => { let t = 0; while (t < 6 && !blockedAt(obs, ax * (t + 0.01), az * (t + 0.01))) t += 0.01; return t; };
    return { pull: go(1, 0), push: go(-1, 0) };
  };
  if (S.type === 'flex') {
    // Strips bend in place: turn about the strip until the tiles touch.
    const free = (th) => { const m = rotDZ(tileM, th, piv); return !tooClose(tileF, m, 1e-6); };
    const lim = (dir) => { let d = 0; while (d < 180 && free((dir * (d + 1) * Math.PI) / 180)) d++; return d; };
    return { valley: lim(1), mountain: lim(-1), escV: false, escM: false, play: { pull: 0, push: 0 } };
  }
  if (S.type === 'free') return foldFree(S, tileF, piv);
  let parts;
  if (S.type === 'hinge') parts = hingeParts(S, -4.5, 4.5, 3).parts;
  else if (p.direction === 'alternate') {
    const pitch = slotPitch(S, S.slot, swapSlot(S.slot)) + 0.5;
    parts = [...S.slot.map((q) => ({ ...q, u0: q.u0 - pitch / 2, u1: q.u1 - pitch / 2 })), ...swapSlot(S.slot).map((q) => ({ ...q, u0: q.u0 + pitch / 2, u1: q.u1 + pitch / 2 }))];
  } else parts = S.slot;
  const bands = bandsOf(parts, tileF, tileM);
  const v = turn(bands, 1), m = turn(bands, -1);
  return { valley: v.deg, mountain: m.deg, escV: v.escaped, escM: m.escaped, play: playOf(bands) };
}

// Free link: symmetric bend, the link turns by half the angle against each tile and tile M is the mirror image
// of tile F about the link's middle plane. Mirroring moves F's image along the plane normal only, so tile against
// tile is a set of forbidden offsets along that normal.
function foldFree(S, tileF, piv) {
  const own = S.slot.filter((q) => q.owner === 'F');
  const link = S.slot.filter((q) => q.owner === 'L').map((q) => ({ ...q, owner: 'M' }));
  const bands = bandsOf([...own, ...link], tileF, null);
  const A = [tileF, ...own.map((q) => q.sec)];
  const forbidden = (ph) => {
    const nx = Math.cos(ph), ny = Math.sin(ph);
    const k = 2 * (piv[0] * nx + piv[1] * ny);
    // mirror about the line through piv with normal n, then shift by t*n
    const img = A.map((P) => P.map(([u, v]) => { const s2 = 2 * (u * nx + v * ny) - k; return [u - s2 * nx, v - s2 * ny]; }));
    const out = [];
    for (const a of A) for (const b of img) {
      const o = minkObstacle(a, b);
      let t0 = -Infinity, t1 = Infinity;
      for (const [lx, ly, c] of o.lines) {
        const dn = lx * nx + ly * ny;
        if (Math.abs(dn) < 1e-12) { if (c <= 1e-9) { t0 = 1; t1 = 0; } continue; }
        if (dn > 0) t1 = Math.min(t1, c / dn); else t0 = Math.max(t0, c / dn);
      }
      if (t1 - t0 > 1e-9) out.push([t0, t1]);
    }
    return { nx, ny, out };
  };
  const half = (dir) => trackTurn((ph) => {
    const obs = [];
    for (const b of bands) { const Ls = b.B.map((q) => rotDZ(q, ph, piv)); for (const a of b.A) for (const q of Ls) obs.push(minkObstacle(a, q)); }
    const F = forbidden(ph);
    return (x, y) => {
      if (blockedAt(obs, x, y)) return false;
      const t = 2 * (x * F.nx + y * F.ny);
      for (const [t0, t1] of F.out) if (t > t0 + 1e-9 && t < t1 - 1e-9) return false;
      return true;
    };
  }, dir, { dth: 0.5, maxDeg: 90, step: 0.04 });
  const v = half(1), m = half(-1);
  const obs = [];
  for (const b of bands) for (const a of b.A) for (const q of b.B) obs.push(minkObstacle(a, q));
  const go = (ax) => { let t = 0; while (t < 6 && !blockedAt(obs, ax * (t + 0.01), 0)) t += 0.01; return t; };
  const F0 = forbidden(0);
  const pushTiles = Math.min(...F0.out.map(([t0, t1]) => (t1 > 0 && t0 < 0 ? 0 : t1 <= 0 ? -t1 : Infinity)), 6);
  return { valley: 2 * v.deg, mountain: 2 * m.deg, escV: v.escaped, escM: m.escaped, play: { pull: 2 * go(1), push: Math.min(2 * go(-1), pushTiles) } };
}

// ===== mesh =====

// Triangle soup of closed solids. Each solid is checked by its signed volume and flipped if inside out.
class Builder {
  constructor() {
    this.pos = [];
    this.col = [];
    this.rgb = [1, 1, 1];
    this.start = 0;
  }
  begin() { this.start = this.pos.length; }
  tri(a, b, c) {
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
    const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    if (nx * nx + ny * ny + nz * nz < 1e-14) return;
    const P = this.pos, C = this.col, [r, g, bl] = this.rgb;
    P.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
    C.push(r, g, bl, r, g, bl, r, g, bl);
  }
  end() {
    const P = this.pos;
    if (this.solids) this.solids.push([this.start, P.length, this.owner]);
    let v = 0;
    for (let k = this.start; k < P.length; k += 9) {
      v += P[k] * (P[k + 4] * P[k + 8] - P[k + 5] * P[k + 7])
        - P[k + 1] * (P[k + 3] * P[k + 8] - P[k + 5] * P[k + 6])
        + P[k + 2] * (P[k + 3] * P[k + 7] - P[k + 4] * P[k + 6]);
    }
    if (v < 0) {
      for (let k = this.start; k < P.length; k += 9) {
        for (let d = 0; d < 3; d++) {
          const t = P[k + 3 + d]; P[k + 3 + d] = P[k + 6 + d]; P[k + 6 + d] = t;
        }
      }
    }
  }
  // Box with axis t (unit) of half length ht, the perpendicular half width hn, from z0 to z1.
  box(cx, cy, tx, ty, ht, hn, z0, z1) {
    const nx = ty, ny = -tx;
    const q = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => [cx + tx * ht * a + nx * hn * b, cy + ty * ht * a + ny * hn * b]);
    if (this.rec) this.rec.push({ t: this.tile, poly: q, z0, z1 });
    const v = [...q.map(([x, y]) => [x, y, z0]), ...q.map(([x, y]) => [x, y, z1])];
    this.begin();
    this.tri(v[0], v[2], v[1]); this.tri(v[0], v[3], v[2]);
    this.tri(v[4], v[5], v[6]); this.tri(v[4], v[6], v[7]);
    for (let i = 0; i < 4; i++) {
      const a = i, b = (i + 1) % 4;
      this.tri(v[a], v[b], v[b + 4]); this.tri(v[a], v[b + 4], v[a + 4]);
    }
    this.end();
  }
  // Loft of a star-shaped outline scaled about c along a closed (scale, z) profile loop.
  loft(outline, c, profile) {
    const rings = profile.map(([s, z]) => outline.map(([x, y]) => [c[0] + (x - c[0]) * s, c[1] + (y - c[1]) * s, z]));
    const n = outline.length, K = profile.length;
    this.begin();
    for (let k = 0; k < K; k++) {
      const A = rings[k], B = rings[(k + 1) % K];
      for (let i = 0; i < n; i++) {
        const i1 = (i + 1) % n;
        this.tri(A[i], A[i1], B[i1]);
        this.tri(A[i], B[i1], B[i]);
      }
    }
    this.end();
  }
  // Closed solid through a chain of rings with the same vertex count; open chains get fan caps at both ends.
  rings(R, closed = false) {
    const n = R[0].length, K = R.length;
    this.begin();
    for (let k = 0; k < (closed ? K : K - 1); k++) {
      const A = R[k], C = R[(k + 1) % K];
      for (let i = 0; i < n; i++) {
        const i1 = (i + 1) % n;
        this.tri(A[i], A[i1], C[i1]);
        this.tri(A[i], C[i1], C[i]);
      }
    }
    if (!closed) {
      const mid = (ring) => [0, 1, 2].map((d) => ring.reduce((a, v) => a + v[d], 0) / n);
      const a = mid(R[0]), b = mid(R[K - 1]);
      for (let i = 0; i < n; i++) {
        const i1 = (i + 1) % n;
        this.tri(a, R[0][i1], R[0][i]);
        this.tri(b, R[K - 1][i], R[K - 1][i1]);
      }
    }
    this.end();
  }
  // A joint part (see part()) in the edge frame fr; foot: chamfer of the edges on the bed.
  partSolid(fr, q, foot = 0) {
    const P = (u, d, z) => [fr.x + fr.tx * u + fr.nx * d, fr.y + fr.ty * u + fr.ny * d, z];
    const ring = (u, sec) => sec.map(([d, z]) => P(u, d, z));
    let zmin = Infinity;
    for (const v of q.sec) zmin = Math.min(zmin, v[1]);
    const len = q.u1 - q.u0;
    if (q.kind === 'box') {
      let d0 = Infinity, d1 = -Infinity, z0 = Infinity, z1 = -Infinity;
      for (const [d, z] of q.sec) { d0 = Math.min(d0, d); d1 = Math.max(d1, d); z0 = Math.min(z0, z); z1 = Math.max(z1, z); }
      const e = z0 <= 1e-9 ? Math.min(foot, len / 3, (d1 - d0) / 3, (z1 - z0) / 2) : 0;
      const quad = (a, z) => [[q.u0 + a, d0 + a], [q.u1 - a, d0 + a], [q.u1 - a, d1 - a], [q.u0 + a, d1 - a]].map(([u, d]) => P(u, d, z));
      const R = e > 0.005 ? [quad(e, 0), quad(0, e), quad(0, z1)] : [quad(0, z0), quad(0, z1)];
      this.rings(R);
      if (this.rec) this.rec.push({ owner: this.owner, pts: R.flat() });
      return;
    }
    const e = zmin <= 1e-9 ? Math.min(foot, len / 3) : 0;
    const lifted = e > 0.005 ? raiseBottom(q.sec, e) : null;
    const outer = lifted ? [ring(q.u0, lifted), ring(q.u0 + e, q.sec), ring(q.u1 - e, q.sec), ring(q.u1, lifted)] : [ring(q.u0, q.sec), ring(q.u1, q.sec)];
    if (q.kind === 'tube') {
      this.rings([...outer, ring(q.u1, q.hole), ring(q.u0, q.hole)], true);
      if (this.rec) {
        const m = q.sec.length;
        for (let i = 0; i < m; i++) {
          const pc = [q.sec[i], q.sec[(i + 1) % m], q.hole[(i + 1) % m], q.hole[i]];
          this.rec.push({ owner: this.owner, pts: [...ring(q.u0, pc), ...ring(q.u1, pc)] });
        }
      }
      return;
    }
    this.rings(outer);
    if (this.rec) this.rec.push({ owner: this.owner, pts: outer.flat(), rod: !!q.rod });
  }
}

// Lift the vertices of a convex section lying below z = e up along their rising edge (a 45° foot chamfer at the part ends).
function raiseBottom(sec, e) {
  const n = sec.length;
  return sec.map((v, i) => {
    if (v[1] >= e - 1e-12) return v;
    for (const j of [(i + n - 1) % n, (i + 1) % n]) {
      const w = sec[j];
      if (w[1] >= e - 1e-12) {
        const t = (e - v[1]) / (w[1] - v[1]);
        return [v[0] + t * (w[0] - v[0]), e];
      }
    }
    return [v[0], e];
  });
}

const hexRGB = (h) => [((h >> 16) & 255) / 255, ((h >> 8) & 255) / 255, (h & 255) / 255];
const CLASS_RGB = [0xe8e4dc, 0xc9d4e2, 0xe2cdb9].map(hexRGB);
const LINK_RGB = hexRGB(0x8b929c);
const FREE_RGB = hexRGB(0xc39a62);
const FRAME_RGB = hexRGB(0xb3b0a8);

// Cross-section loop (scale, z) of a tile. Returns the loop and the z of the top at the centre.
function plateProfile(p, R, z0, z1, ringK) {
  const h = p.reliefH;
  const K = Math.max(4, Math.round(p.segments / 4));
  // Bevel under the outer edge: a 45° overhang that leaves room for the joints when the fabric bends.
  const bv = Math.min(p.bevel, (z1 - z0) * 0.6, R * 0.3);
  const chH = Math.min(p.chamfer, R * 0.45, (z1 - z0 - Math.max(bv, 0)) * 0.9);
  const base = bv > 0.01 ? [[1 - bv / R, z0], [1, z0 + bv]] : [[1, z0]];
  if (ringK == null) {
    const prof = [[0, z0], ...base];
    let zc = z1;
    switch (p.relief) {
      case 'chamfer':
        prof.push([1, z1 - chH], [1 - chH / R, z1], [0, z1]);
        break;
      case 'dome':
        prof.push([1, z1]);
        for (let k = 1; k <= K; k++) {
          const f = (k / K) * (Math.PI / 2);
          prof.push([Math.cos(f), z1 + h * Math.sin(f)]);
        }
        zc = z1 + h;
        break;
      case 'pyramid':
        prof.push([1, z1], [0, z1 + h]);
        zc = z1 + h;
        break;
      case 'dish': {
        const d = Math.min(h, (z1 - z0) - 0.4);
        const sr = 0.88;
        prof.push([1, z1], [sr, z1]);
        if (d > 0.01) {
          for (let k = 1; k <= K; k++) {
            const s = sr * (1 - k / K);
            prof.push([s, z1 - d * (1 - (s / sr) ** 2)]);
          }
          zc = z1 - d;
        } else prof.push([0, z1]);
        break;
      }
      case 'steps': {
        const n = p.steps;
        prof.push([1, z1]);
        for (let k = 1; k <= n; k++) {
          const s = 1 - (k / (n + 0.6));
          prof.push([s + 1 / (n + 0.6), z1 + (h * k) / n], [s, z1 + (h * k) / n]);
        }
        prof.push([0, z1 + h]);
        zc = z1 + h;
        break;
      }
      default:
        prof.push([1, z1], [0, z1]);
    }
    return { prof, zc };
  }
  // Ring: the band between scale 1 and ringK.
  const k = ringK, mid = (1 + k) / 2, half = (1 - k) / 2;
  const prof = bv > 0.01 && bv / R < half * 0.8 ? base : [[1, z0]];
  switch (p.relief) {
    case 'chamfer': {
      const cs = Math.min(chH / R, half * 0.9);
      prof.push([1, z1 - chH], [1 - cs, z1], [k + cs, z1], [k, z1 - chH]);
      break;
    }
    case 'dome':
    case 'dish':
      prof.push([1, z1]);
      for (let i = 1; i < 2 * K; i++) {
        const f = (i / (2 * K)) * Math.PI;
        prof.push([mid + half * Math.cos(f), z1 + (p.relief === 'dish' ? 0 : h) * Math.sin(f)]);
      }
      prof.push([k, z1]);
      break;
    case 'pyramid':
      prof.push([1, z1], [mid, z1 + h], [k, z1]);
      break;
    case 'steps': {
      const n = p.steps;
      prof.push([1, z1]);
      for (let i = 1; i <= n; i++) {
        const w = half * (1 - i / (n + 1));
        const z = z1 + (h * i) / n;
        prof.push([mid + w + half / (n + 1), z], [mid + w, z]);
      }
      for (let i = n; i >= 1; i--) {
        const w = half * (1 - i / (n + 1));
        const z = z1 + (h * i) / n;
        prof.push([mid - w, z], [mid - w - half / (n + 1), z]);
      }
      prof.push([k, z1]);
      break;
    }
    default:
      prof.push([1, z1], [k, z1]);
  }
  prof.push([k, z0]);
  return { prof, zc: z1 };
}

// Edge frame: u along the edge from its middle, d along the outward normal of the tile that owns the edge.
function edgeFrame(P0, P1) {
  const E = Math.hypot(P1[0] - P0[0], P1[1] - P0[1]);
  const tx = (P1[0] - P0[0]) / E, ty = (P1[1] - P0[1]) / E;
  return { E, tx, ty, nx: ty, ny: -tx, x: (P0[0] + P1[0]) / 2, y: (P0[1] + P1[1]) / 2 };
}

const cornerFactor = (a) => (a <= Math.PI / 2 + 1e-9 ? 1 / Math.tan(a / 2) : 1 / Math.sin(a));

function buildFabric(p, record = false) {
  const tiles = buildTiles(p);
  const S = linkSpec(p);
  assignRoles(tiles, p, S);
  const B = new Builder();
  if (record) { B.rec = []; B.solids = []; }
  const z0 = S.zp, zTop = S.zp + S.plateH;
  const ov = Math.min(0.2, S.plateH / 2);
  const info = { tiles: tiles.length, joints: 0, links: 0, tooShort: 0, minEdge: 0, pillarSkipped: 0, frames: 0, spokes: 0, tilesData: [], shortKnuckle: Infinity };
  const posts = tiles.map(() => []);
  const deep = new Array(tiles.length).fill(0); // how far parts of other bodies reach under each tile
  const plans = S.slot ? { F: slotPlan(S.slot, 'F'), M: slotPlan(S.slot, 'M') } : null;
  const alt = S.under && p.direction === 'alternate' && S.type !== 'free';
  const pitch = !S.under ? (S.type === 'flex' ? p.stripW + S.c : 0)
    : alt ? Math.max(slotPitch(S, S.slot, swapSlot(S.slot)), slotPitch(S, swapSlot(S.slot), S.slot)) : slotPitch(S, S.slot, S.slot);
  const reachCache = new Map();
  // Distance of the nearest joint centre from a corner of a tile (interior angle ang, roles of its two edges there).
  const reach = (ang, ra, rb) => {
    const k = `${ang.toFixed(4)}|${ra}|${rb}`;
    if (reachCache.has(k)) return reachCache.get(k);
    let x;
    if (S.type === 'hinge') {
      const h = S.inset + ov + S.c / 2, b = Math.min(ang, Math.PI - ang);
      x = ra === '-' || rb === '-' ? h : (h * (1 + Math.abs(Math.cos(b)))) / Math.sin(b);
    } else if (S.type === 'flex') x = p.stripW / 2 + S.g2 * cornerFactor(ang);
    else {
      const r = (q) => (q === 'B' ? 'F' : q === 'A' ? 'A' : q);
      x = cornerReach(S, ang, r(ra), r(rb), plans);
    }
    reachCache.set(k, x);
    return x;
  };

  const emit = (fr, q, du, owner, ownerTile, sideTiles) => {
    const qq = { ...q, u0: q.u0 + du, u1: q.u1 + du };
    B.owner = owner;
    B.rgb = q.owner === 'L' ? FREE_RGB : LINK_RGB;
    B.partSolid(fr, qq, p.footChamfer);
    if (q.post && ownerTile >= 0) {
      let d0 = Infinity, d1 = -Infinity;
      for (const [d] of q.sec) { d0 = Math.min(d0, d); d1 = Math.max(d1, d); }
      posts[ownerTile].push([[qq.u0, d0], [qq.u1, d0], [qq.u1, d1], [qq.u0, d1]].map(([u, d]) => [fr.x + fr.tx * u + fr.nx * d, fr.y + fr.ty * u + fr.ny * d]));
    }
    // reach under the tiles of the joint: d < 0 is under sideTiles[0], d > 0 under sideTiles[1]
    let dmin = Infinity, dmax = -Infinity;
    for (const [d] of q.sec) { dmin = Math.min(dmin, d); dmax = Math.max(dmax, d); }
    if (sideTiles[0] >= 0 && owner !== sideTiles[0] && q.owner !== 'J') deep[sideTiles[0]] = Math.max(deep[sideTiles[0]], -dmin);
    if (sideTiles[1] >= 0 && owner !== sideTiles[1] && q.owner !== 'J') deep[sideTiles[1]] = Math.max(deep[sideTiles[1]], dmax);
  };

  for (let ti = 0; ti < tiles.length; ti++) {
    const t = tiles[ti];
    const n = t.pts.length;
    for (let e = 0; e < n; e++) {
      const nbi = t.nb[e];
      const role = t.role[e];
      if (role === '-' || (nbi >= 0 && nbi < ti)) continue;
      const P0 = t.pts[e], P1 = t.pts[(e + 1) % n];
      const frT = edgeFrame(P0, P1);
      const E = frT.E;
      // reach at both ends, from the corners of both tiles
      let x0 = reach(t.ang[e], t.role[(e + n - 1) % n], role), x1 = reach(t.ang[(e + 1) % n], role, t.role[(e + 1) % n]);
      let frO = null;
      const o = nbi >= 0 ? tiles[nbi] : null;
      if (o) {
        const oe = t.nbEdge[e], on = o.pts.length;
        frO = edgeFrame(o.pts[oe], o.pts[(oe + 1) % on]);
        x1 = Math.max(x1, reach(o.ang[oe], o.role[(oe + on - 1) % on], o.role[oe]));
        x0 = Math.max(x0, reach(o.ang[(oe + 1) % on], o.role[oe], o.role[(oe + 1) % on]));
      }
      const xe = Math.max(x0, x1);

      if (S.type === 'hinge') {
        const ua = -E / 2 + xe, ub = E / 2 - xe;
        const K = p.knuckles;
        const { parts, len } = hingeParts(S, ua, ub, K);
        const needLen = Math.max(1.2, 3 * p.lineW);
        info.minEdge = Math.max(info.minEdge, 2 * xe + K * needLen + (K - 1) * S.c);
        if (len < needLen) info.tooShort++;
        info.shortKnuckle = Math.min(info.shortKnuckle, len);
        // the rod owner is M; parts are drawn in the frame of F
        const tIsM = role === 'M';
        const Fi = tIsM ? nbi : ti, Mi = tIsM ? ti : nbi;
        const fr = tIsM ? frO : frT;
        const sgn = tIsM ? -1 : 1;
        for (const q of parts) {
          const qq = sgn > 0 ? q : { ...q, u0: -q.u1, u1: -q.u0 };
          emit(fr, qq, 0, q.owner === 'F' ? Fi : Mi, q.owner === 'F' ? Fi : Mi, [Fi, Mi]);
        }
        info.joints++;
        continue;
      }

      // joints spread along the edge
      const count = role === 'B' ? p.links : alt ? 2 * p.links : p.links;
      const W = E / 2 - xe;
      let pp = pitch;
      if (count > 1) {
        const pmax = (2 * W) / (count - 1);
        if (pmax > pitch) pp = pitch + p.spread * (pmax - pitch);
      }
      const need = 2 * (xe + ((count - 1) / 2) * pitch);
      info.minEdge = Math.max(info.minEdge, need);
      if (need > E + 1e-6) info.tooShort++;
      for (let j = 0; j < count; j++) {
        const u = (j - (count - 1) / 2) * pp;
        let tIsF = role !== 'M';
        if (role === 'A') tIsF = j % 2 === 0;
        if (role === 'B') {
          for (const q of S.border) emit(frT, q, u, ti, ti, [ti, -1]);
          continue;
        }
        const Fi = tIsF ? ti : nbi, Mi = tIsF ? nbi : ti;
        const fr = tIsF ? frT : frO;
        const du = tIsF ? u : -u;
        const lid = `L${info.links}`;
        let hasLink = false;
        for (const q of S.slot) {
          const owner = q.owner === 'F' ? Fi : q.owner === 'M' ? Mi : q.owner === 'L' ? lid : 'J';
          if (q.owner === 'L') hasLink = true;
          emit(fr, q, du, owner, q.owner === 'F' ? Fi : q.owner === 'M' ? Mi : -1, [Fi, Mi]);
        }
        if (hasLink) info.links++;
        info.joints++;
      }
    }
  }

  // tiles
  let Rfold = Infinity;
  for (let ti = 0; ti < tiles.length; ti++) {
    const t = tiles[ti];
    const n = t.pts.length;
    const inset = S.type === 'hinge' ? t.nb.map((nb) => (nb >= 0 ? S.inset : S.g2)) : S.g2;
    const outline = plateOutline(t, p, inset);
    const R = outlineInradius(outline, t.c);
    if (t.kind === 0) Rfold = Math.min(Rfold, R);
    const ring = p.plateStyle === 'ring';
    const ringK = ring ? clamp(1 - p.ringWidth / R, 0.05, 0.95) : null;
    const inner = ring ? scalePts(outline, t.c, ringK) : null;
    const covered = (x, y) => pointInPoly(outline, x, y) && !(inner && pointInPoly(inner, x, y));

    B.owner = ti;
    B.rgb = CLASS_RGB[t.cls % 3];
    const { prof, zc } = plateProfile(p, R, z0, zTop, ringK);
    B.loft(outline, t.c, prof);
    if (B.rec) B.rec.push({ owner: ti, plate: true, pts: [...outline.map(([x, y]) => [x, y, z0]), ...outline.map(([x, y]) => [x, y, zc + 1e-3])] });
    info.tilesData.push({ c: t.c, R, zc, cls: t.cls, kind: t.kind, a0: Math.atan2(t.pts[1][1] - t.pts[0][1], t.pts[1][0] - t.pts[0][0]) });

    // Support frame when the tile does not cover its own posts (circle, star, ring outlines, small tiles).
    const uncovered = posts[ti].some((quad) => quad.some(([x, y]) => !covered(x, y)));
    const inPlaneOpen = !S.under && (ring || p.outline !== 'polygon' && p.outline !== 'rounded' || p.plateScale < 1);
    if (uncovered || inPlaneOpen) {
      info.frames++;
      const fOut = insetPoly(t.pts, inset);
      const Rf = inradius(fOut, t.c);
      const own = plans ? Math.max(0, ...plans.F.concat(plans.M).filter((r) => r.own).map((r) => r.d1)) : 0;
      const cover = S.under ? own + 0.4 - S.g2 : ov + 1.0;
      const kf = clamp(1 - cover / Rf, 0.05, 0.95);
      B.rgb = FRAME_RGB;
      B.loft(fOut, t.c, [[1, z0], [1, zTop], [kf, zTop], [kf, z0]]);
      const fIn = scalePts(fOut, t.c, kf);
      if (!outline.some(([x, y]) => !pointInPoly(fIn, x, y))) {
        info.spokes++;
        for (let e = 0; e < n; e++) {
          const Q0 = fOut[e], Q1 = fOut[(e + 1) % n];
          const mx = (Q0[0] + Q1[0]) / 2 - t.c[0], my = (Q0[1] + Q1[1]) / 2 - t.c[1];
          const len = Math.hypot(mx, my);
          B.box(t.c[0] + mx / 2, t.c[1] + my / 2, mx / len, my / len, len / 2, Math.max(0.6, p.postW / 2), z0, zTop);
        }
      }
    }

    // Centre pillar with a 45° flare: shortens the bridges of the tile's first layer.
    if (S.under && !ring && p.pillar) {
      const r = p.pillarD / 2;
      const room = t.inr - deep[ti] - S.c;
      const fl = Math.max(0, Math.min(p.pillarFlare, room - r, z0 * 0.8));
      if (r <= room && pointInPoly(outline, t.c[0], t.c[1])) {
        B.rgb = LINK_RGB;
        const m = Math.max(8, Math.round(p.segments / 2));
        const circ = Array.from({ length: m }, (_, k) => [t.c[0] + r * Math.cos((k * TAU) / m), t.c[1] + r * Math.sin((k * TAU) / m)]);
        const e = Math.min(p.footChamfer, r / 3);
        const prof = [[0, 0], ...(e > 0.005 ? [[1 - e / r, 0], [1, e]] : [[1, 0]]), [1, z0 - fl], [(r + fl) / r, z0], [(r + fl) / r, z0 + ov], [0, z0 + ov]];
        B.loft(circ, t.c, prof);
        if (B.rec) B.rec.push({ owner: ti, pts: [...circ.map(([x, y]) => [x, y, 0]), ...scalePts(circ, t.c, (r + fl) / r).map(([x, y]) => [x, y, z0 + ov])] });
      } else info.pillarSkipped++;
    }
  }
  info.Rfold = Number.isFinite(Rfold) ? Rfold : p.edge / 2;
  info.deep = Math.max(0, ...deep);

  const positions = new Float32Array(B.pos);
  const colors = new Float32Array(B.col);
  return { positions, colors, info, S, zTop, prisms: B.rec, solids: B.solids, tiles };
}

// ===== decoration =====

// Normalised triangle soup: centred in XY on its bounding box, standing on z = 0.
function normaliseSoup(src) {
  let x0 = Infinity, y0 = Infinity, z0 = Infinity, x1 = -Infinity, y1 = -Infinity, z1 = -Infinity;
  for (let k = 0; k < src.length; k += 3) {
    const x = src[k], y = src[k + 1], z = src[k + 2];
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
    if (z < z0) z0 = z; if (z > z1) z1 = z;
  }
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const out = new Float32Array(src.length);
  let r = 0;
  for (let k = 0; k < src.length; k += 3) {
    const x = src[k] - cx, y = src[k + 1] - cy;
    out[k] = x; out[k + 1] = y; out[k + 2] = src[k + 2] - z0;
    r = Math.max(r, x * x + y * y);
  }
  return { tris: out, rxy: Math.sqrt(r) || 1, zsize: z1 - z0 || 1 };
}

function parseSTL(buf) {
  const dv = new DataView(buf);
  if (buf.byteLength >= 84) {
    const n = dv.getUint32(80, true);
    if (84 + n * 50 === buf.byteLength) {
      const out = new Float32Array(n * 9);
      for (let i = 0; i < n; i++) {
        const o = 84 + i * 50 + 12;
        for (let k = 0; k < 9; k++) out[i * 9 + k] = dv.getFloat32(o + k * 4, true);
      }
      return out;
    }
  }
  const text = new TextDecoder().decode(buf);
  const re = /vertex\s+([-+0-9.eE]+)\s+([-+0-9.eE]+)\s+([-+0-9.eE]+)/g;
  const v = [];
  let m;
  while ((m = re.exec(text))) v.push(+m[1], +m[2], +m[3]);
  if (!v.length || v.length % 9) throw new Error('not an STL file');
  return new Float32Array(v);
}

function reorientSoup(src, up) {
  if (up === 'z') return src;
  const out = new Float32Array(src.length);
  for (let k = 0; k < src.length; k += 3) {
    const x = src[k], y = src[k + 1], z = src[k + 2];
    if (up === 'y') { out[k] = x; out[k + 1] = -z; out[k + 2] = y; }
    else { out[k] = y; out[k + 1] = z; out[k + 2] = x; }
  }
  return out;
}

function builtinDecor(kind, seg) {
  const B = new Builder();
  const circle = (r, m) => Array.from({ length: m }, (_, k) => [r * Math.cos((k * TAU) / m), r * Math.sin((k * TAU) / m)]);
  const O = [0, 0];
  const K = Math.max(4, Math.round(seg / 4));
  switch (kind) {
    case 'dome': {
      const prof = [[0, 0], [1, 0]];
      for (let k = 1; k <= K; k++) { const f = (k / K) * (Math.PI / 2); prof.push([Math.cos(f), Math.sin(f)]); }
      B.loft(circle(1, seg), O, prof);
      break;
    }
    case 'cone': B.loft(circle(1, seg), O, [[0, 0], [1, 0], [0, 1.4]]); break;
    case 'pyramid': B.loft(circle(1, 4).map(([x, y]) => [x * 0.7071 - y * 0.7071, x * 0.7071 + y * 0.7071]), O, [[0, 0], [1, 0], [0, 1]]); break;
    case 'stud': B.loft(circle(1, seg), O, [[0, 0], [1, 0], [1, 0.8], [0.85, 1], [0, 1]]); break;
    case 'star': {
      const pts = Array.from({ length: 10 }, (_, k) => {
        const a = Math.PI / 2 + (k * Math.PI) / 5, r = k % 2 ? 0.42 : 1;
        return [r * Math.cos(a), r * Math.sin(a)];
      });
      B.loft(pts, O, [[0, 0], [1, 0], [1, 0.6], [0, 1]]);
      break;
    }
    case 'heart': {
      const m = Math.max(48, seg * 2);
      const pts = Array.from({ length: m }, (_, k) => {
        const t = (k / m) * TAU;
        return [(16 * Math.sin(t) ** 3) / 17, (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t) + 4) / 17];
      });
      B.loft(pts, [0, 0.05], [[0, 0], [1, 0], [1, 0.5], [0.8, 0.85], [0, 1]]);
      break;
    }
    case 'torus': {
      const prof = [];
      for (let k = 0; k < seg / 2; k++) {
        const f = (k / (seg / 2)) * TAU;
        prof.push([0.72 + 0.28 * Math.cos(f), 0.28 + 0.28 * Math.sin(f)]);
      }
      B.loft(circle(1, seg), O, prof);
      break;
    }
    default: return null;
  }
  return normaliseSoup(new Float32Array(B.pos));
}

let loadedSTL = null; // { name, raw }
let decorCache = { key: '', soup: null };
function currentDecor(p) {
  if (p.decor === 'none') return null;
  const key = p.decor === 'stl' ? `stl:${loadedSTL?.name}:${p.decorUp}` : `${p.decor}:${p.segments}`;
  if (decorCache.key === key) return decorCache.soup;
  let soup = null;
  if (p.decor === 'stl') soup = loadedSTL ? normaliseSoup(reorientSoup(loadedSTL.raw, p.decorUp)) : null;
  else soup = builtinDecor(p.decor, p.segments);
  decorCache = { key, soup };
  return soup;
}

// One transform per decorated tile: [cx, cy, z, angle, sxy, sz].
function decorPlacements(p, fabric, soup) {
  if (!soup) return [];
  const out = [];
  fabric.info.tilesData.forEach((t, i) => {
    const seed = p.decorSeed;
    switch (p.decorWhere) {
      case 'class0': if (t.cls !== 0) return; break;
      case 'notclass0': if (t.cls === 0) return; break;
      case 'main': if (t.kind !== 0) return; break;
      case 'random': if (rand01(seed, i, 1) * 100 >= p.decorShare) return; break;
    }
    const jit = 1 - p.decorJitter * rand01(seed, i, 2);
    const sxy = ((p.decorSize * t.R) / soup.rxy) * jit;
    const sz = p.decorHeight > 0 ? (p.decorHeight / soup.zsize) * jit : sxy;
    let a = (p.decorRot * Math.PI) / 180;
    if (p.decorRotMode === 'tile') a += t.a0;
    else if (p.decorRotMode === 'alternate') a += (t.cls % 2) * Math.PI;
    else if (p.decorRotMode === 'random') a += rand01(seed, i, 3) * TAU;
    out.push([t.c[0], t.c[1], t.zc - p.decorEmbed, a, sxy, sz]);
  });
  return out;
}

function decorTriangles(soup, places) {
  const src = soup.tris;
  const out = new Float32Array(src.length * places.length);
  let o = 0;
  for (const [cx, cy, z, a, sxy, sz] of places) {
    const c = Math.cos(a) * sxy, s = Math.sin(a) * sxy;
    for (let k = 0; k < src.length; k += 3) {
      const x = src[k], y = src[k + 1];
      out[o++] = cx + c * x - s * y;
      out[o++] = cy + s * x + c * y;
      out[o++] = z + src[k + 2] * sz;
    }
  }
  return out;
}

// ===== stl =====

function trianglesToSTL(parts, header = 'space fabric generator') {
  const triCount = parts.reduce((n, a) => n + a.length / 9, 0);
  const buffer = new ArrayBuffer(84 + triCount * 50);
  const view = new DataView(buffer);
  const bytes = new Uint8Array(buffer);
  for (let i = 0; i < Math.min(80, header.length); i++) bytes[i] = header.charCodeAt(i) & 0x7f;
  view.setUint32(80, triCount, true);
  let o = 84;
  for (const P of parts) {
    for (let k = 0; k < P.length; k += 9) {
      const ux = P[k + 3] - P[k], uy = P[k + 4] - P[k + 1], uz = P[k + 5] - P[k + 2];
      const vx = P[k + 6] - P[k], vy = P[k + 7] - P[k + 1], vz = P[k + 8] - P[k + 2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const len = Math.hypot(nx, ny, nz) || 1;
      view.setFloat32(o, nx / len, true); view.setFloat32(o + 4, ny / len, true); view.setFloat32(o + 8, nz / len, true);
      for (let d = 0; d < 9; d++) view.setFloat32(o + 12 + d * 4, P[k + d], true);
      view.setUint16(o + 48, 0, true);
      o += 50;
    }
  }
  return buffer;
}

// ===== main =====

const EXPORT_WARN_TRIANGLES = 8_000_000;

const state = { ...DEFAULTS, ...PRESETS[0].params };
const fromHash = readHash();

const $ = (id) => document.getElementById(id);
const controlsByKey = new Map();

// ---------- form ----------

function makeControl(p) {
  const wrap = document.createElement('label');
  wrap.className = 'field';
  const title = document.createElement('span');
  title.textContent = p.label;
