<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tiles — wall installation generator</title>
<style>
  :root {
    --bg: #dcd9d3;
    --panel: #f7f6f3;
    --panel-2: #ecebe7;
    --line: #dddad4;
    --text: #23221f;
    --muted: #7b776f;
    --accent: #2f6f8f;
    --warn: #b5532f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; width: 100vw; height: 100vh; }

  #view { position: relative; flex: 1 1 auto; min-width: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: absolute; left: 14px; top: 12px; font-size: 12px; color: #5d5a54; line-height: 1.6;
    pointer-events: none;
  }
  #hud b { color: var(--text); }
  #stats {
    position: absolute; left: 14px; bottom: 12px; font-size: 12px; color: #4a4843; line-height: 1.55;
    background: rgba(247,246,243,.82); padding: 8px 11px; border-radius: 8px; pointer-events: none;
    font-variant-numeric: tabular-nums; max-width: calc(100% - 28px);
  }
  #stats .warn { color: var(--warn); }
  #views { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; }
  #views button { flex: 0 0 auto; padding: 6px 10px; background: rgba(247,246,243,.9); }

  #panel {
    flex: 0 0 350px; width: 350px; height: 100%; overflow-y: auto;
    background: var(--panel); border-left: 1px solid var(--line); padding-bottom: 40px;
  }
  .head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 5; }
  .head h1 { font-size: 15px; margin: 0; }
  .head p { margin: 4px 0 0; font-size: 11px; color: var(--muted); }

  .group { border-bottom: 1px solid var(--line); }
  .group > .title {
    display: flex; justify-content: space-between; align-items: center; padding: 11px 18px; cursor: pointer;
    user-select: none; font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--muted);
  }
  .group > .title:hover { color: var(--text); }
  .group > .title .chev { transition: transform .15s; font-size: 10px; }
  .group.collapsed > .title .chev { transform: rotate(-90deg); }
  .group.collapsed > .body { display: none; }
  .group > .body { padding: 2px 18px 14px; }
  .sub { font-size: 11px; font-weight: 600; color: var(--muted); margin: 14px 0 2px; text-transform: uppercase; letter-spacing: .4px; }

  .row { margin: 9px 0; }
  .row.hidden { display: none; }
  .row > label { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 4px; }
  .row > label .unit { color: var(--muted); font-size: 11px; margin-left: 3px; }
  .row input.num {
    width: 74px; text-align: right; padding: 3px 6px; font-size: 12px; border: 1px solid var(--line);
    border-radius: 5px; background: #fff; color: var(--text); font-variant-numeric: tabular-nums;
  }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); }
  select {
    width: 100%; background: #fff; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; font-size: 12px;
  }
  .row > label.check { display: flex; justify-content: flex-start; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; margin: 0; }
  .check input { width: 15px; height: 15px; accent-color: var(--accent); margin: 0; }
  .color { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
  .color input { width: 44px; height: 24px; border: 1px solid var(--line); border-radius: 5px; padding: 0 2px; background: #fff; }

  button {
    flex: 1 1 auto; background: #fff; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; font-size: 12px; cursor: pointer; font-weight: 500;
  }
  button:hover { border-color: #b9b5ad; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
  button.primary:hover { background: #255b76; }
  .btnrow { display: flex; gap: 7px; flex-wrap: wrap; margin: 8px 0; }
  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .presets button { text-align: left; padding: 7px 9px; }
  .hint { font-size: 11px; color: var(--muted); line-height: 1.5; margin: 6px 0 0; }

  @media (max-width: 760px) {
    body { overflow: auto; }
    #app { flex-direction: column; height: auto; }
    #view { flex: 0 0 58vh; height: 58vh; }
    #panel { flex: none; width: 100%; height: auto; border-left: 0; border-top: 1px solid var(--line); }
    .head { position: static; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="hud"><b>Tiles</b> · rotate — left mouse · zoom — wheel · pan — right mouse</div>
    <div id="views">
      <button data-view="front">Front</button>
      <button data-view="angle">3/4</button>
      <button data-view="side">Side</button>
    </div>
    <div id="stats"></div>
  </div>

  <div id="panel">
    <div class="head">
      <h1>Wall Installation Generator</h1>
      <p>Modular relief made of separate pieces. All dimensions are in millimetres. Export to STL.</p>
    </div>

    <div class="group" id="g-presets">
      <div class="title">Presets <span class="chev">▾</span></div>
      <div class="body">
        <div class="presets" id="presets"></div>
        <div class="btnrow">
          <button id="btn-random">Random composition</button>
          <button id="btn-reseed">New seed</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="core.js"></script>
<script>
'use strict';
const { DEFAULTS, PRESETS } = TileCore;
const STORE_KEY = 'tiles-params-v1';

/* =========================================================================
   PARAMETER SCHEMA → PANEL
   ========================================================================= */
const is = (k, ...vals) => (p) => vals.includes(p[k]);
const not = (k, ...vals) => (p) => !vals.includes(p[k]);
const rect = is('layout', 'rect'), radial = is('layout', 'radial'), hex = is('layout', 'hex');
const hexRect = (p) => hex(p) && p.hexShape === 'rect', hexGon = (p) => hex(p) && p.hexShape === 'hexagon';
const panelSized = (p) => rect(p) || hexRect(p);

const SCALAR_MODES = [
  ['const', 'Constant'], ['linear', 'Linear gradient'], ['radial', 'From a point'], ['wave', 'Wave'],
  ['ring', 'Circular waves'], ['noise', 'Noise'], ['random', 'Random'], ['checker', 'Checkerboard'], ['border', 'Edge to centre'],
];
function scalarControls(pre) {
  const m = (...v) => is(pre + '_mode', ...v);
  return [
    { k: pre + '_mode', t: 'select', l: 'Distribution', opts: SCALAR_MODES },
    { k: pre + '_angle', t: 'range', l: 'Angle', min: -180, max: 180, step: 1, u: '°', show: m('linear', 'wave') },
    { k: pre + '_px', t: 'range', l: 'Point X', min: -1.5, max: 1.5, step: 0.01, show: m('radial', 'ring') },
    { k: pre + '_py', t: 'range', l: 'Point Y', min: -1.5, max: 1.5, step: 0.01, show: m('radial', 'ring') },
    { k: pre + '_freq', t: 'range', l: 'Frequency', min: 0.1, max: 6, step: 0.05, show: m('wave', 'ring') },
    { k: pre + '_phase', t: 'range', l: 'Phase', min: 0, max: 360, step: 1, u: '°', show: m('wave', 'ring') },
    { k: pre + '_noise', t: 'range', l: 'Noise scale', min: 0.2, max: 6, step: 0.05, show: m('noise') },
    { k: pre + '_jit', t: 'range', l: 'Randomness', min: 0, max: 1, step: 0.01, show: not(pre + '_mode', 'const') },
    { k: pre + '_gamma', t: 'range', l: 'Curve (gamma)', min: 0.2, max: 4, step: 0.05, show: not(pre + '_mode', 'const') },
    { k: pre + '_inv', t: 'check', l: 'Invert', show: not(pre + '_mode', 'const') },
  ];
}

const SECTIONS = [
  { title: 'Layout', items: [
    { k: 'layout', t: 'select', l: 'Grid type', opts: [['rect', 'Rectangular'], ['radial', 'Radial'], ['hex', 'Hexagonal (honeycomb)']] },
    { k: 'hexShape', t: 'select', l: 'Panel shape', opts: [['rect', 'Rectangle'], ['hexagon', 'Hexagon']], show: hex },
    { k: 'hexOrient', t: 'select', l: 'Hexagon orientation', opts: [['pointy', 'Corner up'], ['flat', 'Flat side up']], show: hex },
    { k: 'W', t: 'range', l: 'Width', min: 50, max: 2000, step: 1, u: 'mm', show: panelSized },
    { k: 'H', t: 'range', l: 'Height', min: 50, max: 2000, step: 1, u: 'mm', show: panelSized },
    { k: 'cols', t: 'range', l: 'Columns', min: 1, max: 60, step: 1, int: true, show: panelSized },
    { k: 'hexRings', t: 'range', l: 'Rings around centre', min: 0, max: 25, step: 1, int: true, show: hexGon },
    { k: 'hexSize', t: 'range', l: 'Cell size (across flats)', min: 5, max: 300, step: 0.5, u: 'mm', show: hexGon },
    { k: 'rows', t: 'range', l: 'Rows', min: 1, max: 60, step: 1, int: true, show: rect },
    { k: 'rIn', t: 'range', l: 'Inner radius', min: 0, max: 400, step: 1, u: 'mm', show: radial },
    { k: 'rings', t: 'range', l: 'Rings', min: 1, max: 40, step: 1, int: true, show: radial },
    { k: 'ringW', t: 'range', l: 'Ring width', min: 5, max: 200, step: 0.5, u: 'mm', show: radial },
    { k: 'segMode', t: 'select', l: 'Segments per ring', opts: [['equal', 'Equal cell size'], ['fixed', 'Equal count']], show: radial },
    { k: 'aspect', t: 'range', l: 'Arc length / width', min: 0.4, max: 3, step: 0.05, show: (p) => radial(p) && p.segMode === 'equal' },
    { k: 'segs', t: 'range', l: 'Segments', min: 3, max: 120, step: 1, int: true, show: (p) => radial(p) && p.segMode === 'fixed' },
    { k: 'arcDiv', t: 'range', l: 'Facets per arc', min: 1, max: 8, step: 1, int: true, show: radial },
    { k: 'startAng', t: 'range', l: 'Grid rotation', min: -180, max: 180, step: 1, u: '°', show: radial },
    { k: 'stagger', t: 'check', l: 'Offset even rings (brick)', show: radial },
    { k: 'centerPiece', t: 'check', l: 'Centre piece', show: (p) => radial(p) && p.rIn > 0 },
    { k: 'gap', t: 'range', l: 'Gap between pieces', min: 0, max: 20, step: 0.1, u: 'mm' },
  ] },
  { title: 'Piece shape', items: [
    { k: 'foot', t: 'select', l: 'Base', opts: [['cell', 'Cell (square / sector)'], ['circle', 'Circle / polygon'], ['drop', 'Drop']] },
    { k: 'sides', t: 'range', l: 'Sides', min: 3, max: 64, step: 1, int: true, show: is('foot', 'circle', 'drop') },
    { k: 'dropLen', t: 'range', l: 'Drop elongation', min: 1.1, max: 4, step: 0.05, show: is('foot', 'drop') },
    { k: 'fScale', t: 'range', l: 'Base size', min: 0.1, max: 1, step: 0.01 },
    { k: 'sizeLink', t: 'range', l: 'Size depends on height', min: 0, max: 0.9, step: 0.01 },
    { k: 'topScale', t: 'range', l: 'Top: 0 — pyramid, 1 — prism', min: 0, max: 1.3, step: 0.01 },
    { k: 'curv', t: 'range', l: 'Profile: − concave, + dome', min: -2, max: 2, step: 0.05 },
    { k: 'layers', t: 'range', l: 'Segments along height', min: 2, max: 24, step: 1, int: true, show: (p) => Math.abs(p.curv) > 0.001 || p.twist !== 0 || p.twistJit !== 0 },
    { k: 'plinth', t: 'range', l: 'Plinth (vertical rim)', min: 0, max: 20, step: 0.1, u: 'mm' },
  ] },
  { title: 'Height', items: [
    { k: 'hMin', t: 'range', l: 'Min. height', min: 0.5, max: 300, step: 0.5, u: 'mm' },
    { k: 'hMax', t: 'range', l: 'Max. height', min: 0.5, max: 300, step: 0.5, u: 'mm' },
    ...scalarControls('h'),
  ] },
  { title: 'Tilt and rotation', items: [
    { k: 'offset', t: 'range', l: 'Apex offset (in cells)', min: 0, max: 2.5, step: 0.01 },
    { k: 'tilt', t: 'range', l: 'Top face tilt', min: 0, max: 75, step: 0.5, u: '°' },
    { k: 'twist', t: 'range', l: 'Twist', min: -180, max: 180, step: 1, u: '°' },
    { k: 'twistJit', t: 'range', l: 'Random twist ±', min: 0, max: 90, step: 1, u: '°' },
    { sub: 'Tilt strength by field' },
    { k: 'iMin', t: 'range', l: 'Minimum strength', min: 0, max: 1, step: 0.01 },
    ...scalarControls('i'),
  ] },
  { title: 'Tilt direction', items: [
    { k: 'd_mode', t: 'select', l: 'Direction field', opts: [
      ['linear', 'Single direction'], ['point', 'From a point / vortex'], ['wave', 'Wave'], ['noise', 'Noise'],
      ['alternate', 'Alternating rows / rings'], ['random', 'Random'],
    ] },
    { k: 'd_angle', t: 'range', l: 'Angle (0° right, 90° up)', min: -180, max: 180, step: 1, u: '°', show: is('d_mode', 'linear', 'wave', 'noise', 'alternate') },
    { k: 'd_px', t: 'range', l: 'Point X', min: -1.5, max: 1.5, step: 0.01, show: is('d_mode', 'point') },
    { k: 'd_py', t: 'range', l: 'Point Y', min: -1.5, max: 1.5, step: 0.01, show: is('d_mode', 'point') },
    { k: 'd_rot', t: 'range', l: 'Rotation: 0 from point, 90 vortex, 180 to point', min: -180, max: 180, step: 1, u: '°', show: is('d_mode', 'point') },
    { k: 'd_amp', t: 'range', l: 'Amplitude', min: 0, max: 180, step: 1, u: '°', show: is('d_mode', 'wave', 'noise', 'alternate') },
    { k: 'd_freq', t: 'range', l: 'Wave frequency', min: 0.1, max: 6, step: 0.05, show: is('d_mode', 'wave') },
    { k: 'd_wAngle', t: 'range', l: 'Wave direction', min: -180, max: 180, step: 1, u: '°', show: is('d_mode', 'wave') },
    { k: 'd_noise', t: 'range', l: 'Noise scale', min: 0.2, max: 6, step: 0.05, show: is('d_mode', 'noise') },
    { k: 'd_jit', t: 'range', l: 'Random deviation ±', min: 0, max: 90, step: 1, u: '°' },
    { k: 'seed', t: 'range', l: 'Seed', min: 1, max: 9999, step: 1, int: true },
  ] },
  { title: 'Colour and backing', items: [
    { k: 'colMain', t: 'color', l: 'Main colour' },
    { k: 'acc', t: 'select', l: 'Second colour — which pieces', opts: [
      ['none', 'None'], ['random', 'Random pieces'], ['checker', 'Checkerboard'], ['border', 'Border frame'],
      ['stripes', 'Stripes (rows / rings)'], ['height', 'Tallest'],
    ] },
    { k: 'colAcc', t: 'color', l: 'Second group colour', show: not('acc', 'none') },
    { k: 'accN', t: 'range', l: 'Frame / stripe width', min: 1, max: 10, step: 1, int: true, show: is('acc', 'border', 'stripes') },
    { k: 'accP', t: 'range', l: 'Fraction of pieces', min: 0, max: 1, step: 0.01, show: is('acc', 'random', 'height') },
    { k: 'board', t: 'check', l: 'Backing (panel)' },
    { k: 'colBoard', t: 'color', l: 'Backing colour', show: is('board', true) },
    { k: 'bMargin', t: 'range', l: 'Margin around', min: 0, max: 200, step: 1, u: 'mm', show: is('board', true) },
    { k: 'bThick', t: 'range', l: 'Backing thickness', min: 1, max: 40, step: 0.5, u: 'mm', show: is('board', true) },
  ] },
  { title: 'Light', collapsed: true, items: [
    { k: 'lightAz', t: 'range', l: 'Light direction', min: -180, max: 180, step: 1, u: '°' },
    { k: 'lightEl', t: 'range', l: 'Light elevation', min: 5, max: 90, step: 1, u: '°' },
  ] },
  { title: 'Export', id: 'g-export', items: [
    { k: 'exBoard', t: 'check', l: 'Include backing in export', show: is('board', true) },
    { sub: 'Printer bed (for per-bed layout)' },
    { k: 'bedX', t: 'range', l: 'Bed X', min: 50, max: 1000, step: 1, u: 'mm' },
    { k: 'bedY', t: 'range', l: 'Bed Y', min: 50, max: 1000, step: 1, u: 'mm' },
    { k: 'bedGap', t: 'range', l: 'Spacing between pieces', min: 0.5, max: 20, step: 0.5, u: 'mm' },
    { html: `
      <div class="btnrow"><button class="primary" id="ex-assembled">STL — whole installation</button></div>
      <div class="btnrow">
        <button id="ex-parts">ZIP — every piece</button>
        <button id="ex-plates">ZIP — per bed</button>
      </div>
      <div class="btnrow">
        <button id="ex-svg">SVG — 1:1 assembly map</button>
      </div>
      <div class="btnrow">
        <button id="ex-json">Save parameters</button>
        <button id="im-json">Load…</button>
        <input type="file" id="im-file" accept=".json,application/json" hidden />
      </div>
      <p class="hint">All pieces are separate closed solids with their base on z = 0. File names match the numbers on the assembly map
      (R — row, C — column; K — ring, S — segment; for "flat side up" hexagons C — column, R — position in it from top to bottom). The red arrow on the map shows where the apex points.</p>` },
  ] },
];

let P = loadStored() || { ...DEFAULTS, ...PRESETS[3].p };
const controls = {}; // key -> {row, set(v)}

function buildPanel() {
  const panel = document.getElementById('panel');
  const presetBox = document.getElementById('presets');
  PRESETS.forEach((pr, i) => {
    const b = document.createElement('button');
    b.textContent = pr.name;
    b.onclick = () => applyPreset(i);
    presetBox.appendChild(b);
  });

  for (const sec of SECTIONS) {
    const g = document.createElement('div');
    g.className = 'group' + (sec.collapsed ? ' collapsed' : '');
    if (sec.id) g.id = sec.id;
    g.innerHTML = `<div class="title">${sec.title} <span class="chev">▾</span></div><div class="body"></div>`;
    const body = g.querySelector('.body');
    for (const it of sec.items) body.appendChild(makeControl(it));
    panel.appendChild(g);
  }
  panel.querySelectorAll('.group > .title').forEach((t) => {
    t.addEventListener('click', () => t.parentElement.classList.toggle('collapsed'));
  });
}

function makeControl(it) {
  const row = document.createElement('div');
  row.className = 'row';
  if (it.html) { row.innerHTML = it.html; return row; }
  if (it.sub) { row.className = 'sub'; row.textContent = it.sub; return row; }
  const set = (v) => {
    if (it.int) v = Math.round(v);
    P[it.k] = v;
    onChange();
  };
  let sync;
  if (it.t === 'range') {
    row.innerHTML = `<label><span>${it.l}</span><span><input class="num" type="number" step="${it.step}"/>${it.u ? `<span class="unit">${it.u}</span>` : ''}</span></label>
      <input type="range" min="${it.min}" max="${it.max}" step="${it.step}"/>`;
    const num = row.querySelector('.num'), rng = row.querySelector('input[type=range]');
    rng.addEventListener('input', () => { num.value = rng.value; set(parseFloat(rng.value)); });
    num.addEventListener('change', () => {
      const v = parseFloat(num.value);
      if (Number.isFinite(v)) { rng.value = v; set(v); } else sync();
    });
    sync = () => { const v = P[it.k]; num.value = +(+v).toFixed(3); rng.value = v; };
  } else if (it.t === 'select') {
    row.innerHTML = `<label><span>${it.l}</span></label><select>${it.opts.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>`;
    const sel = row.querySelector('select');
    sel.addEventListener('change', () => set(sel.value));
    sync = () => { sel.value = P[it.k]; };
  } else if (it.t === 'check') {
    row.innerHTML = `<label class="check"><input type="checkbox"/> ${it.l}</label>`;
    const cb = row.querySelector('input');
    cb.addEventListener('change', () => set(cb.checked));
    sync = () => { cb.checked = !!P[it.k]; };
  } else if (it.t === 'color') {
    row.innerHTML = `<label class="color"><span>${it.l}</span><input type="color"/></label>`;
    const ci = row.querySelector('input');
    ci.addEventListener('input', () => set(ci.value));
    sync = () => { ci.value = P[it.k]; };
  }
  controls[it.k] = { row, sync, show: it.show };
  return row;
}

function syncPanel() {
  for (const k in controls) {
    const c = controls[k];
    c.sync();
    c.row.classList.toggle('hidden', !!c.show && !c.show(P));
  }
}
function refreshVisibility() {
  for (const k in controls) {
    const c = controls[k];
    c.row.classList.toggle('hidden', !!c.show && !c.show(P));
  }
}

function applyPreset(i) {
  P = { ...DEFAULTS, ...PRESETS[i].p, seed: P.seed };
  syncPanel();
  rebuild(true);
  store();
}

function randomComposition() {
  const r = Math.random, pick = (a) => a[Math.floor(r() * a.length)];
  const base = PRESETS[Math.floor(r() * PRESETS.length)].p;
  P = { ...DEFAULTS, ...base };
  P.seed = 1 + Math.floor(r() * 9998);
  P.d_mode = pick(['linear', 'point', 'point', 'wave', 'noise', 'alternate']);
  P.d_angle = Math.round(r() * 360 - 180);
  P.d_rot = pick([0, 0, 90, 110, 180, -90]);
  P.d_px = +(r() * 2 - 1).toFixed(2); P.d_py = +(r() * 2 - 1).toFixed(2);
  P.i_mode = pick(['const', 'linear', 'radial', 'wave', 'noise', 'ring']);
  P.i_px = P.d_px; P.i_py = P.d_py; P.i_angle = Math.round(r() * 360 - 180);
  P.h_mode = pick(['const', 'radial', 'wave', 'noise', 'ring']);
  P.topScale = pick([0, 0, 0, 0.4, 1]);
  P.offset = +(0.2 + r() * 1.1).toFixed(2);
  P.tilt = P.topScale > 0 ? Math.round(r() * 40) : 0;
  syncPanel();
  rebuild(true);
  store();
}

function store() { try { localStorage.setItem(STORE_KEY, JSON.stringify(P)); } catch (e) { /* storage unavailable */ } }
function loadStored() {
  try {
    const s = localStorage.getItem(STORE_KEY);
    return s ? { ...DEFAULTS, ...JSON.parse(s) } : null;
  } catch (e) { return null; }
}

let pending = false, lastExt = 0;
function onChange() {
  refreshVisibility();
  store();
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; rebuild(false); });
}

/* =========================================================================
   VIEWER
   ========================================================================= */
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#dcd9d3');
const camera = new THREE.PerspectiveCamera(32, 1, 1, 100000);
const orbit = new THREE.OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
orbit.dampingFactor = 0.12;

scene.add(new THREE.HemisphereLight(0xffffff, 0xb4b0a8, 0.62));
scene.add(new THREE.AmbientLight(0xffffff, 0.18));
const sun = new THREE.DirectionalLight(0xffffff, 0.62);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.4;
scene.add(sun, sun.target);

const wall = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.MeshStandardMaterial({ color: '#e4e1db', roughness: 0.95 })
);
wall.receiveShadow = true;
scene.add(wall);

const mats = [0, 1, 2].map(() => new THREE.MeshStandardMaterial({ roughness: 0.82, metalness: 0 }));
let meshes = [];
let G = null;

function rebuild(fit) {
  G = TileCore.generate(P);
  for (const m of meshes) { scene.remove(m); m.geometry.dispose(); }
  meshes = [];

  const groups = [[], [], []];
  for (const p of G.parts) groups[p.group].push(p.tris);
  if (G.board) groups[2].push(G.board.tris);
  groups.forEach((list, gi) => {
    if (!list.length) return;
    let n = 0;
    for (const t of list) n += t.length;
    const pos = new Float32Array(n);
    let o = 0;
    for (const t of list) { pos.set(t, o); o += t.length; }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, mats[gi]);
    mesh.castShadow = gi !== 2;
    mesh.receiveShadow = true;
    scene.add(mesh);
    meshes.push(mesh);
  });
  mats[0].color.set(P.colMain);
  mats[1].color.set(P.colAcc);
  mats[2].color.set(P.colBoard);

  const ext = extent();
  const zBack = G.board ? -Math.max(0.5, P.bThick) : 0;
  wall.position.set(0, 0, zBack - 0.2);
  wall.scale.set(ext * 8, ext * 8, 1);
  wall.material.color.set(P.board ? '#e4e1db' : shade(P.colMain));
  placeLight(ext);
  if (fit || Math.abs(ext - lastExt) / (lastExt || 1) > 0.35) setView(currentView, ext);
  lastExt = ext;
  showStats();
}

// wall tint: a light neutral that still separates from light parts
function shade(hex) {
  const c = new THREE.Color(hex);
  const l = 0.299 * c.r + 0.587 * c.g + 0.114 * c.b;
  return l > 0.8 ? '#dedad3' : '#ebe8e2';
}

function extent() {
  const L = G.layout;
  const m = P.board ? P.bMargin : 0;
  return L.ext + m;
}

function placeLight(ext) {
  const az = P.lightAz * Math.PI / 180, el = P.lightEl * Math.PI / 180;
  const D = ext * 4;
  sun.position.set(Math.cos(el) * Math.cos(az) * D, Math.cos(el) * Math.sin(az) * D, Math.sin(el) * D);
  sun.target.position.set(0, 0, 0);
  const cam = sun.shadow.camera;
  const s = ext * 1.5;
  cam.left = -s; cam.right = s; cam.top = s; cam.bottom = -s;
  cam.near = 1; cam.far = D * 2.5;
  cam.updateProjectionMatrix();
}

let currentView = 'angle';
function setView(kind, ext = extent()) {
  currentView = kind;
  const D = ext / Math.tan((camera.fov * Math.PI) / 360) * 1.25;
  const pos = {
    front: [0, 0, D],
    angle: [D * 0.34, -D * 0.12, D * 0.93],
    side: [D * 0.93, -D * 0.05, D * 0.36],
  }[kind];
  camera.position.set(...pos);
  camera.near = Math.max(0.5, D / 500);
  camera.far = D * 20;
  camera.updateProjectionMatrix();
  orbit.target.set(0, 0, 0);
  orbit.update();
}
document.querySelectorAll('#views button').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

(function loop() {
  requestAnimationFrame(loop);
  orbit.update();
  renderer.render(scene, camera);
})();

/* =========================================================================
   STATS
   ========================================================================= */
const fmt = (v) => (Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(1));
function partBounds(p) { return TileCore.bounds([p.tris]); }

function showStats() {
  const b = G.bounds;
  let tris = 0, maxW = 0, maxD = 0, maxH = 0;
  const count = [0, 0];
  for (const p of G.parts) {
    tris += p.tris.length / 9;
    count[p.group]++;
    const pb = partBounds(p);
    maxW = Math.max(maxW, pb.max[0] - pb.min[0]);
    maxD = Math.max(maxD, pb.max[1] - pb.min[1]);
    maxH = Math.max(maxH, pb.max[2]);
  }
  const lines = [];
  lines.push(`<b>${G.parts.length}</b> pieces` + (P.acc !== 'none' ? ` (${count[0]} + ${count[1]} in the second colour)` : '') + ` · ${tris.toLocaleString('en-US')} triangles`);
  if (G.parts.length) {
    lines.push(`Overall size: ${fmt(b.max[0] - b.min[0])} × ${fmt(b.max[1] - b.min[1])} × ${fmt(b.max[2] - Math.min(0, b.min[2]))} mm`);
    lines.push(`Largest piece: ${fmt(maxW)} × ${fmt(maxD)} × ${fmt(maxH)} mm`);
  }
  const warn = [...G.warnings];
  if (maxW > P.bedX || maxD > P.bedY) warn.push('A piece is larger than the printer bed');
  if (P.hMin > P.hMax) warn.push('Min. height is greater than max. height');
  for (const w of warn) lines.push(`<span class="warn">⚠ ${w}</span>`);
  document.getElementById('stats').innerHTML = lines.join('<br/>');
}

/* =========================================================================
   EXPORT
   ========================================================================= */
function baseName() {
  const L = G.layout;
  const size = `${Math.round(L.half[0] * 2)}x${Math.round(L.half[1] * 2)}`;
  return `tiles_${P.layout}_${size}`;
}

function download(data, name, type) {
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

const groupName = (g) => (g === 1 ? 'color2' : 'color1');
const boardItem = () => (G.board && P.exBoard ? [G.board] : []);

function readme() {
  return [
    'Tiles — piece set',
    '',
    `Pieces: ${G.parts.length}. All dimensions in mm, each piece stands with its base on z = 0.`,
    'Piece number: R — row (top to bottom), C — column (left to right);',
    'for the radial grid: K — ring (from centre), S — segment (counter-clockwise from 0°), C00 — centre;',
    'for "flat side up" hexagons: C — column (left to right), R — position in the column (top to bottom).',
    'assembly.svg — 1:1 assembly template: base outline, number,',
    'red arrow — where the piece apex is offset.',
    P.acc !== 'none' ? 'Folders color1 / color2 — pieces in the main and second colour.' : '',
  ].join('\r\n');
}

function wireExports() {
  document.getElementById('ex-assembled').onclick = () => {
    const items = G.parts.concat(boardItem()).map((p) => ({ tris: p.tris }));
    download(TileCore.stlBinary(items, baseName()), baseName() + '.stl', 'model/stl');
  };

  document.getElementById('ex-parts').onclick = () => {
    const two = P.acc !== 'none';
    const files = G.parts.map((p) => ({
      name: (two ? groupName(p.group) + '/' : '') + p.id + '.stl',
      data: TileCore.stlBinary([{ tris: p.tris }], p.id),
    }));
    for (const b of boardItem()) files.push({ name: 'BOARD.stl', data: TileCore.stlBinary([{ tris: b.tris, dz: P.bThick }], 'BOARD') });
    files.push({ name: 'assembly.svg', data: TileCore.assemblySVG(G) });
    files.push({ name: 'params.json', data: JSON.stringify(P, null, 2) });
    files.push({ name: 'README.txt', data: readme() });
    download(new Blob([TileCore.makeZip(files)], { type: 'application/zip' }), baseName() + '_parts.zip');
  };

  document.getElementById('ex-plates').onclick = () => {
    const files = [];
    const list = [];
    const two = P.acc !== 'none';
    const sets = two ? [0, 1].map((g) => G.parts.filter((p) => p.group === g)) : [G.parts];
    const over = [];
    sets.forEach((parts, gi) => {
      if (!parts.length) return;
      const { plates, oversize } = TileCore.packPlates(parts, P.bedX, P.bedY, P.bedGap);
      over.push(...oversize);
      plates.forEach((pl, i) => {
        const name = (two ? groupName(gi) + '_' : '') + 'plate_' + String(i + 1).padStart(2, '0');
        files.push({ name: name + '.stl', data: TileCore.stlBinary(pl.items.map((it) => ({ tris: it.part.tris, dx: it.dx, dy: it.dy, dz: it.dz })), name) });
        list.push(`${name}: ${pl.items.map((it) => it.part.id).join(', ')}`);
      });
    });
    for (const b of boardItem()) files.push({ name: 'BOARD.stl', data: TileCore.stlBinary([{ tris: b.tris, dz: P.bThick }], 'BOARD') });
    if (over.length) list.push('', 'Larger than the bed (printed one per bed): ' + over.join(', '));
    files.push({ name: 'plates.txt', data: list.join('\r\n') });
    files.push({ name: 'assembly.svg', data: TileCore.assemblySVG(G) });
    files.push({ name: 'params.json', data: JSON.stringify(P, null, 2) });
    files.push({ name: 'README.txt', data: readme() });
    download(new Blob([TileCore.makeZip(files)], { type: 'application/zip' }), baseName() + '_plates.zip');
  };

  document.getElementById('ex-svg').onclick = () => download(TileCore.assemblySVG(G), baseName() + '_assembly.svg', 'image/svg+xml');
  document.getElementById('ex-json').onclick = () => download(JSON.stringify(P, null, 2), baseName() + '.json', 'application/json');
  document.getElementById('im-json').onclick = () => document.getElementById('im-file').click();
  document.getElementById('im-file').onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      P = { ...DEFAULTS, ...JSON.parse(await f.text()) };
      syncPanel();
      rebuild(true);
      store();
    } catch (err) {
      alert('Could not read the parameters file: ' + err.message);
    }
    e.target.value = '';
  };
}

document.getElementById('btn-random').onclick = randomComposition;
document.getElementById('btn-reseed').onclick = () => { P.seed = 1 + Math.floor(Math.random() * 9998); syncPanel(); onChange(); };

/* =========================================================================
   START
   ========================================================================= */
buildPanel();
wireExports();
syncPanel();
resize();
rebuild(true);
</script>
</body>
</html>
